name: Validate v2.3 Stage 1 command path

on:
  push:
    branches:
      - rebuild-v2.3-stage1-command-path
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Safe core manifest
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('manifest.json','utf8'));
          if (m.manifest_version !== 3) throw new Error('MV3 required');
          const scripts = (m.content_scripts || []).flatMap(x => x.js || []);
          const expected = [
            'content/credential-ui-guard.js',
            'content/content.js',
            'ui/ui.js',
            'ui/control-center.js',
            'content/composer-bridge.js'
          ];
          if (JSON.stringify(scripts) !== JSON.stringify(expected)) throw new Error(`SAFE CORE changed: ${scripts.join(', ')}`);
          if ((m.content_scripts || []).some(x => x.run_at !== 'document_idle')) throw new Error('All content scripts must remain document_idle');
          if ((m.content_scripts || []).some(x => x.world === 'MAIN')) throw new Error('MAIN-world injection is forbidden in SAFE CORE');
          NODE

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -type f -name '*.js' ! -path './.git/*' -print0)

      - name: Fail-closed native composer routing
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const js = fs.readFileSync('content/composer-bridge.js','utf8');
          const required = [
            "const ROUTING_KEY = 'ld2_native_routing_enabled'",
            "document.addEventListener('click', interceptNativeClick, true)",
            "document.addEventListener('submit', interceptNativeSubmit, true)",
            "execute('lovable-enter')",
            "execute('lovable-send-button')",
            'blockNativeEvent(event)',
            "type: 'LD2_PLAN_ONLY'",
            "type: 'LD2_BUILD_EXECUTE'",
            "type: 'LD2_PLAN_APPROVE'",
            'validCommitSha(commitSha)',
            'GitHub não conectado',
            'GitHub sem autorização de escrita'
          ];
          for (const needle of required) if (!js.includes(needle)) throw new Error(`Missing command-path invariant: ${needle}`);
          if (js.includes('data-ld2-run')) throw new Error('Duplicate Decrypter Execute button must not return');
          if (/window\.fetch\s*=/.test(js) || /XMLHttpRequest\.prototype/.test(js)) throw new Error('Stage 1 must not monkeypatch Lovable networking');
          if (!js.includes('Lovable não recebe o prompt')) throw new Error('Routing state must be explicit to the user');
          NODE

      - name: GitHub commit integrity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const sw = fs.readFileSync('background/service-worker.js','utf8');
          const git = fs.readFileSync('github/git-adapter.js','utf8');
          if (!sw.includes('const result = await applyPlan({ id: bundle.id })')) throw new Error('Build must call authoritative applyPlan');
          if (!sw.includes('await adapter.atomicCommit({')) throw new Error('applyPlan must use atomicCommit');
          if (!git.includes('await this.updateBranch(targetBranch, commit.sha)')) throw new Error('atomicCommit must update branch ref');
          if (!git.includes('commitSha: commit.sha')) throw new Error('atomicCommit must return commit SHA');
          NODE

      - name: Preserve free Gemini default
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const config = fs.readFileSync('settings/config.js','utf8');
          if (!config.includes("billingMode: 'free'")) throw new Error('Gemini free default changed');
          if (!config.includes('zeroCost: true')) throw new Error('Zero-cost default changed');
          NODE

      - name: Package Stage 1 candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f Lovable-Decrypter-v2.3-STAGE1-COMMAND-PATH.zip Lovable-Decrypter-v2.3-STAGE1-COMMAND-PATH.sha256
          zip -qr Lovable-Decrypter-v2.3-STAGE1-COMMAND-PATH.zip . \
            -x '.git/*' '.github/*' 'Lovable-Decrypter-v2.3-STAGE1-COMMAND-PATH.zip'
          sha256sum Lovable-Decrypter-v2.3-STAGE1-COMMAND-PATH.zip | tee Lovable-Decrypter-v2.3-STAGE1-COMMAND-PATH.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Lovable-Decrypter-v2.3-STAGE1-COMMAND-PATH
          path: |
            Lovable-Decrypter-v2.3-STAGE1-COMMAND-PATH.zip
            Lovable-Decrypter-v2.3-STAGE1-COMMAND-PATH.sha256
          if-no-files-found: error
