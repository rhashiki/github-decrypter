name: Validate v2.2 test build

on:
  push:
    branches:
      - control-center-v2.2.0
      - validation-gate-v2.2.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest and referenced files
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          if (manifest.manifest_version !== 3) throw new Error('manifest_version must be 3');
          if (manifest.version !== '2.2.0') throw new Error(`Unexpected manifest version: ${manifest.version}`);
          const refs = [];
          for (const cs of manifest.content_scripts || []) {
            for (const f of cs.js || []) refs.push(f);
            for (const f of cs.css || []) refs.push(f);
          }
          if (manifest.background?.service_worker) refs.push(manifest.background.service_worker);
          for (const f of manifest.background?.scripts || []) refs.push(f);
          for (const group of manifest.web_accessible_resources || []) for (const f of group.resources || []) refs.push(f);
          const missing = [...new Set(refs)].filter(f => !fs.existsSync(f));
          if (missing.length) throw new Error(`Missing manifest files: ${missing.join(', ')}`);
          const config = fs.readFileSync('settings/config.js', 'utf8');
          if (!/VERSION\s*=\s*['"]2\.2\.0['"]/.test(config)) throw new Error('settings/config.js version mismatch');
          const ui = fs.readFileSync('ui/ui.js', 'utf8');
          if (!ui.includes('const VERSION = chrome.runtime.getManifest().version;')) throw new Error('legacy UI must derive version from manifest');
          if (manifest.background?.service_worker !== 'background/service-worker-entry.js') throw new Error('guarded background entrypoint is not active');
          console.log(`Manifest OK: ${new Set(refs).size} referenced files present`);
          NODE

      - name: JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' ! -path './.git/*' -print0)

      - name: Scope Lock behavior
        shell: bash
        run: |
          set -euo pipefail
          cp core/scope-lock.js /tmp/scope-lock.mjs
          node --input-type=module <<'NODE'
          import { evaluateScopeLock, assertScopeLock } from 'file:///tmp/scope-lock.mjs';
          const allowed = bundle => {
            const result = evaluateScopeLock(bundle);
            if (!result.allowed) throw new Error(`Expected allowed: ${result.violations.join(' | ')}`);
            assertScopeLock(bundle);
          };
          const blocked = bundle => {
            const result = evaluateScopeLock(bundle);
            if (result.allowed) throw new Error('Expected Scope Lock block');
            let didBlock = false;
            try { assertScopeLock(bundle); } catch (e) { didBlock = e?.code === 'SCOPE_LOCK_BLOCKED'; }
            if (!didBlock) throw new Error('assertScopeLock did not throw SCOPE_LOCK_BLOCKED');
          };
          allowed({ command: 'Melhore a responsividade da página inicial', plan: { files: [{ path: 'src/pages/Home.tsx', action: 'update' }] } });
          allowed({ command: 'Crie uma migration SQL no Supabase para adicionar a coluna status', plan: { files: [{ path: 'supabase/migrations/20260826_add_status.sql', action: 'create' }] } });
          blocked({ command: 'Melhore o layout da página inicial', plan: { files: [{ path: 'supabase/migrations/20260826_hidden.sql', action: 'create' }] } });
          blocked({ command: 'Ajuste o formulário de login', plan: { files: [{ path: '.env', action: 'update' }] } });
          blocked({ command: 'Melhore o componente antigo', plan: { files: [{ path: 'src/components/Legacy.tsx', action: 'delete' }] } });
          console.log('Scope Lock behavior OK');
          NODE

      - name: Regression Sentinel behavior
        shell: bash
        run: |
          set -euo pipefail
          cp core/regression-sentinel.js /tmp/regression-sentinel.mjs
          node --input-type=module <<'NODE'
          import { evaluateRegressionDelta } from 'file:///tmp/regression-sentinel.mjs';
          const baseEntries = [
            { path: 'src/app.js', type: 'blob', mode: '100644', sha: 'aaa' },
            { path: 'src/legacy.js', type: 'blob', mode: '100644', sha: 'bbb' }
          ];
          const shadowEntries = [
            { path: 'src/app.js', type: 'blob', mode: '100644', sha: 'ccc' },
            { path: 'src/new.js', type: 'blob', mode: '100644', sha: 'ddd' }
          ];
          const files = [
            { path: 'src/app.js', action: 'update', before: 'old', content: 'new' },
            { path: 'src/legacy.js', action: 'delete' },
            { path: 'src/new.js', action: 'create', content: 'new file' }
          ];
          const allowed = evaluateRegressionDelta({ files, baseEntries, shadowEntries });
          if (!allowed.ok) throw new Error(`Expected sentinel allow: ${allowed.violations.join(' | ')}`);
          if (allowed.changedPathCount !== 3) throw new Error('Unexpected changed path count');
          const rogue = evaluateRegressionDelta({ files, baseEntries, shadowEntries: [...shadowEntries, { path: 'src/rogue.js', type: 'blob', mode: '100644', sha: 'eee' }] });
          if (rogue.ok || !rogue.violations.some(x => x.includes('fora do plano'))) throw new Error('Sentinel failed to block rogue path');
          const noop = evaluateRegressionDelta({
            files: [{ path: 'src/app.js', action: 'update', content: 'same' }],
            baseEntries: [{ path: 'src/app.js', type: 'blob', mode: '100644', sha: 'aaa' }],
            shadowEntries: [{ path: 'src/app.js', type: 'blob', mode: '100644', sha: 'aaa' }]
          });
          if (noop.ok || !noop.violations.some(x => x.includes('não mudou'))) throw new Error('Sentinel failed to block silent no-op');
          console.log('Regression Sentinel behavior OK');
          NODE

      - name: Validation Gate behavior
        shell: bash
        run: |
          set -euo pipefail
          cp core/validation-gate.js /tmp/validation-gate.mjs
          node --input-type=module <<'NODE'
          import { evaluateStaticValidation, detectValidationTargets, buildValidationWorkflow } from 'file:///tmp/validation-gate.mjs';

          const invalidJson = evaluateStaticValidation([{ path: 'package.json', action: 'update', content: '{"scripts":' }]);
          if (invalidJson.ok || !invalidJson.violations.some(x => x.includes('JSON inválido'))) throw new Error('Validation Gate did not block invalid JSON');

          const jsonc = evaluateStaticValidation([{ path: 'tsconfig.json', action: 'update', content: '{ // comment\n "compilerOptions": {"strict": true,},\n}' }]);
          if (!jsonc.ok) throw new Error(`Valid JSONC was blocked: ${jsonc.violations.join(' | ')}`);

          const tree = {
            truncated: false,
            tree: [
              { path: 'package.json', type: 'blob', sha: 'pkg' },
              { path: 'package-lock.json', type: 'blob', sha: 'lock' },
              { path: 'src/app.ts', type: 'blob', sha: 'app' },
              { path: '.github/workflows/ci.yml', type: 'blob', sha: 'ci' }
            ]
          };
          const pkgText = JSON.stringify({ scripts: { lint: 'eslint .', typecheck: 'tsc --noEmit', 'test:ci': 'vitest run', build: 'vite build' } });
          const adapter = {
            async getTree() { return tree; },
            async getFileByPath(path) { if (path !== 'package.json') throw new Error('unexpected path'); return { text: pkgText }; }
          };
          const targets = await detectValidationTargets({
            adapter,
            bundle: { plan: { files: [{ path: 'src/app.ts', action: 'update', content: 'export const x = 1;' }] } },
            shadow: { treeSha: 'tree', commitSha: 'commit' }
          });
          const kinds = targets.commands.map(x => x.kind).join(',');
          if (kinds !== 'lint,typecheck,test,build') throw new Error(`Unexpected Validation Gate commands: ${kinds}`);
          if (targets.workflowPaths.length !== 1) throw new Error('Existing workflow discovery failed');

          const workflow = buildValidationWorkflow({ branch: 'ld-validation/test', targets });
          if (!workflow.includes('permissions:\n  contents: read')) throw new Error('Validation runner must be read-only');
          if (!workflow.includes('persist-credentials: false')) throw new Error('Validation runner must not persist checkout credentials');
          if (!workflow.includes('lint · package.json') || !workflow.includes('build · package.json')) throw new Error('Validation runner omitted detected script steps');
          console.log('Validation Gate behavior OK');
          NODE

      - name: Guarded commit wiring
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const entry = fs.readFileSync('background/service-worker-entry.js', 'utf8');
          const guard = fs.readFileSync('core/guarded-commit.js', 'utf8');
          if (!entry.includes('installGuardedCommit();')) throw new Error('guard installer missing from background entry');
          if (!entry.includes("await import('./service-worker.js')")) throw new Error('legacy runtime is not loaded after guard installation');
          const bodyPrepare = guard.indexOf('const shadow = await prepareShadowBuild');
          const bodySentinel = guard.indexOf('const regressionSentinel = await runRegressionSentinel');
          const bodyGate = guard.indexOf('const validationGate = await runValidationGate');
          const bodyApply = guard.indexOf('const result = await applyShadowBuild');
          if (!(bodyPrepare >= 0 && bodyPrepare < bodySentinel && bodySentinel < bodyGate && bodyGate < bodyApply)) {
            throw new Error('guarded pipeline order must be Shadow Build -> Regression Sentinel -> Validation Gate -> apply');
          }
          console.log('Guarded pipeline wiring OK');
          NODE

      - name: Safety invariants
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'LD_LICENSE_PRIVATE_JWK|MERCADOPAGO_ACCESS_TOKEN|MERCADOPAGO_WEBHOOK_SECRET|LD_OWNER_SECRET' \
            --include='*.js' --include='*.json' --include='*.html' . \
            --exclude-dir=.git --exclude-dir=.github
          node <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const main = (m.content_scripts || []).filter(x => x.world === 'MAIN');
          if (main.length !== 0) throw new Error('No content script may execute in MAIN world');
          const scripts = (m.content_scripts || []).flatMap(x => x.js || []);
          if (scripts.includes('content/route-probe.js') || fs.existsSync('content/route-probe.js')) throw new Error('Legacy route probe must remain removed');
          NODE

      - name: Package test ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f Lovable-Decrypter-v2.2.0-test.zip
          zip -qr Lovable-Decrypter-v2.2.0-test.zip . \
            -x '.git/*' '.github/*' 'Lovable-Decrypter-v2.2.0-test.zip'
          sha256sum Lovable-Decrypter-v2.2.0-test.zip | tee Lovable-Decrypter-v2.2.0-test.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Lovable-Decrypter-v2.2.0-test
          path: |
            Lovable-Decrypter-v2.2.0-test.zip
            Lovable-Decrypter-v2.2.0-test.sha256
          if-no-files-found: error
