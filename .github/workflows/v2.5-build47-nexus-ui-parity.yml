name: v2.5 Build 47 · Nexus UI Parity

on:
  push:
    branches: [main, v2.5-build47-nexus-ui-parity, v2.5-build50-project-intelligence-ux]
    paths:
      - 'ui/nexus-parity-v47.js'
      - 'ui/nexus-parity-v47.css'
      - 'ui/ui-kernel-v48.js'
      - 'ui/ui-kernel-v48.css'
      - 'manifest.json'
      - 'settings/config.js'
      - 'release/runtime-package.json'
      - '.github/workflows/v2.5-build47-nexus-ui-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check ui/nexus-parity-v47.js
          node --check ui/ui-kernel-v48.js
      - name: Validate cumulative succession
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const cfg=fs.readFileSync('settings/config.js','utf8');
          const pkg=JSON.parse(fs.readFileSync('release/runtime-package.json','utf8'));
          const parts=v=>String(v).split('.').map(Number);const ge=(v,f)=>{const a=parts(v),b=parts(f);for(let i=0;i<Math.max(a.length,b.length);i++){const x=a[i]||0,y=b[i]||0;if(x!==y)return x>y;}return true;};
          if(!ge(m.version,'2.5.47')) throw new Error('version predates Build47');
          if(!cfg.includes(`VERSION = '${m.version}'`)) throw new Error('settings version mismatch');
          if(pkg.candidate!==m.version) throw new Error('package candidate mismatch');
          const early=(m.content_scripts||[]).find(x=>(x.js||[]).includes('content/early-boot-sentinel.js'));
          if(!early||early.run_at!=='document_start'||early.all_frames!==true||early.match_about_blank!==true) throw new Error('zero-gap boot regression');
          const app=(m.content_scripts||[]).find(x=>x.run_at==='document_idle'&&x.all_frames===false);
          if(!app) throw new Error('main runtime missing');
          const successor=(app.js||[]).includes('ui/ui-kernel-v48.js');
          if(successor){
            if((app.js||[]).includes('ui/nexus-parity-v47.js')) throw new Error('v47 JS must stay superseded by UI Kernel');
            if(!(app.css||[]).includes('ui/ui-kernel-v48.css')) throw new Error('UI Kernel CSS missing');
            if((app.css||[]).indexOf('ui/ui-kernel-v48.css') <= (app.css||[]).indexOf('ui/nexus-parity-v47.css')) throw new Error('successor CSS must override v47 legacy CSS');
          }else{
            if(!(app.js||[]).includes('ui/nexus-parity-v47.js')||!(app.css||[]).includes('ui/nexus-parity-v47.css')) throw new Error('Build47 wiring missing without successor');
          }
          if(JSON.stringify(m.permissions)!==JSON.stringify(['storage','tabs','downloads','unlimitedStorage','alarms'])) throw new Error('permissions changed');
          NODE
      - name: Validate approved visual lineage
        run: |
          node - <<'NODE'
          const fs=require('fs');const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));const app=(m.content_scripts||[]).find(x=>x.run_at==='document_idle'&&x.all_frames===false);const successor=(app.js||[]).includes('ui/ui-kernel-v48.js');
          const css=fs.readFileSync(successor?'ui/ui-kernel-v48.css':'ui/nexus-parity-v47.css','utf8');
          for(const token of successor?['conic-gradient','backdrop-filter:blur(30px)','clamp(','#ef3da3','#8358ff','#4f7cff']:['width:50px!important','#ef3da3','#8358ff','#4f7cff']) if(!css.includes(token)) throw new Error('Nexus lineage token missing '+token);
          NODE
      - name: Validate non-invasive boundary
        run: |
          node - <<'NODE'
          const fs=require('fs');const s=['ui/nexus-parity-v47.js','ui/ui-kernel-v48.js'].map(p=>fs.readFileSync(p,'utf8')).join('\n');
          const forbidden=[[/XMLHttpRequest\.prototype\.(?:open|send)\s*=(?!=)/,'XHR prototype assignment'],[/navigator\.sendBeacon\s*=(?!=)/,'sendBeacon assignment'],[/window\.postMessage\s*\(/,'page-world postMessage bridge'],[/\beval\s*\(/,'eval'],[/new\s+Function\s*\(/,'new Function']];
          for(const [rx,label] of forbidden) if(rx.test(s)) throw new Error('forbidden '+label);
          NODE
      - name: Release preflight candidate
        run: node scripts/release-preflight.mjs --candidate
