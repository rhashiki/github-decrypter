name: Validate v2.2.1 UI hotfix

on:
  push:
    branches:
      - hotfix-v2.2.1-ui-activation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version and manifest integrity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          if (m.manifest_version !== 3) throw new Error('manifest_version must be 3');
          if (m.version !== '2.2.1') throw new Error(`Expected 2.2.1, got ${m.version}`);
          const config = fs.readFileSync('settings/config.js', 'utf8');
          if (!/VERSION\s*=\s*['"]2\.2\.1['"]/.test(config)) throw new Error('Runtime version mismatch');
          const refs = [];
          for (const cs of m.content_scripts || []) {
            for (const f of cs.js || []) refs.push(f);
            for (const f of cs.css || []) refs.push(f);
          }
          if (m.background?.service_worker) refs.push(m.background.service_worker);
          for (const f of m.background?.scripts || []) refs.push(f);
          for (const group of m.web_accessible_resources || []) for (const f of group.resources || []) refs.push(f);
          const missing = [...new Set(refs)].filter(f => !fs.existsSync(f));
          if (missing.length) throw new Error(`Missing manifest files: ${missing.join(', ')}`);
          if ((m.content_scripts || []).some(x => x.world === 'MAIN')) throw new Error('MAIN-world scripts are forbidden');
          NODE

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' ! -path './.git/*' -print0)

      - name: Launcher and activation regression gate
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const js = fs.readFileSync('ui/control-center.js', 'utf8');
          const css = fs.readFileSync('ui/control-center.css', 'utf8');
          if (!js.includes('chrome.runtime.getManifest().version')) throw new Error('Control Center must derive version from manifest');
          if (js.includes('messages.children.length')) throw new Error('Control Center still depends on legacy chat messages');
          if (!js.includes('gate.hidden = false')) throw new Error('Activation gate is not fail-closed on boot');
          if (!js.includes('LICENSE_TIMEOUT_MS')) throw new Error('Activation validation timeout missing');
          if (!js.includes('ld2-legacy-hooks')) throw new Error('Legacy launcher hooks are not isolated');
          if (!css.includes('.ld2-status{display:none!important}')) throw new Error('Legacy status strip remains visible');
          if (!css.includes('.ld2-legacy-hooks{display:none!important}')) throw new Error('Legacy chat remains visible');
          if (!css.includes('width:min(560px')) throw new Error('Control Center width regression');
          NODE

      - name: Native composer visual regression gate
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const js = fs.readFileSync('content/composer-bridge.js', 'utf8');
          const css = fs.readFileSync('ui/composer-bridge.css', 'utf8');
          if (!js.includes('ld2-bridge-top') || !js.includes('ld2-bridge-bottom')) throw new Error('Composer bridge must render two rows');
          if (!js.includes('authorized(') || !js.includes("LD2_LICENSE_STATUS")) throw new Error('Composer bridge is not license-gated');
          if (!js.includes("host.classList.add('ld2-composer-highlight')")) throw new Error('Composer host highlight missing');
          if (!css.includes('.ld2-composer-highlight{outline:2px')) throw new Error('Composer outline/glow missing');
          if (!css.includes('.ld2-bridge-top') || !css.includes('.ld2-bridge-bottom')) throw new Error('Two-row bridge styling missing');
          if (/\.ld2-bridge-status\{[^}]*white-space:\s*nowrap/s.test(css)) throw new Error('Status text must be allowed to wrap');
          if (/font-size:\s*[89](?:\.\d+)?px/.test(css)) throw new Error('Unreadable 8-9px type reintroduced in composer bridge');
          NODE

      - name: Preserve security and zero-cost invariants
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const config = fs.readFileSync('settings/config.js', 'utf8');
          if (!config.includes("billingMode: 'free'")) throw new Error('Gemini free default changed');
          if (!config.includes('zeroCost: true')) throw new Error('Gemini zero-cost default changed');
          const entry = fs.readFileSync('background/service-worker-entry.js', 'utf8');
          if (!entry.includes('installGuardedCommit();')) throw new Error('Guarded commit installer missing');
          NODE

      - name: Package hotfix candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f Lovable-Decrypter-v2.2.1-hotfix-test.zip
          zip -qr Lovable-Decrypter-v2.2.1-hotfix-test.zip . \
            -x '.git/*' '.github/*' 'Lovable-Decrypter-v2.2.1-hotfix-test.zip'
          sha256sum Lovable-Decrypter-v2.2.1-hotfix-test.zip | tee Lovable-Decrypter-v2.2.1-hotfix-test.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Lovable-Decrypter-v2.2.1-hotfix-test
          path: |
            Lovable-Decrypter-v2.2.1-hotfix-test.zip
            Lovable-Decrypter-v2.2.1-hotfix-test.sha256
          if-no-files-found: error
