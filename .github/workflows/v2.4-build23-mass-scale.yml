name: Validate v2.4 Build 23 Mass Scale

on:
  push:
    branches:
      - rebuild-v2.4-build23-mass-scale
  pull_request:
    branches:
      - main
      - rebuild-v2.4-build23-mass-scale

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Manifest and validated boot remain intact
        run: |
          node <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          if(m.version!=='2.4.23') throw new Error(`Unexpected version ${m.version}`);
          if(m.version_name!=='2.4 Build 23') throw new Error('Build 23 version_name missing');
          if(!/Build 23 · Mass Scale/.test(m.action?.default_title||'')) throw new Error('Build 23 title missing');
          const js=m.content_scripts?.[0]?.js||[];
          const first=['content/ui-shell-bootstrap.js','content/content.js','content/ui-mount-guardian.js','ui/ui.js'];
          first.forEach((f,i)=>{if(js[i]!==f) throw new Error(`Validated boot order changed at ${i}: ${js[i]}`)});
          if(!js.includes('content/commercial-runtime.js')||!js.includes('content/build18-reconciliation.js')) throw new Error('Validated runtimes missing');
          NODE
          grep -q "export const VERSION = '2.4.23'" settings/config.js

      - name: Build 23 source syntax
        run: |
          node --check tests/build23-mass-scale-sim.mjs
          python -m py_compile runtime/decrypter-local/worker-agent.py
          npx --yes esbuild supabase/functions/ld-local-router/index.ts --bundle --platform=neutral --external:jsr:* --outfile=/tmp/ld-local-router.js
          npx --yes esbuild supabase/functions/ld-local-control/index.ts --bundle --platform=neutral --external:jsr:* --outfile=/tmp/ld-local-control.js

      - name: Mass-scale executable simulations
        run: node tests/build23-mass-scale-sim.mjs

      - name: Metadata-only queue and atomic lease contract
        run: |
          grep -qi 'for update skip locked' supabase/migrations/20260828234500_build23_mass_scale.sql
          grep -q "payload_persisted',false" supabase/migrations/20260828234500_build23_mass_scale.sql
          grep -q 'ld_claim_inference_worker' supabase/functions/ld-local-router/index.ts
          grep -q 'ld_finish_inference_job' supabase/functions/ld-local-router/index.ts
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('supabase/migrations/20260828234500_build23_mass_scale.sql','utf8');
          const jobs=s.slice(s.indexOf('create table if not exists public.ld_inference_jobs'),s.indexOf('create index if not exists ld_inference_jobs_pool_status_idx'));
          if(/\b(prompt|content|payload|attachment|source_code|project_context)\b\s+(text|jsonb|bytea)/i.test(jobs)) throw new Error('Inference queue must not persist customer payload');
          NODE

      - name: Pool security and rate limiting
        run: |
          for t in ld_inference_pools ld_inference_workers ld_inference_jobs ld_inference_leases ld_inference_rate_windows ld_inference_scale_decisions; do
            grep -q "alter table public.$t enable row level security" supabase/migrations/20260828234500_build23_mass_scale.sql
            grep -q "revoke all on table public.$t from anon, authenticated" supabase/migrations/20260828234500_build23_mass_scale.sql
          done
          grep -q 'POOL_RATE_LIMITED' supabase/migrations/20260828234500_build23_mass_scale.sql
          grep -q 'grant execute on function public.ld_claim_inference_worker(text,uuid) to service_role' supabase/migrations/20260828234500_build23_mass_scale.sql
          if grep -qi 'security definer' supabase/migrations/20260828234500_build23_mass_scale.sql supabase/migrations/20260828234600_build23_pool_health_gc.sql; then
            echo 'Build 23 RPCs must stay SECURITY INVOKER'
            exit 1
          fi

      - name: Router preserves Build 18 contract
        run: |
          grep -q "endsWith('/v1/models')" supabase/functions/ld-local-router/index.ts
          grep -q "endsWith('/v1/chat/completions')" supabase/functions/ld-local-router/index.ts
          grep -q 'DECRYPTER_LOCAL_TOKEN' supabase/functions/ld-local-router/index.ts
          grep -q 'LOCAL_STREAMING_DISABLED' supabase/functions/ld-local-router/index.ts
          grep -q "health-demand',true" supabase/functions/ld-local-router/index.ts
          if grep -Eq 'generativelanguage\.googleapis\.com|cross.provider.*retry' supabase/functions/ld-local-router/index.ts; then
            echo 'Router must not implement provider fallback'
            exit 1
          fi

      - name: Worker health and observability contract
        run: |
          grep -q 'DECRYPTER_WORKER_ENDPOINT must use https://' runtime/decrypter-local/worker-agent.py
          grep -q 'vllm:num_requests_running' runtime/decrypter-local/worker-agent.py
          grep -q 'vllm:num_requests_waiting' runtime/decrypter-local/worker-agent.py
          grep -q 'vllm:kv_cache_usage_perc' runtime/decrypter-local/worker-agent.py
          grep -q 'decrypter-worker-agent:' runtime/decrypter-local/compose.yaml
          grep -q "u.protocol!=='https:'" supabase/functions/ld-local-control/index.ts
          grep -q "reconcile(sb,'heartbeat')" supabase/functions/ld-local-control/index.ts

      - name: Provider-neutral autoscaling contract
        run: |
          grep -q 'DECRYPTER_GPU_SCALER_URL' supabase/functions/ld-local-router/index.ts
          grep -q 'DECRYPTER_GPU_SCALER_TOKEN' supabase/functions/ld-local-control/index.ts
          grep -q "schema:'ld-gpu-scale/1'" supabase/functions/ld-local-router/index.ts
          grep -q 'provider_neutral:true' supabase/functions/ld-local-control/index.ts
          grep -q 'scale_down_cooldown_seconds' supabase/migrations/20260828234500_build23_mass_scale.sql
          grep -q 'HEARTBEAT_EXPIRED' supabase/migrations/20260828234600_build23_pool_health_gc.sql

      - name: Avoid nested Edge Function fan-out
        run: |
          if grep -E '/functions/v1/' supabase/functions/ld-local-router/index.ts supabase/functions/ld-local-control/index.ts; then
            echo 'Build 23 control plane should call DB RPCs or external workers/actuator, not nested Edge Functions'
            exit 1
          fi

      - name: Preserve execution and gateway authority
        run: |
          BASE=8dc966a438b72424217c305b57a39799e5533c13
          git diff --quiet "$BASE"...HEAD -- supabase/functions/ld-command/index.ts
          git diff --quiet "$BASE"...HEAD -- supabase/functions/ld-model-gateway/index.ts
          grep -q 'cross_provider_fallback:false' supabase/functions/ld-model-gateway/index.ts
          grep -q 'MODEL_GATEWAY_REQUIRED' supabase/functions/ld-command/index.ts

      - name: No invasive browser changes or leaked backend secrets
        run: |
          BASE=8dc966a438b72424217c305b57a39799e5533c13
          ADDED="$(git diff -U0 "$BASE"...HEAD -- content ui background settings manifest.json | grep '^+' | grep -v '^+++' || true)"
          if printf '%s\n' "$ADDED" | grep -E 'new[[:space:]]+MutationObserver|window\.fetch[[:space:]]*=|globalThis\.fetch[[:space:]]*=|XMLHttpRequest\.prototype|navigator\.sendBeacon[[:space:]]*='; then
            echo 'Forbidden invasive browser patch detected'
            exit 1
          fi
          if grep -E 'DECRYPTER_GPU_SCALER_TOKEN|DECRYPTER_WORKER_SECRET|SUPABASE_SERVICE_ROLE_KEY' settings/config.js manifest.json; then
            echo 'Backend secret identifier leaked into extension configuration'
            exit 1
          fi

      - name: Build 23 scope lock
        run: |
          BASE=8dc966a438b72424217c305b57a39799e5533c13
          FAILED=0
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/v2.4-build23-mass-scale.yml|manifest.json|settings/config.js|runtime/decrypter-local/.env.example|runtime/decrypter-local/README.md|runtime/decrypter-local/compose.yaml|runtime/decrypter-local/worker-agent.py|supabase/functions/ld-local-router/index.ts|supabase/functions/ld-local-control/index.ts|supabase/migrations/20260828234500_build23_mass_scale.sql|supabase/migrations/20260828234600_build23_pool_health_gc.sql|docs/BUILD23_MASS_SCALE.md|tests/build23-mass-scale-sim.mjs) ;;
              *) echo "Unexpected Build 23 modification: $path"; FAILED=1 ;;
            esac
          done < <(git diff --name-only "$BASE"...HEAD)
          test "$FAILED" -eq 0

      - name: Documentation contract
        run: |
          grep -q 'sem payload' docs/BUILD23_MASS_SCALE.md
          grep -q 'scale-to-zero' -i docs/BUILD23_MASS_SCALE.md
          grep -q 'provider-neutral' -i docs/BUILD23_MASS_SCALE.md
          grep -q 'não publica OTA/release oficial automaticamente' docs/BUILD23_MASS_SCALE.md

      - name: Package Build 23 candidate
        run: |
          rm -rf /tmp/ld-build23 && mkdir -p /tmp/ld-build23
          rsync -a ./ /tmp/ld-build23/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='supabase' \
            --exclude='runtime' \
            --exclude='docs' \
            --exclude='tests' \
            --exclude='benchmark' \
            --exclude='training' \
            --exclude='*.zip' \
            --exclude='*.sha256'
          test -f /tmp/ld-build23/manifest.json
          test -f /tmp/ld-build23/content/commercial-runtime.js
          cd /tmp/ld-build23
          zip -qr "$GITHUB_WORKSPACE/Lovable-Decrypter-v2.4-BUILD23-MASS-SCALE.zip" .
          cd "$GITHUB_WORKSPACE"
          sha256sum Lovable-Decrypter-v2.4-BUILD23-MASS-SCALE.zip > Lovable-Decrypter-v2.4-BUILD23-MASS-SCALE.sha256
          if unzip -l Lovable-Decrypter-v2.4-BUILD23-MASS-SCALE.zip | grep -qE ' (supabase|runtime|docs|tests|benchmark|training)/'; then exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: Lovable-Decrypter-v2.4-BUILD23-MASS-SCALE
          path: |
            Lovable-Decrypter-v2.4-BUILD23-MASS-SCALE.zip
            Lovable-Decrypter-v2.4-BUILD23-MASS-SCALE.sha256
          if-no-files-found: error
