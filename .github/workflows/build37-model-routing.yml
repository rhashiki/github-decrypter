name: GitHub Decrypter Build 37 — Model Routing

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - build/37-model-routing

permissions:
  contents: read

jobs:
  model-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm through Corepack
        run: corepack enable
      - name: Install workspace toolchain
        run: pnpm install --no-frozen-lockfile
      - name: Validate Architecture Guardian through Build 37
        run: pnpm run guardian
      - name: Validate Builds 4–37 and TypeScript workspaces
        run: pnpm run ci
      - name: Validate modern engine preservation
        run: node scripts/test-build4-modern-engine-preservation.mjs