name: Validate v2.4 Build 2 GitHub AutoSync

on:
  push:
    branches:
      - rebuild-v2.4-build2-github-autosync
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build 1 Project Runtime preserved
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const scripts = (m.content_scripts || []).flatMap(x => x.js || []);
          for (const required of ['content/lovable-project-runtime.js','ui/project-context.js','ui/github-autosync.js']) {
            if (!scripts.includes(required)) throw new Error(`Missing ${required}`);
          }
          if ((m.content_scripts || []).some(x => x.run_at !== 'document_idle')) throw new Error('All content scripts must remain document_idle');
          if ((m.content_scripts || []).some(x => x.world === 'MAIN')) throw new Error('MAIN world forbidden');
          NODE

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -type f -name '*.js' ! -path './.git/*' -print0)

      - name: GitHub AutoSync invariants
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const bg = fs.readFileSync('background/github-autosync-runtime.js','utf8');
          const gh = fs.readFileSync('background/github-app-runtime.js','utf8');
          const entry = fs.readFileSync('background/service-worker-entry.js','utf8');
          const ui = fs.readFileSync('ui/github-autosync.js','utf8');
          for (const needle of [
            "const PORT_NAME = 'ld2-github-autosync'",
            "requestGithubAppBackend('status')",
            'findAuthorizedRepository',
            "source: 'lovable_gitsync'",
            "source: 'lovable_gitsync_blocked'",
            "state === 'linked'",
            'repository_not_authorized',
            'authorization_required',
            'projectMappings'
          ]) if (!bg.includes(needle)) throw new Error(`AutoSync invariant missing: ${needle}`);
          if (!gh.includes('export async function requestGithubAppBackend')) throw new Error('GitHub App status is not shared safely with AutoSync');
          if (!entry.includes('installGithubAutoSyncRuntime')) throw new Error('AutoSync runtime not installed');
          if (!ui.includes("window.addEventListener('ld2:project-context'")) throw new Error('Project context does not trigger AutoSync');
          if (!ui.includes('GITHUB APP')) throw new Error('AutoSync state missing from project UI');
          NODE

      - name: Fail closed repository mapping
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const bg = fs.readFileSync('background/github-autosync-runtime.js','utf8');
          for (const state of ['github_status_error','app_not_configured','authorization_required','repository_not_authorized']) {
            if (!bg.includes(`neutralizeMapping(projectId, git, '${state}')`)) throw new Error(`Missing fail-closed state ${state}`);
          }
          if (!bg.includes("owner: ''") || !bg.includes("repo: ''")) throw new Error('Blocked mapping must neutralize owner/repo');
          if (!bg.includes("repo?.full_name").valueOf) {}
          if (!bg.includes('toLowerCase()')) throw new Error('Repository matching must be case-insensitive');
          NODE

      - name: No host monkeypatch or Lovable token persistence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          for (const file of ['ui/github-autosync.js','content/lovable-project-runtime.js']) {
            const js = fs.readFileSync(file,'utf8');
            if (/MutationObserver/.test(js)) throw new Error(`${file} must not observe the Lovable DOM`);
            if (/window\.fetch\s*=|XMLHttpRequest\.prototype|history\.pushState\s*=|history\.replaceState\s*=/.test(js)) throw new Error(`${file} monkeypatches host APIs`);
          }
          const bg = fs.readFileSync('background/github-autosync-runtime.js','utf8');
          if (/service_role|SUPABASE_DB_URL|stsTokenManager|firebaseLocalStorageDb/.test(bg)) throw new Error('AutoSync background must not receive Lovable/Supabase credentials');
          NODE

      - name: Preserve command routing and integrations
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const composer = fs.readFileSync('content/composer-bridge.js','utf8');
          const entry = fs.readFileSync('background/service-worker-entry.js','utf8');
          for (const needle of ["const ROUTING_KEY = 'ld2_native_routing_enabled'","document.addEventListener('click', interceptNativeClick, true)",'validCommitSha(commitSha)',"type: 'LD2_BUILD_EXECUTE'"]) {
            if (!composer.includes(needle)) throw new Error(`Routing invariant missing: ${needle}`);
          }
          for (const needle of ['installGithubAppRuntime','installGithubAutoSyncRuntime','installSupabaseOAuthRuntime','installProjectMigrationRuntime','installLovableProjectRuntime']) {
            if (!entry.includes(needle)) throw new Error(`${needle} missing`);
          }
          NODE

      - name: Preserve free Gemini default
        shell: bash
        run: |
          set -euo pipefail
          grep -q "billingMode: 'free'" settings/config.js
          grep -q 'zeroCost: true' settings/config.js

      - name: Package Build 2 candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f Lovable-Decrypter-v2.4-BUILD2-GITHUB-AUTOSYNC.zip Lovable-Decrypter-v2.4-BUILD2-GITHUB-AUTOSYNC.sha256
          zip -qr Lovable-Decrypter-v2.4-BUILD2-GITHUB-AUTOSYNC.zip . \
            -x '.git/*' '.github/*' 'supabase/*' 'Lovable-Decrypter-v2.4-BUILD2-GITHUB-AUTOSYNC.zip'
          unzip -l Lovable-Decrypter-v2.4-BUILD2-GITHUB-AUTOSYNC.zip | grep -q ' manifest.json$'
          ! unzip -l Lovable-Decrypter-v2.4-BUILD2-GITHUB-AUTOSYNC.zip | grep -q ' supabase/'
          sha256sum Lovable-Decrypter-v2.4-BUILD2-GITHUB-AUTOSYNC.zip | tee Lovable-Decrypter-v2.4-BUILD2-GITHUB-AUTOSYNC.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Lovable-Decrypter-v2.4-BUILD2-GITHUB-AUTOSYNC
          path: |
            Lovable-Decrypter-v2.4-BUILD2-GITHUB-AUTOSYNC.zip
            Lovable-Decrypter-v2.4-BUILD2-GITHUB-AUTOSYNC.sha256
          if-no-files-found: error
