name: v2.6 Build 74 · Native Sessions Engine
on:
  push:
    branches: [main, v2.6-build74-multi-agent-runtime-ui-native-sessions]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check core/native-agent-sessions.js
      - run: node --check background/native-agent-session-runtime.js
      - run: node --check content/native-agent-session-client.js
      - run: node --check background/service-worker-entry.js
      - run: node tests/build74-multi-agent-runtime-ui-native-sessions.test.mjs
      - name: Canonical UI gate on Build82 successors
        if: startsWith(github.head_ref || github.ref_name, 'v2.6.82-')
        run: node scripts/test-build82-canonical-ui.mjs
