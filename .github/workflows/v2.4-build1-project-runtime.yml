name: Validate v2.4 Build 1 Project Runtime

on:
  push:
    branches:
      - rebuild-v2.4-build1-lovable-project-runtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Project Runtime content isolation
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('manifest.json','utf8'));
          if (m.manifest_version !== 3) throw new Error('MV3 required');
          const scripts = (m.content_scripts || []).flatMap(x => x.js || []);
          for (const required of ['content/lovable-project-runtime.js','ui/project-context.js']) {
            if (!scripts.includes(required)) throw new Error(`Missing ${required}`);
          }
          if ((m.content_scripts || []).some(x => x.run_at !== 'document_idle')) throw new Error('All content scripts must remain document_idle');
          if ((m.content_scripts || []).some(x => x.world === 'MAIN')) throw new Error('MAIN-world injection forbidden');
          if ((m.content_scripts || []).some(x => x.all_frames !== false)) throw new Error('Project Runtime must stay in top frame only');
          NODE

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -type f -name '*.js' ! -path './.git/*' -print0)

      - name: Lovable Runtime invariants
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const runtime = fs.readFileSync('content/lovable-project-runtime.js','utf8');
          const bg = fs.readFileSync('background/lovable-project-runtime.js','utf8');
          const entry = fs.readFileSync('background/service-worker-entry.js','utf8');
          const ui = fs.readFileSync('ui/project-context.js','utf8');
          for (const needle of [
            'firebaseLocalStorageDb',
            'stsTokenManager',
            '/cloud/config',
            '/gitsync',
            "git/file?path=",
            "type = 'lovable_cloud'",
            "type = 'supabase'",
            "new CustomEvent('ld2:project-context'",
            "const PORT_NAME = 'ld2-project-runtime'"
          ]) {
            if (!(runtime + bg).includes(needle)) throw new Error(`Runtime invariant missing: ${needle}`);
          }
          if (!entry.includes('installLovableProjectRuntime')) throw new Error('Background Project Runtime not installed');
          for (const label of ['FRAMEWORK','WORKSPACE','GITSYNC','BACKEND','PREVIEW']) {
            if (!ui.includes(label)) throw new Error(`Project context UI missing ${label}`);
          }
          NODE

      - name: No Lovable DOM/network monkeypatch
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          for (const file of ['content/lovable-project-runtime.js','ui/project-context.js']) {
            const js = fs.readFileSync(file,'utf8');
            if (/MutationObserver/.test(js)) throw new Error(`${file} must not observe the Lovable DOM`);
            if (/window\.fetch\s*=|XMLHttpRequest\.prototype|history\.pushState\s*=|history\.replaceState\s*=/.test(js)) throw new Error(`${file} monkeypatches host APIs`);
          }
          NODE

      - name: Lovable credential persistence gate
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const runtime = fs.readFileSync('content/lovable-project-runtime.js','utf8');
          const bg = fs.readFileSync('background/lovable-project-runtime.js','utf8');
          if (/chrome\.storage\.(local|sync|session).*token/i.test(runtime)) throw new Error('Content runtime persists Lovable token');
          if (/Authorization[^\n]+chrome\.storage/i.test(runtime)) throw new Error('Authorization token must stay in memory');
          if (/accessToken|stsTokenManager|Authorization:\s*`Bearer/.test(bg)) throw new Error('Background snapshot runtime must never receive Lovable auth token');
          const forbiddenSnapshotFields = ['accessToken','access_token','refreshToken','refresh_token','service_role','db_url','password','secret'];
          for (const field of forbiddenSnapshotFields) {
            if (new RegExp(`\\b${field}\\b`, 'i').test(bg)) throw new Error(`Background snapshot exposes forbidden field: ${field}`);
          }
          for (const required of ['projectId','workspace','gitSync','backend','preview','diagnostics']) {
            if (!bg.includes(required)) throw new Error(`Snapshot whitelist missing ${required}`);
          }
          NODE

      - name: Preserve fail-closed composer routing
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const js = fs.readFileSync('content/composer-bridge.js','utf8');
          for (const needle of ["const ROUTING_KEY = 'ld2_native_routing_enabled'","document.addEventListener('click', interceptNativeClick, true)","execute('lovable-enter')",'validCommitSha(commitSha)',"type: 'LD2_BUILD_EXECUTE'"]) {
            if (!js.includes(needle)) throw new Error(`Routing invariant missing: ${needle}`);
          }
          NODE

      - name: Preserve GitHub App Supabase OAuth and migrations
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const entry = fs.readFileSync('background/service-worker-entry.js','utf8');
          for (const needle of ['installGithubAppRuntime','installSupabaseOAuthRuntime','installProjectMigrationRuntime','installLovableProjectRuntime']) {
            if (!entry.includes(needle)) throw new Error(`${needle} missing`);
          }
          NODE

      - name: Preserve free Gemini default
        shell: bash
        run: |
          set -euo pipefail
          grep -q "billingMode: 'free'" settings/config.js
          grep -q 'zeroCost: true' settings/config.js

      - name: Package Build 1 candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f Lovable-Decrypter-v2.4-BUILD1-PROJECT-RUNTIME.zip Lovable-Decrypter-v2.4-BUILD1-PROJECT-RUNTIME.sha256
          zip -qr Lovable-Decrypter-v2.4-BUILD1-PROJECT-RUNTIME.zip . \
            -x '.git/*' '.github/*' 'supabase/*' 'Lovable-Decrypter-v2.4-BUILD1-PROJECT-RUNTIME.zip'
          unzip -l Lovable-Decrypter-v2.4-BUILD1-PROJECT-RUNTIME.zip | grep -q ' manifest.json$'
          ! unzip -l Lovable-Decrypter-v2.4-BUILD1-PROJECT-RUNTIME.zip | grep -q ' supabase/'
          sha256sum Lovable-Decrypter-v2.4-BUILD1-PROJECT-RUNTIME.zip | tee Lovable-Decrypter-v2.4-BUILD1-PROJECT-RUNTIME.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Lovable-Decrypter-v2.4-BUILD1-PROJECT-RUNTIME
          path: |
            Lovable-Decrypter-v2.4-BUILD1-PROJECT-RUNTIME.zip
            Lovable-Decrypter-v2.4-BUILD1-PROJECT-RUNTIME.sha256
          if-no-files-found: error
