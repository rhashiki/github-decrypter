name: Validate v2.4 Build 3 Editor Direto

on:
  push:
    branches:
      - rebuild-v2.4-build3-editor-direto
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build 3 content isolation
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('manifest.json','utf8'));
          if (m.manifest_version !== 3) throw new Error('MV3 required');
          const scripts = (m.content_scripts || []).flatMap(x => x.js || []);
          const expected = [
            'content/credential-ui-guard.js',
            'content/lovable-project-runtime.js',
            'content/content.js',
            'ui/ui.js',
            'ui/control-center.js',
            'ui/project-context.js',
            'ui/github-autosync.js',
            'ui/project-migration.js',
            'content/lovable-sync-verifier.js',
            'content/composer-bridge-v3.js'
          ];
          if (JSON.stringify(scripts) !== JSON.stringify(expected)) throw new Error(`Unexpected content scripts: ${scripts.join(', ')}`);
          if (scripts.includes('content/composer-bridge.js')) throw new Error('Legacy composer bridge must not load');
          if (fs.existsSync('content/composer-bridge.js')) throw new Error('Legacy composer bridge must not ship in Build 3');
          if ((m.content_scripts || []).some(x => x.run_at !== 'document_idle')) throw new Error('All content scripts must remain document_idle');
          if ((m.content_scripts || []).some(x => x.world === 'MAIN')) throw new Error('MAIN world forbidden');
          if ((m.content_scripts || []).some(x => x.all_frames !== false)) throw new Error('Top frame only required');
          const css = (m.content_scripts || []).flatMap(x => x.css || []);
          if (!css.includes('ui/editor-direct-v3.css')) throw new Error('Editor Direct v3 CSS missing');
          NODE

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -type f -name '*.js' ! -path './.git/*' -print0)

      - name: Plan and Build semantics
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const js = fs.readFileSync('content/composer-bridge-v3.js','utf8');
          for (const needle of [
            "type: 'LD2_PLAN_ONLY'",
            "type: 'LD2_PLAN_PREPARE'",
            "type: 'LD2_PLAN_APPLY'",
            'validateShadow(bundle)',
            'Shadow Build pronto para revisão',
            'Aplicar no GitHub',
            'validCommitSha(commitSha)',
            'ZERO WRITE',
            'verifyLovableSync(commitSha)'
          ]) if (!js.includes(needle)) throw new Error(`Editor invariant missing: ${needle}`);
          if (js.includes("type: 'LD2_BUILD_EXECUTE'")) throw new Error('Build 3 composer must never call direct build execution');
          const prepareAt = js.indexOf("type: 'LD2_PLAN_PREPARE'");
          const applyAt = js.indexOf("type: 'LD2_PLAN_APPLY'");
          if (prepareAt < 0 || applyAt < prepareAt) throw new Error('Apply must occur after shadow preparation path');
          NODE

      - name: GitHub App and AutoSync preflight
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const js = fs.readFileSync('content/composer-bridge-v3.js','utf8');
          const auto = fs.readFileSync('background/github-autosync-runtime.js','utf8');
          const adapter = fs.readFileSync('github/git-adapter.js','utf8');
          for (const needle of [
            "chrome.runtime.connect({ name: 'ld2-github-autosync' })",
            "autoSyncCall('reconcile'",
            'repository_not_authorized',
            'lovable_gitsync_blocked',
            "type: 'LD2_GITHUB_TEST'",
            'github.installationId'
          ]) if (!js.includes(needle) && !auto.includes(needle)) throw new Error(`GitHub preflight invariant missing: ${needle}`);
          if (!adapter.includes('installationAccessToken')) throw new Error('GitHub App short-lived token path missing');
          if (!adapter.includes("body: JSON.stringify({ action: 'token' })")) throw new Error('Installation token must be minted by backend');
          if (!adapter.includes('force: false')) throw new Error('Branch updates must remain non-force');
          NODE

      - name: Authoritative apply safety
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const sw = fs.readFileSync('background/service-worker.js','utf8');
          const scope = fs.readFileSync('core/scope-lock.js','utf8');
          for (const needle of [
            'bundle.scopeLock = assertScopeLock(bundle)',
            'currentHead !== bundle.baseHeadSha',
            'adapter.atomicCommit({',
            "case 'LD2_PLAN_APPLY'"
          ]) if (!sw.includes(needle)) throw new Error(`Apply safety invariant missing: ${needle}`);
          if (!scope.includes('export function assertScopeLock')) throw new Error('Scope lock missing');
          NODE

      - name: Lovable sync verification is truthful
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const verifier = fs.readFileSync('content/lovable-sync-verifier.js','utf8');
          const editor = fs.readFileSync('content/composer-bridge-v3.js','utf8');
          for (const needle of [
            '/gitsync',
            '/git-sync',
            'collectCommitShas',
            'commit_confirmed',
            'gitsync_sha_not_exposed',
            'commit_not_observed_yet'
          ]) if (!verifier.includes(needle)) throw new Error(`Sync verifier invariant missing: ${needle}`);
          if (!verifier.includes("method: 'GET'")) throw new Error('Lovable sync verifier must remain read-only');
          if (/method:\s*['"]POST['"]/i.test(verifier)) throw new Error('Sync verifier must never POST to Lovable');
          if (!editor.includes('Lovable não confirmado')) throw new Error('UI must disclose unverified Lovable sync');
          if (!editor.includes('GitSync Lovable confirmado')) throw new Error('UI must distinguish verified sync');
          NODE

      - name: No new host interference or credential persistence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          for (const file of ['content/composer-bridge-v3.js','content/lovable-sync-verifier.js']) {
            const js = fs.readFileSync(file,'utf8');
            if (/MutationObserver/.test(js)) throw new Error(`${file} must not install MutationObserver`);
            if (/window\.fetch\s*=|XMLHttpRequest\.prototype|history\.pushState\s*=|history\.replaceState\s*=/.test(js)) throw new Error(`${file} monkeypatches host APIs`);
          }
          const verifier = fs.readFileSync('content/lovable-sync-verifier.js','utf8');
          if (/chrome\.storage\.(local|sync|session)/.test(verifier)) throw new Error('Lovable verifier must never persist Lovable auth material');
          const editor = fs.readFileSync('content/composer-bridge-v3.js','utf8');
          if (/chrome\.storage\.(local|sync|session).*token/i.test(editor)) throw new Error('Editor must not persist GitHub/Lovable tokens');
          NODE

      - name: Native Lovable send stays fail closed
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const js = fs.readFileSync('content/composer-bridge-v3.js','utf8');
          for (const needle of [
            'event.preventDefault()',
            'event.stopPropagation()',
            "document.addEventListener('click', interceptNativeClick, true)",
            "document.addEventListener('submit', interceptNativeSubmit, true)",
            "execute('lovable-enter')",
            "execute('lovable-send-button')",
            "execute('lovable-form-submit')",
            'Lovable não recebe o prompt'
          ]) if (!js.includes(needle)) throw new Error(`Fail-closed invariant missing: ${needle}`);
          NODE

      - name: Preserve Build 1 Build 2 Supabase and Gemini
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const scripts = (m.content_scripts || []).flatMap(x => x.js || []);
          for (const required of ['content/lovable-project-runtime.js','ui/project-context.js','ui/github-autosync.js','ui/project-migration.js']) {
            if (!scripts.includes(required)) throw new Error(`${required} removed`);
          }
          const entry = fs.readFileSync('background/service-worker-entry.js','utf8');
          for (const needle of ['installGithubAppRuntime','installGithubAutoSyncRuntime','installSupabaseOAuthRuntime','installProjectMigrationRuntime','installLovableProjectRuntime']) {
            if (!entry.includes(needle)) throw new Error(`${needle} missing`);
          }
          NODE
          grep -q "billingMode: 'free'" settings/config.js
          grep -q 'zeroCost: true' settings/config.js

      - name: Package Build 3 candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f Lovable-Decrypter-v2.4-BUILD3-EDITOR-DIRETO.zip Lovable-Decrypter-v2.4-BUILD3-EDITOR-DIRETO.sha256
          zip -qr Lovable-Decrypter-v2.4-BUILD3-EDITOR-DIRETO.zip . \
            -x '.git/*' '.github/*' 'supabase/*' 'Lovable-Decrypter-v2.4-BUILD3-EDITOR-DIRETO.zip'
          unzip -l Lovable-Decrypter-v2.4-BUILD3-EDITOR-DIRETO.zip | grep -q ' manifest.json$'
          ! unzip -l Lovable-Decrypter-v2.4-BUILD3-EDITOR-DIRETO.zip | grep -q ' supabase/'
          ! unzip -l Lovable-Decrypter-v2.4-BUILD3-EDITOR-DIRETO.zip | grep -q ' content/composer-bridge.js$'
          unzip -l Lovable-Decrypter-v2.4-BUILD3-EDITOR-DIRETO.zip | grep -q ' content/composer-bridge-v3.js$'
          sha256sum Lovable-Decrypter-v2.4-BUILD3-EDITOR-DIRETO.zip | tee Lovable-Decrypter-v2.4-BUILD3-EDITOR-DIRETO.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Lovable-Decrypter-v2.4-BUILD3-EDITOR-DIRETO
          path: |
            Lovable-Decrypter-v2.4-BUILD3-EDITOR-DIRETO.zip
            Lovable-Decrypter-v2.4-BUILD3-EDITOR-DIRETO.sha256
          if-no-files-found: error
