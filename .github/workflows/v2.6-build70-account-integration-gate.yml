name: v2.6 Build 70 · Account Integration Gate

on:
  push:
    branches: [main, v2.6-build70-account-integration-gate]
    paths:
      - 'manifest.json'
      - 'settings/config.js'
      - 'storage/settings-store.js'
      - 'storage/secret-sanitizer.js'
      - 'release/runtime-package.json'
      - 'docs/ROADMAP_V2_6_LOCAL_FIRST_AI.md'
      - 'core/account-integration-readiness.js'
      - 'core/guarded-commit.js'
      - 'background/guarded-commit-bootstrap.js'
      - 'background/integration-readiness-runtime.js'
      - 'background/integration-callback-runtime.js'
      - 'background/service-worker-entry.js'
      - 'content/integration-readiness-client.js'
      - 'content/integration-callback-bridge.js'
      - 'ui/account-integration-gate-v70.js'
      - 'ui/account-integration-gate-v70.css'
      - 'ui/integrations-v49.js'
      - 'supabase/functions/_shared/github-rsa.js'
      - 'supabase/functions/ld-github-app/index.ts'
      - 'supabase/functions/ld-supabase-oauth/index.ts'
      - 'tests/build69-decrypterbench-v2.test.mjs'
      - 'tests/build70-account-integration-gate.test.mjs'
      - 'tests/build70-production-closeout.test.mjs'
      - '.github/workflows/v2.6-build70-account-integration-gate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'manifest.json'
      - 'settings/config.js'
      - 'storage/settings-store.js'
      - 'storage/secret-sanitizer.js'
      - 'release/runtime-package.json'
      - 'docs/ROADMAP_V2_6_LOCAL_FIRST_AI.md'
      - 'core/account-integration-readiness.js'
      - 'core/guarded-commit.js'
      - 'background/guarded-commit-bootstrap.js'
      - 'background/integration-readiness-runtime.js'
      - 'background/integration-callback-runtime.js'
      - 'background/service-worker-entry.js'
      - 'content/integration-readiness-client.js'
      - 'content/integration-callback-bridge.js'
      - 'ui/account-integration-gate-v70.js'
      - 'ui/account-integration-gate-v70.css'
      - 'ui/integrations-v49.js'
      - 'supabase/functions/_shared/github-rsa.js'
      - 'supabase/functions/ld-github-app/index.ts'
      - 'supabase/functions/ld-supabase-oauth/index.ts'
      - 'tests/build69-decrypterbench-v2.test.mjs'
      - 'tests/build70-account-integration-gate.test.mjs'
      - 'tests/build70-production-closeout.test.mjs'
      - '.github/workflows/v2.6-build70-account-integration-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check core/account-integration-readiness.js
      - run: node --check core/guarded-commit.js
      - run: node --check background/guarded-commit-bootstrap.js
      - run: node --check background/integration-readiness-runtime.js
      - run: node --check background/integration-callback-runtime.js
      - run: node --check background/service-worker-entry.js
      - run: node --check content/integration-readiness-client.js
      - run: node --check content/integration-callback-bridge.js
      - run: node --check storage/secret-sanitizer.js
      - run: node --check storage/settings-store.js
      - run: node --check supabase/functions/_shared/github-rsa.js
      - run: node --check ui/account-integration-gate-v70.js
      - run: node --check tests/build69-decrypterbench-v2.test.mjs
      - run: node --check tests/build70-account-integration-gate.test.mjs
      - run: node --check tests/build70-production-closeout.test.mjs
      - run: python -m py_compile runtime/decrypter-local/ollama-gateway.py
      - run: node tests/build48-ui-kernel.test.mjs
      - run: node tests/build49-integrations.test.mjs
      - run: node tests/build50-project-intelligence.test.mjs
      - run: node tests/build51-engineering-suite.test.mjs
      - run: node tests/build52-project-tools-zip.test.mjs
      - run: node tests/build53-settings-preferences.test.mjs
      - run: node tests/build54-update-recovery-center.test.mjs
      - run: node tests/build55-backend-messaging-natural-voice.test.mjs
      - run: node tests/build56-legacy-purge-performance.test.mjs
      - run: node tests/build57-final-homologation.test.mjs
      - run: node tests/build58-decrypter-ai-core.test.mjs
      - run: node tests/build59-memory-engine-project-brain-v2.test.mjs
      - run: node tests/build60-local-model-runtime.test.mjs
      - run: node tests/build61-tool-runtime.test.mjs
      - run: node tests/build62-mcp-trust-gateway.test.mjs
      - run: node tests/build63-curated-mcp-marketplace.test.mjs
      - run: node tests/build64-context-engine-v2.test.mjs
      - run: node tests/build65-scope-intelligence-v2.test.mjs
      - run: node tests/build66-smart-undo-redo.test.mjs
      - run: node tests/build67-continuity-engine.test.mjs
      - run: node tests/build68-local-agent-orchestrator.test.mjs
      - run: node benchmark/decrypterbench-v2.mjs
      - run: node tests/build69-decrypterbench-v2.test.mjs
      - run: node tests/build70-account-integration-gate.test.mjs
      - run: node tests/build70-production-closeout.test.mjs
      - run: node scripts/release-preflight.mjs --candidate
