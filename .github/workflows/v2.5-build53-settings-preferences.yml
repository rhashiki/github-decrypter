name: v2.5 Build 53 · Settings & Preferences

on:
  push:
    branches: [main, v2.5-build53-settings-preferences]
    paths:
      - 'manifest.json'
      - 'settings/config.js'
      - 'release/runtime-package.json'
      - 'ui/project-tools-v52.js'
      - 'ui/settings-v53.js'
      - 'ui/settings-v53.css'
      - 'tests/build48-ui-kernel.test.mjs'
      - 'tests/build49-integrations.test.mjs'
      - 'tests/build50-project-intelligence.test.mjs'
      - 'tests/build51-engineering-suite.test.mjs'
      - 'tests/build52-project-tools-zip.test.mjs'
      - 'tests/build53-settings-preferences.test.mjs'
      - '.github/workflows/v2.5-build53-settings-preferences.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check ui/ui-kernel-v48.js
      - run: node --check ui/integrations-v49.js
      - run: node --check ui/project-intelligence-v50.js
      - run: node --check ui/engineering-suite-v51.js
      - run: node --check ui/project-tools-v52.js
      - run: node --check ui/settings-v53.js
      - run: node tests/build48-ui-kernel.test.mjs
      - run: node tests/build49-integrations.test.mjs
      - run: node tests/build50-project-intelligence.test.mjs
      - run: node tests/build51-engineering-suite.test.mjs
      - run: node tests/build52-project-tools-zip.test.mjs
      - run: node tests/build53-settings-preferences.test.mjs
      - run: node scripts/release-preflight.mjs --candidate
