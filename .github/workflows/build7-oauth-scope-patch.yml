name: Patch Build 7 OAuth scopes

on:
  push:
    branches:
      - rebuild-v2.4-build7-cloud-migrator-complete
    paths:
      - '.github/workflows/build7-oauth-scope-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade Supabase OAuth scope contract
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          manager = Path('supabase/functions/ld-supabase-manager/index.ts')
          text = manager.read_text()
          old = '''const REQUIRED_SCOPES = Object.freeze([\n  "organizations:read",\n  "projects:read",\n  "projects:write",\n  "database:read",\n  "database:write"\n]);'''
          new = '''const REQUIRED_SCOPES = Object.freeze([\n  "organizations:read",\n  "projects:read",\n  "projects:write",\n  "database:read",\n  "database:write",\n  "auth:read",\n  "auth:write",\n  "edge_functions:read",\n  "edge_functions:write",\n  "secrets:read",\n  "secrets:write",\n  "storage:read"\n]);'''
          if text.count(old) != 1:
              raise SystemExit('manager REQUIRED_SCOPES block mismatch')
          text = text.replace(old, new)
          if text.count('SCOPES DA BUILD 5') != 1:
              raise SystemExit('manager bootstrap label mismatch')
          text = text.replace('SCOPES DA BUILD 5', 'SCOPES DA BUILD 7')
          manager.write_text(text)

          oauth = Path('supabase/functions/ld-supabase-oauth/index.ts')
          text = oauth.read_text()
          old_arr = '["projects:read", "database:read", "database:write"]'
          new_arr = '["organizations:read", "projects:read", "projects:write", "database:read", "database:write", "auth:read", "auth:write", "edge_functions:read", "edge_functions:write", "secrets:read", "secrets:write", "storage:read"]'
          count = text.count(old_arr)
          if count < 1:
              raise SystemExit('oauth required_scopes literal not found')
          oauth.write_text(text.replace(old_arr, new_arr))
          PY

          grep -q 'SCOPES DA BUILD 7' supabase/functions/ld-supabase-manager/index.ts
          for scope in auth:write edge_functions:write secrets:write storage:read; do
            grep -q "$scope" supabase/functions/ld-supabase-manager/index.ts
            grep -q "$scope" supabase/functions/ld-supabase-oauth/index.ts
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/build7-oauth-scope-patch.yml
          git add supabase/functions/ld-supabase-manager/index.ts supabase/functions/ld-supabase-oauth/index.ts
          git commit -m 'build7: require complete Supabase OAuth scopes'
          git push origin HEAD:rebuild-v2.4-build7-cloud-migrator-complete
