name: Bootstrap large extension files

on:
  push:
    paths:
      - '_bootstrap/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild large files
        shell: bash
        run: |
          set -euo pipefail
          assemble() {
            target="$1"
            prefix="$2"
            mkdir -p "$(dirname "$target")"
            cat _bootstrap/${prefix}.part* | tr -d '\n\r' | base64 -d > "$target"
          }
          assemble background/service-worker.js background
          assemble ui/matrix.css matrix-css
          assemble ui/ui.js ui-js
          assemble assets/fab.png fab
          node --check background/service-worker.js
          node --check ui/ui.js
          file assets/fab.png
      - name: Commit rebuilt files and remove bootstrap
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add background/service-worker.js ui/matrix.css ui/ui.js assets/fab.png
          git rm -r _bootstrap
          git rm .github/workflows/bootstrap-large-files.yml
          git commit -m 'feat: assemble extension runtime and UI'
          git push origin HEAD:main
