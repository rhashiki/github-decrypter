name: Validate v2.2 Automatic Suggestions

on:
  push:
    branches:
      - control-center-v2.2.0
      - automatic-suggestions-v2.2.0

permissions:
  contents: read

jobs:
  suggestions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          node --check background/suggestions-runtime.js
          node --check content/automatic-suggestions.js
          node --check background/service-worker-entry.js

      - name: Manifest and background wiring
        run: |
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const scripts = manifest.content_scripts.flatMap(x => x.js || []);
          if (!scripts.includes('content/automatic-suggestions.js')) throw new Error('Automatic Suggestions content script is not loaded');
          const entry = fs.readFileSync('background/service-worker-entry.js', 'utf8');
          if (!entry.includes("import { installSuggestionsRuntime } from './suggestions-runtime.js';")) throw new Error('Suggestions runtime import missing');
          if (!entry.includes('installSuggestionsRuntime();')) throw new Error('Suggestions runtime installation missing');
          NODE

      - name: Background authorization and privacy
        run: |
          node <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('background/suggestions-runtime.js', 'utf8');
          for (const required of ['verifyLicenseKey', 'ld-license-validate', 'x-device-id', "message.action === 'scan'", 'new GitAdapter(github)']) {
            if (!src.includes(required)) throw new Error(`Missing authorized scan invariant: ${required}`);
          }
          for (const forbidden of ['generativelanguage.googleapis.com', 'x-gemini-key', 'createCommit(', 'updateBranch(', 'atomicCommit(']) {
            if (src.includes(forbidden)) throw new Error(`Suggestions background must be read-only and Gemini-free: ${forbidden}`);
          }
          NODE

      - name: Non-autonomous UI invariants
        run: |
          node <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('content/automatic-suggestions.js', 'utf8');
          for (const forbidden of ['LD2_BUILD_EXECUTE', 'LD2_PLAN_APPLY', 'LD2_PLAN_APPROVE', 'generativelanguage.googleapis.com', 'x-gemini-key']) {
            if (src.includes(forbidden)) throw new Error(`Automatic suggestion must not execute or spend Gemini quota: ${forbidden}`);
          }
          for (const required of [
            'placeInComposer(item.command)',
            'Comando colocado no composer. Revise e execute quando quiser.',
            'project_id: ctx.projectId',
            'github_owner: ctx.github.owner',
            'github_repo: ctx.github.repo',
            'github_branch: ctx.github.branch',
            'ld2_suggestions_dismissed_v1',
            'Nenhuma chamada Gemini é feita para gerar esta lista.'
          ]) {
            if (!src.includes(required)) throw new Error(`Missing Automatic Suggestions invariant: ${required}`);
          }
          const signals = ['tracked-env', 'gitignore-missing', 'tests-missing', 'ci-missing', 'typecheck-missing', 'batch-failure', 'recent-rollback', 'brain-missing'];
          for (const signal of signals) if (!src.includes(signal)) throw new Error(`Missing deterministic signal: ${signal}`);
          NODE
