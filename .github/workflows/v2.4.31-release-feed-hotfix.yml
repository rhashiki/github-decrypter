name: Validate v2.4.31 Release Feed Hotfix

on:
  push:
    branches:
      - hotfix-v2.4.31-release-feed-alias

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release feed v5 contract
        run: node tests/release-feed-v5-contract.mjs

      - name: Syntax check JavaScript and tests
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' | LC_ALL=C sort)

      - name: Full repository regression simulations
        run: |
          while IFS= read -r testfile; do
            echo "==> $testfile"
            node "$testfile"
          done < <(find tests -maxdepth 1 -type f -name '*.mjs' | LC_ALL=C sort)

      - name: Hotfix scope lock
        run: |
          BASE=6f50f7c6ec2194e8522e0ed6ebca90d22b1407bb
          FAILED=0
          while IFS= read -r path; do
            case "$path" in
              supabase/functions/ld-release-feed/index.ts|tests/release-feed-v5-contract.mjs|.github/workflows/v2.4.31-release-feed-hotfix.yml) ;;
              *) echo "Unexpected hotfix modification: $path"; FAILED=1 ;;
            esac
          done < <(git diff --name-only "$BASE"...HEAD)
          test "$FAILED" -eq 0

      - name: Release surfaces remain unchanged by source sync
        run: |
          BASE=6f50f7c6ec2194e8522e0ed6ebca90d22b1407bb
          for path in .github/RELEASE_TRIGGER updates/latest.json updates/release.json manifest.json; do
            if git diff --name-only "$BASE"...HEAD -- "$path" | grep -q .; then
              echo "Release surface unexpectedly changed: $path"
              exit 1
            fi
          done
