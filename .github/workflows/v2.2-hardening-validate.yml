name: Validate v2.2 Final Hardening

on:
  push:
    branches:
      - control-center-v2.2.0
      - final-hardening-v2.2.0

permissions:
  contents: read

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          find ai background content core github security settings storage tools ui updates -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Manifest integrity and cross-browser fallback
        run: |
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          if (manifest.manifest_version !== 3) throw new Error('Manifest must stay MV3');
          if (manifest.background?.service_worker !== 'background/service-worker-entry.js') throw new Error('Chrome service worker missing');
          if (!Array.isArray(manifest.background?.scripts) || manifest.background.scripts.length !== 1 || manifest.background.scripts[0] !== 'background/service-worker-entry.js') throw new Error('Firefox background scripts fallback missing');
          if (manifest.background?.type !== 'module') throw new Error('Background must stay module');
          const gecko = manifest.browser_specific_settings?.gecko;
          if (!gecko?.id || Number(String(gecko.strict_min_version || '').split('.')[0]) < 121) throw new Error('Firefox gecko settings incomplete');
          const collection = gecko?.data_collection_permissions?.required || [];
          for (const item of ['authenticationInfo', 'websiteContent']) if (!collection.includes(item)) throw new Error(`Missing Firefox data collection declaration: ${item}`);
          const blocks = manifest.content_scripts || [];
          if (blocks.some(block => block.world === 'MAIN')) throw new Error('MAIN-world content scripts are forbidden');
          const scripts = blocks.flatMap(block => block.js || []);
          if (scripts.includes('content/route-probe.js')) throw new Error('Legacy MAIN-world route probe still referenced');
          const documentStart = blocks.find(block => block.run_at === 'document_start')?.js || [];
          const guardIndex = documentStart.indexOf('content/credential-ui-guard.js');
          const contentIndex = documentStart.indexOf('content/content.js');
          const uiIndex = documentStart.indexOf('ui/ui.js');
          if (guardIndex < 0 || contentIndex < 0 || uiIndex < 0 || !(guardIndex < contentIndex && contentIndex < uiIndex)) throw new Error('Credential guard must load before runtime and UI');
          for (const file of [...scripts, ...(manifest.background.scripts || []), manifest.background.service_worker, ...(manifest.web_accessible_resources || []).flatMap(x => x.resources || [])].filter(Boolean)) {
            if (!fs.existsSync(file)) throw new Error(`Manifest references missing file: ${file}`);
          }
          if (fs.existsSync('content/route-probe.js')) throw new Error('Legacy route probe must be removed');
          if (fs.existsSync('.github/workflows/v2.2-fix-ui-version-once.yml')) throw new Error('Obsolete one-shot workflow must be removed');
          const permissions = [...(manifest.permissions || [])].sort();
          const expectedPermissions = ['alarms','downloads','storage','tabs','unlimitedStorage'].sort();
          if (JSON.stringify(permissions) !== JSON.stringify(expectedPermissions)) throw new Error(`Unexpected permissions: ${permissions.join(',')}`);
          const hosts = [...(manifest.host_permissions || [])].sort();
          const expectedHosts = [
            'https://lovable.dev/*',
            'https://*.lovable.dev/*',
            'https://api.github.com/*',
            'https://codeload.github.com/*',
            'https://generativelanguage.googleapis.com/*',
            'https://api.supabase.com/*',
            'https://*.supabase.co/*'
          ].sort();
          if (JSON.stringify(hosts) !== JSON.stringify(expectedHosts)) throw new Error(`Unexpected host permissions: ${hosts.join(',')}`);
          NODE

      - name: Shared DOM credential isolation
        run: |
          node <<'NODE'
          const fs = require('fs');
          const guard = fs.readFileSync('content/credential-ui-guard.js', 'utf8');
          const runtime = fs.readFileSync('content/content.js', 'utf8');
          for (const required of [
            '__LD2_SAVED_CREDENTIAL__',
            "Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML')",
            'sanitizeHtml(value)',
            'insertAdjacentHTML',
            'getCurrentSettings',
            'resolveSentinels'
          ]) if (!guard.includes(required)) throw new Error(`Missing credential DOM guard invariant: ${required}`);
          if (!runtime.includes('LovableDecrypterCredentialGuard') || !runtime.includes('await guard.prepareMessage(message)')) throw new Error('Runtime does not resolve saved credential sentinels');
          NODE

      - name: OTA signature and origin invariants
        run: |
          node <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('updates/update-manager.js', 'utf8');
          for (const required of [
            'verifyLicenseKey',
            'VERIFIED_RELEASE_TOKENS',
            'VERIFIED_RELEASE_TTL_MS',
            'verification_token',
            "url.protocol !== 'https:'",
            'verified.version !== version || verified.downloadUrl !== downloadUrl',
            'VERIFIED_RELEASE_TOKENS.delete(token)'
          ]) if (!src.includes(required)) throw new Error(`Missing OTA hardening invariant: ${required}`);
          if (/chrome\.downloads\.download\(\{\s*url:\s*release\.download_url/s.test(src)) throw new Error('Unverified release URL reaches downloads API');
          NODE

      - name: Credential destination hardening
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vault = fs.readFileSync('security/vault.js', 'utf8');
          for (const required of ["parsed.protocol !== 'https:'", "parsed.hostname.endsWith('.supabase.co')", 'AES-GCM', 'PBKDF2']) {
            if (!vault.includes(required)) throw new Error(`Missing Vault invariant: ${required}`);
          }
          const sb = fs.readFileSync('tools/supabase-tools.js', 'utf8');
          for (const required of ["url.protocol !== 'https:'", "url.hostname.endsWith('.supabase.co')", 'https://api.supabase.com/v1/projects/']) {
            if (!sb.includes(required)) throw new Error(`Missing Supabase invariant: ${required}`);
          }
          const git = fs.readFileSync('github/git-adapter.js', 'utf8');
          for (const required of ['REQUEST_TIMEOUT_MS', 'AbortController', 'trustedGitHubDownloadUrl', "host.endsWith('.githubusercontent.com')", 'force: false']) {
            if (!git.includes(required)) throw new Error(`Missing GitHub hardening invariant: ${required}`);
          }
          NODE

      - name: Zero-cost Gemini invariants
        run: |
          node <<'NODE'
          const fs = require('fs');
          const config = fs.readFileSync('settings/config.js', 'utf8');
          const agent = fs.readFileSync('ai/gemini-agent.js', 'utf8');
          for (const required of ["billingMode: 'free'", 'zeroCost: true', "merged.gemini.billingMode === 'user_paid' ? 'user_paid' : 'free'"]) {
            if (!config.includes(required)) throw new Error(`Missing zero-cost config invariant: ${required}`);
          }
          for (const required of ['ensureZeroCostModel', 'isVerifiedFreeModel', 'ZERO COST bloqueou']) {
            if (!agent.includes(required)) throw new Error(`Missing zero-cost agent invariant: ${required}`);
          }
          NODE

      - name: Secret and env repository scan
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const files = execFileSync('git', ['ls-files'], { encoding: 'utf8' }).trim().split('\n').filter(Boolean);
          const badEnv = files.filter(f => /(^|\/)\.env(?:\.[^/]+)?$/i.test(f) && !/\.env\.(?:example|sample|template)$/i.test(f));
          if (badEnv.length) throw new Error(`Tracked environment files: ${badEnv.join(', ')}`);
          const patterns = [
            ['GitHub PAT', /(?:github_pat_[A-Za-z0-9_]{30,}|ghp_[A-Za-z0-9]{30,})/],
            ['Google API key', /AIza[0-9A-Za-z_-]{30,}/],
            ['Supabase secret key', /sb_secret_[A-Za-z0-9_-]{20,}/]
          ];
          for (const file of files.filter(f => /\.(?:js|json|md|yml|yaml|txt|sql)$/i.test(f))) {
            let text = '';
            try { text = fs.readFileSync(file, 'utf8'); } catch { continue; }
            for (const [name, pattern] of patterns) if (pattern.test(text)) throw new Error(`${name} literal found in ${file}`);
          }
          NODE
