name: v2.5 Build 42 · Decrypter Marketplace

on:
  push:
    branches: [main, v2.5-build42-decrypter-marketplace]
    paths:
      - 'ui/decrypter-marketplace.js'
      - 'ui/decrypter-marketplace.css'
      - 'manifest.json'
      - '.github/workflows/v2.5-build42-decrypter-marketplace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: node --check ui/decrypter-marketplace.js

      - name: Validate cumulative manifest wiring
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const [a=0,b=0,c=0]=String(m.version||'0.0.0').split('.').map(Number);
          if(a*10000+b*100+c<20542) throw new Error('manifest version older than Build 42');
          const early=(m.content_scripts||[]).find(x=>(x.js||[]).includes('content/early-boot-sentinel.js'));
          if(!early||early.run_at!=='document_start'||early.all_frames!==true) throw new Error('early boot regression');
          const main=(m.content_scripts||[]).find(x=>(x.js||[]).includes('ui/decrypter-marketplace.js'));
          if(!main||main.run_at!=='document_idle'||main.all_frames!==false) throw new Error('marketplace wiring missing');
          if(!(main.css||[]).includes('ui/decrypter-marketplace.css')) throw new Error('marketplace css missing');
          for(const f of ['content/skill-router.js','ui/skills-engine.js','ui/productivity-suite.js','ui/branding-white-label.js']) if(!(main.js||[]).includes(f)) throw new Error('cumulative wiring regression '+f);
          if(main.js.indexOf('ui/decrypter-marketplace.js')<main.js.indexOf('ui/branding-white-label.js')) throw new Error('marketplace must load after branding');
          if(JSON.stringify(m.permissions)!==JSON.stringify(['storage','tabs','downloads','unlimitedStorage','alarms'])) throw new Error('permissions changed');
          NODE

      - name: Validate supply-chain boundary
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('ui/decrypter-marketplace.js','utf8');
          for(const x of ['eval(','new Function','fetch(','XMLHttpRequest.prototype','new XMLHttpRequest','navigator.sendBeacon','MutationObserver(','chrome.scripting','LD2_BUILD_EXECUTE','LD2_PLAN_APPLY','LD2_PLAN_APPROVE','window.fetch =','globalThis.fetch =']) if(s.includes(x)) throw new Error('marketplace supply-chain/authority violation '+x);
          if(!s.includes('api.createCustom')) throw new Error('marketplace must install through Skills Engine');
          if(!s.includes('api.deleteCustom')) throw new Error('marketplace uninstall must use Skills Engine');
          NODE

      - name: Validate Marketplace contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const js=fs.readFileSync('ui/decrypter-marketplace.js','utf8');
          const css=fs.readFileSync('ui/decrypter-marketplace.css','utf8');
          for(const x of ['INSTALLS_KEY','Decrypter Marketplace','CATALOG','UI/UX Quality Gate','Supabase Migration Guard','Browser Extension Security','Release Readiness','event.ctrlKey','ld42Marketplace','attempts >= 120','LovableDecrypterMarketplace','sem código remoto']) if(!js.includes(x)) throw new Error('missing marketplace contract '+x);
          for(const x of ['.ld42-shell','.ld42-card','.ld42-detail','.ld42-market-rail','data-installed','focus-visible','prefers-reduced-motion']) if(!css.includes(x)) throw new Error('missing marketplace visual contract '+x);
          NODE

      - name: Validate deterministic local catalog
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('ui/decrypter-marketplace.js','utf8');
          const ids=[...s.matchAll(/id:'([^']+)'/g)].map(m=>m[1]).filter(id=>id!=='ld2-root');
          if(new Set(ids).size<8) throw new Error('expected at least 8 curated marketplace entries');
          if(!s.includes('chrome.storage.local')) throw new Error('install provenance must be local');
          if(!s.includes('api.list(true)')) throw new Error('stale install reconciliation missing');
          NODE
