name: v2.4 Build 32 · Native Voice & Monitor

on:
  push:
    branches:
      - build-native-voice-monitor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check ui/voice-feedback.js
          node --check content/content.js

      - name: Validate manifest wiring
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          if (m.version !== '2.4.32') throw new Error(`Unexpected version ${m.version}`);
          const cs = m.content_scripts?.[0];
          if (!cs) throw new Error('Missing Lovable content script');
          const ui = cs.js.indexOf('ui/ui.js');
          const voice = cs.js.indexOf('ui/voice-feedback.js');
          if (ui < 0 || voice !== ui + 1) throw new Error('voice-feedback must load immediately after ui/ui.js');
          if (cs.run_at !== 'document_idle') throw new Error('This build must not alter boot timing');
          if (cs.all_frames !== false) throw new Error('This build must not alter all_frames');
          const expectedPermissions = ['storage','tabs','downloads','unlimitedStorage','alarms'];
          if (JSON.stringify(m.permissions) !== JSON.stringify(expectedPermissions)) throw new Error('Unexpected permission change');
          NODE

      - name: Validate voice catalog and zero-cost implementation
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('ui/voice-feedback.js', 'utf8');
          const required = [
            'welcome', 'license-success', 'github-success', 'supabase-success', 'zip-success',
            'lovable-github-success', 'cloud-supabase-success', 'github-failure', 'supabase-failure',
            'zip-failure', 'lovable-github-failure', 'cloud-supabase-failure', 'monitor-on',
            'monitor-off', 'credits-consuming'
          ];
          for (const key of required) if (!src.includes(`'${key}'`) && !src.includes(`${key}:`)) throw new Error(`Missing voice message ${key}`);
          if (!src.includes('speechSynthesis') || !src.includes('SpeechSynthesisUtterance')) throw new Error('Native browser TTS not implemented');
          if (/elevenlabs|azure|googleapis\.com\/.*speech|fetch\s*\(/i.test(src)) throw new Error('Remote/paid TTS dependency detected');
          if (!src.includes("const MONITOR_KEY = 'ld2_monitor_enabled'")) throw new Error('Monitor persistence key missing');
          if (src.includes('window.fetch =') || src.includes('XMLHttpRequest.prototype') || src.includes('sendBeacon =')) throw new Error('Forbidden global network monkeypatch');
          if (!src.includes("toastObserver.observe(wrap, { childList: true })")) throw new Error('Toast observer is not targeted');
          if (!src.includes("gateObserver.observe(gate, { attributes: true")) throw new Error('License observer is not targeted');
          NODE

      - name: Validate monitor enforcement
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('content/content.js', 'utf8');
          for (const token of [
            "const MONITOR_KEY = 'ld2_monitor_enabled'",
            'if (!state.monitorEnabled) return;',
            'chrome.storage.onChanged.addListener',
            'getMonitorEnabled: () => state.monitorEnabled'
          ]) if (!src.includes(token)) throw new Error(`Monitor guard missing: ${token}`);
          NODE
