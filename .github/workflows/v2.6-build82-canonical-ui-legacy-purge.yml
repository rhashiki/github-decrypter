name: v2.6 Build 82 · Canonical Launcher / Legacy UI Purge

on:
  push:
    branches:
      - v2.6.82-canonical-ui-legacy-purge
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          find launcher content background core benchmark scripts tests -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0 \
            | xargs -0 -n1 node --check

      - name: Canonical UI structural gate
        run: node scripts/test-build82-canonical-ui.mjs

      - name: Physical legacy purge assertions
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(
            ui
            diagnostic
            assets/fab.png
            background/decrypter-chat-runtime.js
            content/ui-shell-bootstrap.js
            content/ui-mount-guardian.js
            content/commercial-runtime.js
            content/lovable-workspace-deep-read.js
            content/project-rules-cache.js
            content/queue-atomic-skip.js
            content/queue-executor.js
            content/queue-project-context.js
            content/zero-cost-runtime-guard.js
          )
          for path in "${forbidden[@]}"; do
            if [[ -e "$path" ]]; then
              echo "Legacy path still exists: $path" >&2
              exit 1
            fi
          done
          echo "PHYSICAL_LEGACY_PATHS=0"

      - name: Modern Builds 60-75 preservation gate
        run: node scripts/test-build82-modern-engines.mjs

      - name: Build 74 Native Sessions contract
        run: node tests/build74-multi-agent-runtime-ui-native-sessions.test.mjs

      - name: Universal Agent Bench / Build 75 hardening
        run: node benchmark/universal-agent-bench.mjs

      - name: Release preflight candidate
        run: node scripts/release-preflight.mjs --candidate

      - name: Purge metrics
        shell: bash
        run: |
          set -euo pipefail
          BASE=09a3e8c8c8369848b1f27f8305865995c7a6ac0f
          git cat-file -e "${BASE}^{commit}"
          removed_files="$(git diff --diff-filter=D --name-only "${BASE}...HEAD" | awk 'NF{n++} END{print n+0}')"
          changed_files="$(git diff --name-only "${BASE}...HEAD" | awk 'NF{n++} END{print n+0}')"
          read -r additions deletions < <(git diff --numstat "${BASE}...HEAD" | awk '$1 ~ /^[0-9]+$/ {a+=$1} $2 ~ /^[0-9]+$/ {d+=$2} END{print a+0, d+0}')
          echo "PURGE_METRICS base=${BASE} removed_files=${removed_files} changed_files=${changed_files} additions=${additions} deletions=${deletions}"
          {
            echo "### Build 82 purge metrics"
            echo "- Base: \`${BASE}\`"
            echo "- Removed files: **${removed_files}**"
            echo "- Changed files: **${changed_files}**"
            echo "- Added lines: **${additions}**"
            echo "- Removed lines: **${deletions}**"
          } >> "$GITHUB_STEP_SUMMARY"
