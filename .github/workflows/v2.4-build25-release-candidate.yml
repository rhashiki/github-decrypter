name: Validate v2.4 Build 25 Release Candidate

on:
  push:
    branches:
      - rebuild-v2.4-build25-release-candidate
  pull_request:
    branches:
      - main
      - rebuild-v2.4-build25-release-candidate

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release candidate identity and boot contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          if(m.manifest_version!==3) throw new Error('Manifest V3 required');
          if(m.version!=='2.4.25') throw new Error(`Unexpected version ${m.version}`);
          if(m.version_name!=='2.4 Build 25 RC') throw new Error('RC version_name missing');
          if(!/Build 25 · Release Candidate/.test(m.action?.default_title||'')) throw new Error('RC title missing');
          const js=m.content_scripts?.[0]?.js||[];
          const first=['content/ui-shell-bootstrap.js','content/content.js','content/ui-mount-guardian.js','ui/ui.js'];
          first.forEach((f,i)=>{if(js[i]!==f)throw new Error(`Validated boot order changed at ${i}: ${js[i]}`)});
          NODE
          grep -q "export const VERSION = '2.4.25'" settings/config.js
          grep -q "export const TRUST_PROTOCOL_VERSION = '2.4.21'" settings/config.js

      - name: Syntax check all JavaScript and tests
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' | LC_ALL=C sort)

      - name: Full repository regression simulations
        run: |
          while IFS= read -r testfile; do
            echo "==> $testfile"
            node "$testfile"
          done < <(find tests -maxdepth 1 -type f -name '*.mjs' | LC_ALL=C sort)

      - name: Freeze official release surfaces
        run: |
          BASE=f955f30f1d643a1551f6fc60270af60911e4904d
          for path in .github/RELEASE_TRIGGER updates/latest.json updates/release.json .github/workflows/release.yml; do
            if git diff --name-only "$BASE"...HEAD -- "$path" | grep -q .; then
              echo "Official release surface changed in RC: $path"
              exit 1
            fi
          done
          grep -q -- "- '.github/RELEASE_TRIGGER'" .github/workflows/release.yml
          grep -q -- "- 'v\*'" .github/workflows/release.yml
          grep -q 'workflow_dispatch:' .github/workflows/release.yml

      - name: Backend freeze and critical authority invariants
        run: |
          BASE=f955f30f1d643a1551f6fc60270af60911e4904d
          if git diff --name-only "$BASE"...HEAD -- supabase/functions supabase/migrations | grep -q .; then
            echo 'Build 25 must not mutate backend functions or database schema'
            exit 1
          fi
          grep -q 'MODEL_GATEWAY_REQUIRED' supabase/functions/ld-command/index.ts
          grep -q 'cross_provider_fallback:false' supabase/functions/ld-model-gateway/index.ts
          grep -q 'retry_across_providers:false' supabase/functions/ld-model-gateway/index.ts
          grep -q 'payment_authoritative_entitlement:true' supabase/functions/ld-mercadopago-webhook/index.ts
          grep -q 'if new.signature_valid is not true then' supabase/migrations/20260829003000_build24_security_chaos_hardening.sql
          grep -q 'ld_worker_endpoint_is_public_https' supabase/migrations/20260829003000_build24_security_chaos_hardening.sql

      - name: Browser security and non-invasive integration gate
        run: |
          BROWSER_FILES="manifest.json settings security background content ui core ai storage"
          if grep -R -E 'SUPABASE_SERVICE_ROLE_KEY|LD_LICENSE_PRIVATE_JWK|DECRYPTER_LOCAL_TOKEN|DECRYPTER_WORKER_SECRET|MERCADOPAGO_ACCESS_TOKEN' $BROWSER_FILES --include='*.js' --include='manifest.json'; then
            echo 'Backend secret identifier leaked into browser surface'
            exit 1
          fi
          if git diff -U0 f955f30f1d643a1551f6fc60270af60911e4904d...HEAD -- manifest.json settings security background content ui core ai storage | grep '^+' | grep -v '^+++' | grep -E 'new[[:space:]]+MutationObserver|window\.fetch[[:space:]]*=|globalThis\.fetch[[:space:]]*=|XMLHttpRequest\.prototype|navigator\.sendBeacon[[:space:]]*='; then
            echo 'Forbidden invasive browser patch detected'
            exit 1
          fi

      - name: RC snapshot contract
        run: |
          node tests/build25-release-candidate.mjs
          node <<'NODE'
          const rc=require('./release/RC25_MANIFEST.json');
          if(rc.database_migration_head.version!=='20260829002720') throw new Error('Unexpected migration head');
          if(rc.official_release_published!==false||rc.ota_published!==false) throw new Error('RC must remain unpublished');
          for(const [name,f] of Object.entries(rc.critical_edge_functions)){
            if(f.status!=='ACTIVE'||!/^[a-f0-9]{64}$/.test(f.ezbr_sha256)) throw new Error(`Invalid backend snapshot ${name}`);
          }
          NODE

      - name: Build 25 scope lock
        run: |
          BASE=f955f30f1d643a1551f6fc60270af60911e4904d
          FAILED=0
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/v2.4-build25-release-candidate.yml|manifest.json|settings/config.js|release/RC25_MANIFEST.json|docs/BUILD25_RELEASE_CANDIDATE.md|tests/build25-release-candidate.mjs|tests/build15-intelligence.test.mjs) ;;
              *) echo "Unexpected Build 25 modification: $path"; FAILED=1 ;;
            esac
          done < <(git diff --name-only "$BASE"...HEAD)
          test "$FAILED" -eq 0

      - name: Documentation contract
        run: |
          grep -q 'Trust protocol: `2.4.21`' docs/BUILD25_RELEASE_CANDIDATE.md
          grep -q 'não publica OTA ou GitHub Release automaticamente' docs/BUILD25_RELEASE_CANDIDATE.md
          grep -q 'Release Candidate' docs/BUILD25_RELEASE_CANDIDATE.md
          grep -q '20260829002720_build24_security_chaos_hardening' docs/BUILD25_RELEASE_CANDIDATE.md

      - name: Build deterministic RC package
        shell: bash
        run: |
          set -euo pipefail
          make_package() {
            local root="$1" out="$2"
            rm -rf "$root" "$out"
            mkdir -p "$root"
            rsync -a ./ "$root/" \
              --exclude='.git' \
              --exclude='.github' \
              --exclude='supabase' \
              --exclude='runtime' \
              --exclude='docs' \
              --exclude='tests' \
              --exclude='benchmark' \
              --exclude='training' \
              --exclude='release' \
              --exclude='updates' \
              --exclude='*.zip' \
              --exclude='*.sha256'
            test -f "$root/manifest.json"
            test -f "$root/security/trust.js"
            find "$root" -type f -exec touch -t 202001010000 {} +
            (cd "$root" && find . -type f | LC_ALL=C sort | zip -X -q "$out" -@)
          }
          make_package /tmp/ld-build25-a "$GITHUB_WORKSPACE/rc-a.zip"
          make_package /tmp/ld-build25-b "$GITHUB_WORKSPACE/rc-b.zip"
          cmp rc-a.zip rc-b.zip
          mv rc-a.zip Lovable-Decrypter-v2.4.25-RC.zip
          rm rc-b.zip
          sha256sum Lovable-Decrypter-v2.4.25-RC.zip > Lovable-Decrypter-v2.4.25-RC.sha256
          (cd /tmp/ld-build25-a && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > Lovable-Decrypter-v2.4.25-RC-files.sha256
          cp release/RC25_MANIFEST.json Lovable-Decrypter-v2.4.25-RC-manifest.json
          if unzip -l Lovable-Decrypter-v2.4.25-RC.zip | grep -qE ' (\.github|supabase|runtime|docs|tests|benchmark|training|release|updates)/'; then
            echo 'Internal files leaked into RC package'
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Lovable-Decrypter-v2.4.25-RELEASE-CANDIDATE
          path: |
            Lovable-Decrypter-v2.4.25-RC.zip
            Lovable-Decrypter-v2.4.25-RC.sha256
            Lovable-Decrypter-v2.4.25-RC-files.sha256
            Lovable-Decrypter-v2.4.25-RC-manifest.json
          if-no-files-found: error
