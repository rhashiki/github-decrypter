name: v2.5 Build 39 · Premium Project Tools

on:
  push:
    branches: [main, v2.5-build39-premium-project-tools]
    paths:
      - 'ui/premium-project-tools.js'
      - 'ui/premium-project-tools.css'
      - 'manifest.json'
      - '.github/workflows/v2.5-build39-premium-project-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: node --check ui/premium-project-tools.js

      - name: Validate cumulative manifest wiring
        run: |
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const parts = String(manifest.version || '').split('.').map(Number);
          const current = parts[0] * 10000 + parts[1] * 100 + parts[2];
          if (current < 20539) throw new Error(`manifest version ${manifest.version} is older than Build 39`);
          const scripts = manifest.content_scripts || [];
          const early = scripts.find(s => (s.js || []).includes('content/early-boot-sentinel.js'));
          if (!early || early.run_at !== 'document_start' || early.all_frames !== true) throw new Error('Zero-gap early boot contract regressed');
          const main = scripts.find(s => (s.js || []).includes('ui/premium-project-tools.js'));
          if (!main || main.run_at !== 'document_idle' || main.all_frames !== false) throw new Error('Premium Project Tools runtime wiring missing');
          if (!(main.css || []).includes('ui/premium-project-tools.css')) throw new Error('Premium Project Tools CSS missing');
          for (const required of ['ui/error-intelligence-center.js','ui/launcher-rail-v3.js','ui/premium-workspace.js','ui/premium-engineering-ux.js']) {
            if (!(main.js || []).includes(required)) throw new Error(`Cumulative wiring regressed: ${required}`);
          }
          NODE

      - name: Validate presentation-only authority boundary
        run: |
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('ui/premium-project-tools.js','utf8');
          for (const forbidden of ['LD2_PLAN_ONLY','LD2_PLAN_APPROVE','LD2_BUILD_EXECUTE','LD2_PLAN_APPLY','XMLHttpRequest','sendBeacon','window.fetch','globalThis.fetch','chrome.runtime.connect']) {
            if (source.includes(forbidden)) throw new Error(`Project Tools crossed authority boundary: ${forbidden}`);
          }
          if (source.includes('observe(document.documentElement') || source.includes('observe(document.body')) throw new Error('Global DOM observer is not allowed');
          if (!source.includes('rootObserver.observe(r')) throw new Error('Project Tools observer must stay scoped to #ld2-root');
          NODE

      - name: Validate existing Project Intelligence authority
        run: |
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('content/project-intelligence.js','utf8');
          for (const token of ['openBrain','openRules','openImpacts','openExplain','LD2_AGENT_TRAIN','save_rule','record_impact','explain_project']) {
            if (!source.includes(token)) throw new Error(`Existing Project Intelligence contract missing: ${token}`);
          }
          if (!source.includes('window.LovableDecrypterProjectIntelligence')) throw new Error('Project Intelligence public API missing');
          NODE

      - name: Validate Premium Project Tools contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const js = fs.readFileSync('ui/premium-project-tools.js','utf8');
          const css = fs.readFileSync('ui/premium-project-tools.css','utf8');
          for (const token of ['Project Brain','Project Rules','Impact Map','Explain Project','ld39Toolstrip','ld39ProjectModal','LovableDecrypterPremiumProjectTools']) {
            if (!js.includes(token)) throw new Error(`Missing Project Tools contract: ${token}`);
          }
          for (const token of ['.ld39-project-tools','.ld39-project-modal-tabs','.ld39-project-modal-meta','[data-ld39-project-modal]','button:focus-visible','prefers-reduced-motion']) {
            if (!css.includes(token)) throw new Error(`Missing Project Tools visual contract: ${token}`);
          }
          NODE
