name: v2.6 Build 80 · Diagnostic FAB Injection
on:
  push:
    branches: [main, v2.6.80-diagnostic-fab-injection]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check diagnostic/minimal-runtime.js
      - run: node --check tests/build79-diagnostic-minimal-runtime.test.mjs
      - run: node --check tests/build80-diagnostic-fab-injection.test.mjs
      - run: node tests/build79-diagnostic-minimal-runtime.test.mjs
      - run: node tests/build80-diagnostic-fab-injection.test.mjs
      - run: node scripts/release-preflight.mjs --candidate
