name: v2.5 RC · Final Homologation

on:
  push:
    branches: [main, v2.5-rc-homologation]
    paths:
      - 'manifest.json'
      - 'content/**'
      - 'ui/**'
      - 'background/**'
      - 'updates/**'
      - 'release/**'
      - 'scripts/release-preflight.mjs'
      - '.github/workflows/v2.5-rc-final-homologation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  homologate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve RC metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./manifest.json').version")"
          VERSION_NAME="$(node -p "require('./manifest.json').version_name || ''")"
          case "$VERSION" in
            2.5.*) ;;
            *) echo "Expected v2.5 runtime, got $VERSION"; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Validate manifest and boot boundaries
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const fail=x=>{throw new Error(x)};
          if(m.manifest_version!==3) fail('Manifest V3 required');
          if(!/^2\.5\.\d+$/.test(String(m.version||''))) fail('Invalid v2.5 version');
          const permissions=['storage','tabs','downloads','unlimitedStorage','alarms'];
          if(JSON.stringify(m.permissions)!==JSON.stringify(permissions)) fail('Permission boundary changed');
          const hosts=[
            'https://lovable.dev/*','https://*.lovable.dev/*','https://api.github.com/*',
            'https://codeload.github.com/*','https://generativelanguage.googleapis.com/*',
            'https://api.supabase.com/*','https://*.supabase.co/*'
          ];
          if(JSON.stringify(m.host_permissions)!==JSON.stringify(hosts)) fail('Host permission boundary changed');
          if(m.background?.service_worker!=='background/service-worker-entry.js'||m.background?.type!=='module') fail('Service worker contract changed');
          const scripts=m.content_scripts||[];
          const early=scripts.find(x=>(x.js||[]).includes('content/early-boot-sentinel.js'));
          if(!early||early.run_at!=='document_start'||early.all_frames!==true||early.match_about_blank!==true) fail('Zero-gap boot boundary regressed');
          const main=scripts.find(x=>(x.js||[]).includes('content/runtime-integrity-guard.js'));
          if(!main||main.run_at!=='document_idle'||main.all_frames!==false) fail('Main runtime boundary regressed');
          const order=['content/hardening-core.js','content/capability-registry.js','content/runtime-integrity-guard.js','content/hardening-sentinel.js'];
          for(const f of order) if(!(main.js||[]).includes(f)) fail('Missing hardening component '+f);
          for(let i=1;i<order.length;i++) if(main.js.indexOf(order[i-1])>main.js.indexOf(order[i])) fail('Hardening load order regressed at '+order[i]);
          for(const kind of ['js','css']) {
            const all=scripts.flatMap(x=>x[kind]||[]);
            if(new Set(all).size!==all.length) fail('Duplicate manifest '+kind+' entry');
          }
          NODE

      - name: Validate manifest file wiring
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const refs=[];
          refs.push(m.background?.service_worker);
          for(const c of m.content_scripts||[]) refs.push(...(c.js||[]),...(c.css||[]));
          for(const p of Object.values(m.icons||{})) refs.push(p);
          for(const w of m.web_accessible_resources||[]) refs.push(...(w.resources||[]));
          const missing=[...new Set(refs.filter(Boolean))].filter(p=>!fs.existsSync(p));
          if(missing.length) throw new Error('Missing manifest files: '+missing.join(', '));
          if(fs.existsSync('content/cloud-runtime.js')) throw new Error('Legacy invasive cloud-runtime residue returned');
          NODE

      - name: JavaScript syntax sweep
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find content ui background updates -type f -name '*.js' -print0)
          node --check scripts/release-preflight.mjs

      - name: Security and supply-chain regression scan
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const roots=['content','ui','background','updates'];
          const files=[];
          const walk=p=>{for(const name of fs.readdirSync(p)){const f=path.join(p,name),s=fs.statSync(f);if(s.isDirectory())walk(f);else if(/\.js$/.test(f))files.push(f)}};
          roots.forEach(walk);
          const forbidden=[
            [/(?:window|globalThis)\.fetch\s*=(?!=)/,'global fetch assignment'],
            [/XMLHttpRequest\.prototype\.(?:open|send)\s*=(?!=)/,'XHR prototype assignment'],
            [/navigator\.sendBeacon\s*=(?!=)/,'sendBeacon assignment'],
            [/window\.postMessage\s*\(/,'page-world postMessage bridge'],
            [/\beval\s*\(/,'eval'],
            [/new\s+Function\s*\(/,'new Function']
          ];
          for(const file of files){
            const src=fs.readFileSync(file,'utf8');
            for(const [rx,label] of forbidden) if(rx.test(src)) throw new Error(`${label} forbidden in ${file}`);
          }
          NODE

      - name: Release preflight
        run: node scripts/release-preflight.mjs

      - name: Package RC runtime only
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          ZIP="Lovable-Decrypter-v${VERSION}-RC.zip"
          SHA="Lovable-Decrypter-v${VERSION}-RC.sha256"
          META="Lovable-Decrypter-v${VERSION}-RC.json"
          mapfile -t RUNTIME_PATHS < <(node -e "require('./release/runtime-package.json').paths.forEach(p=>console.log(p))")
          mapfile -t EXCLUDED_PATHS < <(node -e "(require('./release/runtime-package.json').excluded_paths||[]).forEach(p=>console.log(p))")
          test "${#RUNTIME_PATHS[@]}" -gt 1
          ZIP_ARGS=("$ZIP" "${RUNTIME_PATHS[@]}")
          if [ "${#EXCLUDED_PATHS[@]}" -gt 0 ]; then
            zip -qr "${ZIP_ARGS[@]}" -x "${EXCLUDED_PATHS[@]}"
          else
            zip -qr "${ZIP_ARGS[@]}"
          fi
          unzip -t "$ZIP" >/dev/null
          unzip -Z1 "$ZIP" > /tmp/ld-rc-files.txt
          grep -qx 'manifest.json' /tmp/ld-rc-files.txt
          grep -qx 'updates/update-manager.js' /tmp/ld-rc-files.txt
          ! grep -qx 'content/cloud-runtime.js' /tmp/ld-rc-files.txt
          if grep -E '^(\.github|benchmark|docs|release|runtime|scripts|supabase|tests)/' /tmp/ld-rc-files.txt; then
            echo 'Development/backend/local-worker/release content leaked into RC ZIP'
            exit 1
          fi
          if grep -Ei '(^|/)\.env($|\.)|\.(pem|key|p12|pfx)$' /tmp/ld-rc-files.txt; then
            echo 'Credential-like file leaked into RC ZIP'
            exit 1
          fi
          ! grep -qx 'updates/release.json' /tmp/ld-rc-files.txt
          ! grep -qx 'updates/latest.json' /tmp/ld-rc-files.txt
          sha256sum "$ZIP" | tee "$SHA"
          export VERSION ZIP SHA META
          node <<'NODE'
          const fs=require('fs');
          const manifest=require('./manifest.json');
          const hash=fs.readFileSync(process.env.SHA,'utf8').trim().split(/\s+/)[0];
          const out={
            type:'release-candidate',
            version:process.env.VERSION,
            version_name:manifest.version_name,
            source_sha:process.env.GITHUB_SHA,
            sha256:hash,
            trust_protocol:'2.4.21',
            github_release_published:false,
            ota_published:false
          };
          fs.writeFileSync(process.env.META,JSON.stringify(out,null,2)+'\n');
          NODE
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "meta=$META" >> "$GITHUB_OUTPUT"

      - name: Upload RC artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lovable-Decrypter-v${{ steps.meta.outputs.version }}-RC
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.sha }}
            ${{ steps.package.outputs.meta }}
          if-no-files-found: error
          retention-days: 14
