name: GitHub Decrypter Build 4 — Lovable Decoupling

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - build/4-lovable-decoupling

permissions:
  contents: read

jobs:
  decoupling-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Lovable authority removal
        run: node scripts/test-build4-lovable-decoupling.mjs
      - name: Validate modern engine preservation
        run: node scripts/test-build4-modern-engine-preservation.mjs
      - name: Syntax-check preserved JavaScript sources
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find core background content github security settings storage -type f -name '*.js' -print0 2>/dev/null || true)
