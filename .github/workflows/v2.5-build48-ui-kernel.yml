name: v2.5 Build 48 · Authoritative UI Kernel

on:
  push:
    branches: [main, v2.5-build48-ui-kernel]
    paths:
      - 'manifest.json'
      - 'settings/config.js'
      - 'release/runtime-package.json'
      - 'ui/ui-kernel-v48.js'
      - 'ui/ui-kernel-v48.css'
      - 'tests/build48-ui-kernel.test.mjs'
      - '.github/workflows/v2.5-build48-ui-kernel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check ui/ui-kernel-v48.js
      - run: node tests/build48-ui-kernel.test.mjs
      - run: node scripts/release-preflight.mjs --candidate
