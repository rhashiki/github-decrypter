name: One-shot v2.2 Scope Lock integration

on:
  push:
    branches:
      - control-center-v2.2.0
    paths:
      - .github/workflows/v2.2-fix-ui-version-once.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: control-center-v2.2.0
          fetch-depth: 0
      - name: Wire Scope Lock into authoritative commit path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('background/service-worker.js')
          s = p.read_text()
          import_old = "import { checkUpdates, downloadUpdate } from '../updates/update-manager.js';"
          import_new = import_old + "\nimport { assertScopeLock } from '../core/scope-lock.js';"
          if "from '../core/scope-lock.js'" not in s:
              if import_old not in s:
                  raise SystemExit('Import marker not found')
              s = s.replace(import_old, import_new, 1)

          prepare_marker = "  emit('diff', 'Preparando revisão', `${plan.files.length} arquivo(s) pronto(s) para revisar`, 'done');"
          prepare_insert = "  bundle.scopeLock = assertScopeLock(bundle);\n" + prepare_marker
          if "bundle.scopeLock = assertScopeLock(bundle);" not in s:
              if prepare_marker not in s:
                  raise SystemExit('Prepare marker not found')
              s = s.replace(prepare_marker, prepare_insert, 1)

          apply_marker = "async function applyPlan({ id, keepBundle = false }) {\n  const bundle = await getPending(id);"
          apply_insert = apply_marker + "\n  bundle.scopeLock = assertScopeLock(bundle);"
          if s.count("bundle.scopeLock = assertScopeLock(bundle);") < 2:
              if apply_marker not in s:
                  raise SystemExit('Apply marker not found')
              s = s.replace(apply_marker, apply_insert, 1)

          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add background/service-worker.js
          git commit -m "feat: enforce Scope Lock before preview and atomic commit"
          git push origin HEAD:control-center-v2.2.0
