name: One-shot v2.2 Shadow Build integration

on:
  push:
    branches:
      - control-center-v2.2.0
    paths:
      - .github/workflows/v2.2-fix-ui-version-once.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: control-center-v2.2.0
          fetch-depth: 0
      - name: Wire Shadow Build into authoritative commit path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('background/service-worker.js')
          s = p.read_text()
          scope_import = "import { assertScopeLock } from '../core/scope-lock.js';"
          shadow_import = "import { prepareShadowBuild, applyShadowBuild } from '../core/shadow-build.js';"
          if shadow_import not in s:
              if scope_import not in s:
                  raise SystemExit('Scope import marker not found')
              s = s.replace(scope_import, scope_import + "\n" + shadow_import, 1)

          old = """  const result = await adapter.atomicCommit({
    files: bundle.plan.files.map(({ path, action, content }) => ({ path, action, content })),
    message: bundle.plan.commit_message || `feat: ${bundle.plan.summary || 'Lovable Decrypter changes'}`,
    baseBranch: bundle.github.branch,
    createBranch: false,
    createPr: false
  });"""
          new = """  const shadow = await prepareShadowBuild({ adapter, bundle });
  bundle.shadowBuild = shadow;
  const result = await applyShadowBuild({ adapter, shadow });"""
          if new not in s:
              if old not in s:
                  raise SystemExit('atomicCommit marker not found')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add background/service-worker.js
          git commit -m "feat: enforce Shadow Build before branch mutation"
          git push origin HEAD:control-center-v2.2.0
