name: GitHub Decrypter Build 13 — Crash & Power Recovery

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - build/13-crash-power-recovery

permissions:
  contents: read

jobs:
  crash-power-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm through Corepack
        run: corepack enable
      - name: Install workspace toolchain
        run: pnpm install --no-frozen-lockfile
      - name: Run Architecture Guardian
        run: pnpm run guardian
      - name: Validate Build 4–13 and TypeScript workspaces
        run: pnpm run ci
      - name: Validate modern engine preservation
        run: node scripts/test-build4-modern-engine-preservation.mjs
