name: v2.5 Build 45 · Decrypter Chat + Activation Premium Fix

on:
  push:
    branches: [main, v2.5-build45-chat-activation-premium]
    paths:
      - 'ui/chat-activation-premium-v45.js'
      - 'ui/chat-activation-premium-v45.css'
      - 'manifest.json'
      - '.github/workflows/v2.5-build45-chat-activation-premium.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: node --check ui/chat-activation-premium-v45.js

      - name: Validate manifest and boot boundaries
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const [a=0,b=0,c=0]=String(m.version||'0.0.0').split('.').map(Number);
          if(a*10000+b*100+c<20545) throw new Error('manifest version older than Build 45');
          const early=(m.content_scripts||[]).find(x=>(x.js||[]).includes('content/early-boot-sentinel.js'));
          if(!early||early.run_at!=='document_start'||early.all_frames!==true||early.match_about_blank!==true) throw new Error('zero-gap early boot regression');
          const main=(m.content_scripts||[]).find(x=>(x.js||[]).includes('ui/chat-activation-premium-v45.js'));
          if(!main||main.run_at!=='document_idle'||main.all_frames!==false) throw new Error('Build 45 runtime wiring missing');
          if(!(main.css||[]).includes('ui/chat-activation-premium-v45.css')) throw new Error('Build 45 CSS wiring missing');
          if(main.js.indexOf('ui/lightweight-runtime-delivery.js')>main.js.indexOf('ui/chat-activation-premium-v45.js')) throw new Error('Build 45 must load after shared scheduler');
          if(main.css.at(-1)!=='ui/chat-activation-premium-v45.css') throw new Error('Build 45 CSS must load last');
          if(JSON.stringify(m.permissions)!==JSON.stringify(['storage','tabs','downloads','unlimitedStorage','alarms'])) throw new Error('permissions changed');
          NODE

      - name: Validate Decrypter Chat premium contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const js=fs.readFileSync('ui/chat-activation-premium-v45.js','utf8');
          const css=fs.readFileSync('ui/chat-activation-premium-v45.css','utf8');
          for(const token of ['ld45-chat-premium-style','data-ld45-premium','LovableDecrypterDeliveryScheduler','ResizeObserver','ld2-decrypter-chat-host','ld45-license-mark']) if(!js.includes(token)) throw new Error('missing Build 45 JS contract '+token);
          for(const token of ['font-size:15px','font-size:14.5px','backdrop-filter:blur','linear-gradient','html[data-ld45-chat-active="1"] .ld2-native-bridge','ld2-license-box[data-ld45-activation="1"]']) if(!css.includes(token)&&!js.includes(token)) throw new Error('missing Build 45 visual contract '+token);
          if(!js.includes('font-size:15px!important')||!js.includes('font-size:14.5px!important')) throw new Error('chat typography floor missing');
          if(!css.includes('display:none!important')) throw new Error('legacy bridge suppression missing');
          NODE

      - name: Validate presentation-only authority boundary
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('ui/chat-activation-premium-v45.js','utf8');
          const forbidden=[
            [/chrome\.runtime\.sendMessage\s*\(/,'new runtime command'],
            [/fetch\s*\(/,'network fetch'],
            [/XMLHttpRequest/,'XHR'],
            [/sendBeacon/,'sendBeacon'],
            [/window\.postMessage\s*\(/,'page-world postMessage'],
            [/\beval\s*\(/,'eval'],
            [/new\s+Function\s*\(/,'new Function'],
            [/MutationObserver/,'MutationObserver']
          ];
          for(const [rx,label] of forbidden) if(rx.test(s)) throw new Error('Build 45 presentation layer must not add '+label);
          NODE

      - name: Preserve Build 44 supply-chain guarantees
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const files=[];
          const walk=p=>{for(const name of fs.readdirSync(p)){const f=path.join(p,name),st=fs.statSync(f);if(st.isDirectory())walk(f);else if(/\.js$/.test(f))files.push(f)}};
          ['content','ui','background'].forEach(walk);
          const forbidden=[
            [/(?:window|globalThis)\.fetch\s*=(?!=)/,'global fetch assignment'],
            [/XMLHttpRequest\.prototype\.(?:open|send)\s*=(?!=)/,'XHR prototype assignment'],
            [/navigator\.sendBeacon\s*=(?!=)/,'sendBeacon assignment'],
            [/window\.postMessage\s*\(/,'page-world postMessage bridge'],
            [/\beval\s*\(/,'eval'],
            [/new\s+Function\s*\(/,'new Function']
          ];
          for(const file of files){const s=fs.readFileSync(file,'utf8');for(const [rx,label] of forbidden)if(rx.test(s))throw new Error(`${label} forbidden in ${file}`)}
          NODE
