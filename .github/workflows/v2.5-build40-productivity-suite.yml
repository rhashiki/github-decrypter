name: v2.5 Build 40 · Productivity Suite

on:
  push:
    branches: [main, v2.5-build40-productivity-suite]
    paths:
      - 'ui/productivity-suite.js'
      - 'ui/productivity-suite.css'
      - 'manifest.json'
      - '.github/workflows/v2.5-build40-productivity-suite.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: node --check ui/productivity-suite.js

      - name: Validate manifest and cumulative wiring
        run: |
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json','utf8'));
          if (manifest.version !== '2.5.40') throw new Error(`Expected 2.5.40, got ${manifest.version}`);
          const scripts = manifest.content_scripts || [];
          const early = scripts.find(s => (s.js || []).includes('content/early-boot-sentinel.js'));
          if (!early || early.run_at !== 'document_start' || early.all_frames !== true) throw new Error('Zero-gap early boot contract regressed');
          const main = scripts.find(s => (s.js || []).includes('ui/productivity-suite.js'));
          if (!main || main.run_at !== 'document_idle' || main.all_frames !== false) throw new Error('Productivity Suite wiring missing');
          if (!(main.css || []).includes('ui/productivity-suite.css')) throw new Error('Productivity Suite CSS missing');
          for (const required of ['ui/launcher-rail-v3.js','ui/premium-engineering-ux.js','ui/premium-project-tools.js']) {
            if (!(main.js || []).includes(required)) throw new Error(`Cumulative wiring regressed: ${required}`);
          }
          const p = main.js.indexOf('ui/productivity-suite.js');
          if (p < main.js.indexOf('ui/premium-project-tools.js')) throw new Error('Productivity Suite must load after Premium Project Tools');
          const expected = ['storage','tabs','downloads','unlimitedStorage','alarms'];
          if (JSON.stringify(manifest.permissions) !== JSON.stringify(expected)) throw new Error('Permissions changed unexpectedly');
          NODE

      - name: Validate authority boundary
        run: |
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('ui/productivity-suite.js','utf8');
          for (const forbidden of ['LD2_BUILD_EXECUTE','LD2_PLAN_ONLY','LD2_PLAN_APPLY','LD2_PLAN_APPROVE','XMLHttpRequest','sendBeacon','window.fetch','globalThis.fetch','MutationObserver']) {
            if (source.includes(forbidden)) throw new Error(`Productivity Suite crossed authority boundary: ${forbidden}`);
          }
          if (!source.includes("LD2_HISTORY_GET")) throw new Error('Searchable history must reuse the existing read-only history API');
          if (!source.includes('target.click()')) throw new Error('Existing modules must be opened through their existing UI actions');
          NODE

      - name: Validate productivity contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const js = fs.readFileSync('ui/productivity-suite.js','utf8');
          const css = fs.readFileSync('ui/productivity-suite.css','utf8');
          for (const token of ['Command','Produtividade','Notas rápidas','Histórico','FAVORITES_KEY','RECENTS_KEY','Ctrl+Shift+N','Ctrl+Shift+H','Ctrl+Shift+S','Ctrl+Shift+Q','ld2_notes_','LovableDecrypterProductivitySuite']) {
            if (!js.includes(token)) throw new Error(`Missing Productivity contract: ${token}`);
          }
          for (const token of ['.ld40-palette','.ld40-command','.ld40-notes','.ld40-history','.ld40-productivity-rail','focus-visible','prefers-reduced-motion']) {
            if (!css.includes(token)) throw new Error(`Missing Productivity visual contract: ${token}`);
          }
          NODE

      - name: Validate bounded mounting and no global patching
        run: |
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('ui/productivity-suite.js','utf8');
          if (!source.includes('attempts >= 120')) throw new Error('Rail mounting must be bounded');
          if (!source.includes("setInterval")) throw new Error('Expected bounded rail reconciliation');
          for (const token of ['prototype.open','prototype.send','navigator.sendBeacon =','window.fetch =','globalThis.fetch =']) {
            if (source.includes(token)) throw new Error(`Global network patch forbidden: ${token}`);
          }
          NODE
