name: Validate v2.4 Build 10 Execution Engine

on:
  push:
    branches:
      - rebuild-v2.4-build10-execution-engine

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Manifest and runtime version
        run: |
          node <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const config = fs.readFileSync('settings/config.js','utf8');
          const js = m.content_scripts?.[0]?.js || [];
          if (m.version !== '2.4.10' || m.version_name !== '2.4 Build 10') throw new Error('Build 10 version mismatch');
          if (!config.includes("export const VERSION = '2.4.10'")) throw new Error('service worker/runtime version mismatch');
          if (m.content_scripts?.[0]?.run_at !== 'document_idle' || m.content_scripts?.[0]?.all_frames !== false) throw new Error('unsafe frame/timing configuration');
          const required = [
            'content/ui-shell-bootstrap.js','content/content.js','content/ui-mount-guardian.js','ui/ui.js',
            'content/project-intelligence.js','content/skill-router.js','content/project-rules-cache.js','content/checkpoint-ui.js',
            'content/batch-mode.js','content/queue-project-context.js','content/queue-atomic-skip.js','content/queue-executor.js','content/build10-reconciliation.js',
            'content/composer-bridge-v3.js'
          ];
          for (const file of required) if (!js.includes(file)) throw new Error(`missing active module ${file}`);
          if (js.includes('content/build9-reconciliation.js')) throw new Error('Build 9 reconciliation must not remain active in Build 10');
          const pos = file => js.indexOf(file);
          if (!(pos('content/ui-shell-bootstrap.js') < pos('content/content.js') && pos('content/content.js') < pos('content/ui-mount-guardian.js') && pos('content/ui-mount-guardian.js') < pos('ui/ui.js'))) throw new Error('fault-isolated UI boot order regressed');
          if (!(pos('content/project-intelligence.js') < pos('content/skill-router.js') && pos('content/skill-router.js') < pos('content/project-rules-cache.js'))) throw new Error('execution wrapper order regressed');
          if (!(pos('content/batch-mode.js') < pos('content/queue-project-context.js') && pos('content/queue-project-context.js') < pos('content/queue-atomic-skip.js') && pos('content/queue-atomic-skip.js') < pos('content/queue-executor.js') && pos('content/queue-executor.js') < pos('content/build10-reconciliation.js'))) throw new Error('Execution Engine load order invalid');
          for (const file of ['content/automatic-suggestions.js','content/composer-pro.js','content/preview-progress-overlay.js','content/dom-guardian.js','content/monitor.js']) if (js.includes(file)) throw new Error(`deferred module booted too early: ${file}`);
          NODE

      - name: JavaScript syntax
        run: |
          node --check content/ui-shell-bootstrap.js
          node --check content/ui-mount-guardian.js
          node --check content/batch-mode.js
          node --check content/queue-project-context.js
          node --check content/queue-atomic-skip.js
          node --check content/queue-executor.js
          node --check content/build10-reconciliation.js
          node --check content/project-intelligence.js
          node --check content/project-rules-cache.js
          node --check content/skill-router.js
          node --check content/checkpoint-ui.js
          node --check content/composer-bridge-v3.js
          node --check ui/ui.js
          node --check ui/control-center.js
          node --check background/service-worker.js
          node --check tests/build10-queue-simulation.mjs

      - name: Preserve validated Build 9 boot and protected cores
        run: |
          BASE=6698dbeb05dc9c7e8a61b76006abedb65cade507
          for path in \
            content/ui-shell-bootstrap.js \
            content/ui-mount-guardian.js \
            ui/ui.js \
            content/project-intelligence.js \
            content/skill-router.js \
            content/project-rules-cache.js \
            content/checkpoint-ui.js \
            content/composer-bridge-v3.js \
            background/service-worker.js \
            background/checkpoint-runtime.js \
            core/guarded-commit.js \
            ui/skills-engine.js \
            ui/cloud-migrator-complete.js; do
            if ! git diff --quiet "$BASE" -- "$path"; then
              echo "Unexpected modification of validated/protected core: $path"
              exit 1
            fi
          done

      - name: Queue DOM safety
        run: |
          node <<'NODE'
          const fs = require('fs');
          for (const file of ['content/batch-mode.js','content/queue-project-context.js','content/queue-atomic-skip.js','content/queue-executor.js','content/build10-reconciliation.js']) {
            const src = fs.readFileSync(file,'utf8');
            if (/MutationObserver/.test(src)) throw new Error(`${file} must not observe Lovable DOM`);
            if (/window\.fetch\s*=|XMLHttpRequest\.prototype|sendBeacon\s*=/.test(src)) throw new Error(`${file} must not monkeypatch network APIs`);
          }
          NODE

      - name: Fresh context per queue item
        run: |
          node <<'NODE'
          const fs = require('fs');
          const enqueue = fs.readFileSync('content/queue-project-context.js','utf8');
          const exec = fs.readFileSync('content/queue-executor.js','utf8');
          if (!enqueue.includes('skill_slugs: []')) throw new Error('enqueue must not freeze Skills');
          if (/ld-skills|route_many|x-gemini-key/.test(enqueue)) throw new Error('enqueue-time Skill routing reintroduced');
          for (const marker of ['refreshExecutionContext','syncBrain','ProjectRulesCache','LD2_REPO_CACHE_WARM','headBefore','JOURNAL_PREFIX']) if (!exec.includes(marker)) throw new Error(`executor missing ${marker}`);
          if (/\bskillSlugs\s*:/.test(exec)) throw new Error('executor must not pass explicit skillSlugs; Skill Router must recalculate');
          if (!exec.includes("source: 'queue'")) throw new Error('queue execution source missing');
          NODE

      - name: Recovery safety contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const exec = fs.readFileSync('content/queue-executor.js','utf8');
          for (const marker of ['RECOVERY_HEAD_CHANGED','RECOVERY_INTERRUPTED','RECOVERY_JOURNAL_MISSING','reconcileRunning','lastProgressAt','status: \'completed\'']) if (!exec.includes(marker)) throw new Error(`recovery marker missing: ${marker}`);
          if (!exec.includes("headNow !== headBefore")) throw new Error('HEAD mismatch recovery gate missing');
          if (!exec.includes("'blocked'")) throw new Error('uncertain changed-HEAD execution must block');
          NODE

      - name: Queue controls contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const batch = fs.readFileSync('content/batch-mode.js','utf8');
          const skip = fs.readFileSync('content/queue-atomic-skip.js','utf8');
          const recon = fs.readFileSync('content/build10-reconciliation.js','utf8');
          for (const marker of ['data-batch-control="pause"','data-batch-control="resume"','cancel_pending','data-batch-retry','data-batch-skip']) if (!batch.includes(marker)) throw new Error(`queue UI missing ${marker}`);
          if (!skip.includes('/ld-queue-skip') || !skip.includes('stopImmediatePropagation') || !skip.includes('LovableDecrypterBatchMode.skip = atomicSkip')) throw new Error('atomic Skip override missing');
          if (!recon.includes("fetch(`${base}/ld-queue`") || !recon.includes("ready ? 'ATIVA' : 'DEGRADADA'")) throw new Error('truthful backend health gate missing');
          NODE

      - name: Atomic skip backend security contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const sql = fs.readFileSync('supabase/migrations/20260828102757_build10_atomic_queue_skip.sql','utf8');
          const edge = fs.readFileSync('supabase/functions/ld-queue-skip/index.ts','utf8');
          for (const marker of ["security definer","set search_path = ''","pg_advisory_xact_lock","SKIPPED_BY_USER","revoke all on function public.ld_skip_queue_item","grant execute on function public.ld_skip_queue_item(uuid, uuid, text) to service_role"]) if (!sql.toLowerCase().includes(marker.toLowerCase())) throw new Error(`skip migration missing ${marker}`);
          for (const marker of ['verifyToken','DEVICE_NOT_BOUND','ENTITLEMENT_EXHAUSTED','ld_skip_queue_item']) if (!edge.includes(marker)) throw new Error(`skip edge function missing ${marker}`);
          NODE

      - name: Deterministic 12-item queue simulation
        run: node tests/build10-queue-simulation.mjs

      - name: Package Build 10 candidate
        run: |
          rm -rf /tmp/ld-build10 && mkdir -p /tmp/ld-build10
          rsync -a ./ /tmp/ld-build10/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='supabase' \
            --exclude='tests' \
            --exclude='docs' \
            --exclude='*.zip' \
            --exclude='*.sha256' \
            --exclude='.build*_payload*'
          test -f /tmp/ld-build10/manifest.json
          test -f /tmp/ld-build10/content/ui-shell-bootstrap.js
          test -f /tmp/ld-build10/content/ui-mount-guardian.js
          test -f /tmp/ld-build10/content/batch-mode.js
          test -f /tmp/ld-build10/content/queue-project-context.js
          test -f /tmp/ld-build10/content/queue-atomic-skip.js
          test -f /tmp/ld-build10/content/queue-executor.js
          test -f /tmp/ld-build10/content/build10-reconciliation.js
          test ! -d /tmp/ld-build10/supabase
          test ! -d /tmp/ld-build10/tests
          cd /tmp/ld-build10
          zip -qr "$GITHUB_WORKSPACE/Lovable-Decrypter-v2.4-BUILD10-EXECUTION-ENGINE.zip" .
          cd "$GITHUB_WORKSPACE"
          sha256sum Lovable-Decrypter-v2.4-BUILD10-EXECUTION-ENGINE.zip > Lovable-Decrypter-v2.4-BUILD10-EXECUTION-ENGINE.sha256
          unzip -l Lovable-Decrypter-v2.4-BUILD10-EXECUTION-ENGINE.zip | grep -q ' manifest.json$'
          unzip -l Lovable-Decrypter-v2.4-BUILD10-EXECUTION-ENGINE.zip | grep -q ' content/ui-shell-bootstrap.js$'
          unzip -l Lovable-Decrypter-v2.4-BUILD10-EXECUTION-ENGINE.zip | grep -q ' content/queue-executor.js$'
          if unzip -l Lovable-Decrypter-v2.4-BUILD10-EXECUTION-ENGINE.zip | grep -q ' supabase/'; then exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: Lovable-Decrypter-v2.4-BUILD10-EXECUTION-ENGINE
          path: |
            Lovable-Decrypter-v2.4-BUILD10-EXECUTION-ENGINE.zip
            Lovable-Decrypter-v2.4-BUILD10-EXECUTION-ENGINE.sha256
          if-no-files-found: error
