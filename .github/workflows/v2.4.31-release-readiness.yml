name: Validate v2.4.31 Release Readiness RC1

on:
  push:
    branches:
      - release-v2.4.31-rc1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release candidate preflight
        run: node scripts/release-preflight.mjs --candidate

      - name: Syntax check all JavaScript and tests
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' | LC_ALL=C sort)

      - name: Full repository regression simulations
        run: |
          while IFS= read -r testfile; do
            echo "==> $testfile"
            node "$testfile"
          done < <(find tests -maxdepth 1 -type f -name '*.mjs' | LC_ALL=C sort)

      - name: Build runtime-only RC package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./manifest.json').version")"
          ZIP="Lovable-Decrypter-v${VERSION}-rc1.zip"
          mapfile -t RUNTIME_PATHS < <(node -e "require('./release/runtime-package.json').paths.forEach(p=>console.log(p))")
          mapfile -t EXCLUDED_PATHS < <(node -e "(require('./release/runtime-package.json').excluded_paths||[]).forEach(p=>console.log(p))")
          test "${#RUNTIME_PATHS[@]}" -gt 1
          ZIP_ARGS=("$ZIP" "${RUNTIME_PATHS[@]}")
          if [ "${#EXCLUDED_PATHS[@]}" -gt 0 ]; then
            zip -qr "${ZIP_ARGS[@]}" -x "${EXCLUDED_PATHS[@]}"
          else
            zip -qr "${ZIP_ARGS[@]}"
          fi
          sha256sum "$ZIP" | tee "${ZIP}.sha256"
          unzip -Z1 "$ZIP" > /tmp/ld-rc-files.txt
          grep -qx 'manifest.json' /tmp/ld-rc-files.txt
          grep -qx 'updates/update-manager.js' /tmp/ld-rc-files.txt
          ! grep -qx 'content/cloud-runtime.js' /tmp/ld-rc-files.txt
          rm -rf /tmp/ld-rc-package
          mkdir -p /tmp/ld-rc-package
          unzip -q "$ZIP" -d /tmp/ld-rc-package
          node -e "const m=require('/tmp/ld-rc-package/manifest.json'); if(m.version!=='2.4.31') throw new Error('packaged manifest version mismatch')"

      - name: Package content safety
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./manifest.json').version")"
          ZIP="Lovable-Decrypter-v${VERSION}-rc1.zip"
          unzip -Z1 "$ZIP" > /tmp/ld-rc-files.txt
          if grep -E '^(\.github|benchmark|docs|release|runtime|scripts|supabase|tests)/' /tmp/ld-rc-files.txt; then
            echo 'Development/backend/local-worker/release content leaked into extension ZIP'
            exit 1
          fi
          if grep -Ei '(^|/)\.env($|\.)|\.(pem|key|p12|pfx)$' /tmp/ld-rc-files.txt; then
            echo 'Credential-like file leaked into extension ZIP'
            exit 1
          fi
          ! grep -qx 'updates/release.json' /tmp/ld-rc-files.txt
          ! grep -qx 'updates/latest.json' /tmp/ld-rc-files.txt
          ! grep -qx 'content/cloud-runtime.js' /tmp/ld-rc-files.txt
          grep -qx 'updates/update-manager.js' /tmp/ld-rc-files.txt

      - name: RC1 identity and candidate manifest contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const rc=JSON.parse(fs.readFileSync('release/RC31_MANIFEST.json','utf8'));
          const pkg=JSON.parse(fs.readFileSync('release/runtime-package.json','utf8'));
          if(m.version!=='2.4.31') throw new Error(`Unexpected version ${m.version}`);
          if(rc.candidate!==m.version) throw new Error('RC candidate mismatch');
          if(rc.trust_protocol_version!=='2.4.21') throw new Error('Trust Protocol mismatch');
          if(rc.release_state!=='candidate-only'||rc.official_release_published!==false||rc.ota_published!==false) throw new Error('RC accidentally marked published');
          if(!rc.release_invariants?.runtime_package_allowlist) throw new Error('Runtime allowlist invariant missing');
          if(!(pkg.excluded_paths||[]).includes('content/cloud-runtime.js')) throw new Error('Legacy network interceptor must be excluded');
          NODE

      - name: Backend and database freeze
        run: |
          BASE=7d1f4629da58adc99abd92bc64656b8415a677d9
          if git diff --name-only "$BASE"...HEAD -- supabase | grep -q .; then
            echo 'RC1 readiness must not modify Supabase/backend state'
            exit 1
          fi

      - name: Freeze official release surfaces
        run: |
          BASE=7d1f4629da58adc99abd92bc64656b8415a677d9
          for path in .github/RELEASE_TRIGGER updates/latest.json updates/release.json; do
            if git diff --name-only "$BASE"...HEAD -- "$path" | grep -q .; then
              echo "Official release surface changed during RC preparation: $path"
              exit 1
            fi
          done

      - name: RC1 scope lock
        run: |
          BASE=7d1f4629da58adc99abd92bc64656b8415a677d9
          FAILED=0
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/release.yml|.github/workflows/v2.4.31-release-readiness.yml|RELEASE.md|release/RC31_MANIFEST.json|release/runtime-package.json|scripts/release-preflight.mjs) ;;
              *) echo "Unexpected RC1 modification: $path"; FAILED=1 ;;
            esac
          done < <(git diff --name-only "$BASE"...HEAD)
          test "$FAILED" -eq 0

      - name: Release pipeline safety contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const source=fs.readFileSync('.github/workflows/release.yml','utf8');
          for (const required of ['scripts/release-preflight.mjs','release/runtime-package.json','RUNTIME_PATHS','EXCLUDED_PATHS','updates/update-manager.js','content/cloud-runtime.js']) {
            if (!source.includes(required)) throw new Error(`Release workflow missing ${required}`);
          }
          if (/zip\s+-qr\s+"?\$\{?ZIP\}?"?\s+\.\s/.test(source) || /zip\s+-qr[^\n]+\s\.\s*\\?$/m.test(source)) {
            throw new Error('Broad whole-repository ZIP packaging is forbidden');
          }
          NODE
          grep -q 'candidate-only' release/RC31_MANIFEST.json
          grep -q 'Nenhuma publicação ocorre na preparação do RC' RELEASE.md
