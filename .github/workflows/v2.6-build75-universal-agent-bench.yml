name: v2.6 Build 75 · Universal Agent Bench / External-Agent Hardening
on:
  push:
    branches: [main, v2.6-build75-universal-agent-bench]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
