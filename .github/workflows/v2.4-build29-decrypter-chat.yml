name: Validate v2.4 Build 29 Decrypter Chat

on:
  push:
    branches:
      - v2.4-build29-decrypter-chat
  pull_request:
    branches:
      - main
      - v2.4-build29-decrypter-chat

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build 29 identity and boot contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          if(m.version!=='2.4.29') throw new Error(`Unexpected version ${m.version}`);
          if(m.version_name!=='2.4 Build 29 · Decrypter Chat') throw new Error('Build 29 version_name missing');
          const js=m.content_scripts?.[0]?.js||[];
          const bridge=js.indexOf('content/composer-bridge-v3.js');
          const guardian=js.indexOf('content/composer-guardian.js');
          const core=js.indexOf('content/decrypter-chat-core.js');
          const chat=js.indexOf('content/decrypter-chat.js');
          if(!(bridge>=0&&guardian>bridge&&core>guardian&&chat>core)) throw new Error('Decrypter Chat boot order invalid');
          NODE
          grep -q "export const VERSION = '2.4.29'" settings/config.js
          grep -q "export const TRUST_PROTOCOL_VERSION = '2.4.21'" settings/config.js

      - name: Syntax check all JavaScript and tests
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' | LC_ALL=C sort)

      - name: Build 29 chat simulation
        run: node tests/build29-decrypter-chat.mjs

      - name: Full repository regression simulations
        run: |
          while IFS= read -r testfile; do
            echo "==> $testfile"
            node "$testfile"
          done < <(find tests -maxdepth 1 -type f -name '*.mjs' | LC_ALL=C sort)

      - name: Transaction lock and zero-apply contract
        run: |
          grep -q "attachShadow({ mode: 'open' })" content/decrypter-chat.js
          grep -q "ld2_native_routing_enabled" content/decrypter-chat.js
          grep -q "window.addEventListener('keydown', failClosedKey, true)" content/decrypter-chat.js
          grep -q "window.addEventListener('click', failClosedClick, true)" content/decrypter-chat.js
          grep -q "window.addEventListener('submit', failClosedSubmit, true)" content/decrypter-chat.js
          grep -q "LD2_PLAN_ONLY" content/decrypter-chat.js
          grep -q "LD2_PLAN_PREPARE" content/decrypter-chat.js
          ! grep -q "LD2_PLAN_APPLY" content/decrypter-chat.js
          ! grep -q "LD2_BUILD_EXECUTE" content/decrypter-chat.js
          grep -q "CHAT_WRITE_INTENT_BLOCKED" background/decrypter-chat-runtime.js
          ! grep -Eq "atomicCommit|LD2_PLAN_APPLY|LD2_BUILD_EXECUTE" background/decrypter-chat-runtime.js

      - name: Browser non-invasive integration gate
        run: |
          for file in content/decrypter-chat-core.js content/decrypter-chat.js; do
            ! grep -Eq 'window\.fetch[[:space:]]*=|globalThis\.fetch[[:space:]]*=|XMLHttpRequest\.prototype|navigator\.sendBeacon[[:space:]]*=|new[[:space:]]+MutationObserver' "$file"
          done
          ! grep -Eq 'new[[:space:]]+KeyboardEvent|dispatchEvent\(new[[:space:]]+KeyboardEvent' content/decrypter-chat.js
          ! grep -Eq 'SUPABASE_SERVICE_ROLE_KEY|LD_LICENSE_PRIVATE_JWK|MERCADOPAGO_ACCESS_TOKEN[[:space:]]*=' content/decrypter-chat-core.js content/decrypter-chat.js background/decrypter-chat-runtime.js

      - name: Backend and database freeze
        run: |
          BASE=8c8294bbad8a6c6d9ccca4064353086a448dbbf0
          if git diff --name-only "$BASE"...HEAD -- supabase | grep -q .; then
            echo 'Build 29 must not change Supabase backend or database schema'
            exit 1
          fi

      - name: Freeze official release surfaces
        run: |
          BASE=8c8294bbad8a6c6d9ccca4064353086a448dbbf0
          for path in .github/RELEASE_TRIGGER updates/latest.json updates/release.json .github/workflows/release.yml; do
            if git diff --name-only "$BASE"...HEAD -- "$path" | grep -q .; then
              echo "Official release surface changed: $path"
              exit 1
            fi
          done

      - name: Build 29 scope lock
        run: |
          BASE=8c8294bbad8a6c6d9ccca4064353086a448dbbf0
          FAILED=0
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/v2.4-build29-decrypter-chat.yml|background/decrypter-chat-runtime.js|background/service-worker-entry.js|content/decrypter-chat-core.js|content/decrypter-chat.js|docs/BUILD29_DECRYPTER_CHAT.md|manifest.json|settings/config.js|tests/build28-project-recovery-doctor.mjs|tests/build29-decrypter-chat.mjs) ;;
              *) echo "Unexpected Build 29 modification: $path"; FAILED=1 ;;
            esac
          done < <(git diff --name-only "$BASE"...HEAD)
          test "$FAILED" -eq 0

      - name: Documentation contract
        run: |
          grep -q 'Trust protocol: `2.4.21`' docs/BUILD29_DECRYPTER_CHAT.md
          grep -qi 'fail-closed' docs/BUILD29_DECRYPTER_CHAT.md
          grep -q 'Chat nativo' docs/BUILD29_DECRYPTER_CHAT.md
          grep -q 'Shadow Build não cria commit automaticamente' docs/BUILD29_DECRYPTER_CHAT.md
          grep -q 'Build 30' docs/BUILD29_DECRYPTER_CHAT.md
