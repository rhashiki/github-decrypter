name: Build 73 — Code Intelligence Foundation

on:
  push:
    branches:
      - build/73-code-intelligence
  pull_request:
    branches:
      - main
    paths:
      - 'packages/code-intelligence/**'
      - 'scripts/test-build73-code-intelligence-*.ts'
      - 'apps/local/src/code-intelligence-runtime.ts'
      - 'apps/local/src/daemon.ts'
      - 'apps/studio/src/CodeExplorer.tsx'
      - 'apps/studio/src/App.tsx'
      - 'apps/studio/package.json'
      - 'architecture.guardian.json'
      - 'scripts/tsconfig.build73-tests.json'
      - '.github/workflows/build73-code-intelligence-foundation.yml'

jobs:
  code-intelligence-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @github-decrypter/code-intelligence run typecheck
      - run: pnpm exec tsc -p scripts/tsconfig.build73-tests.json
      - run: pnpm exec tsx scripts/test-build73-code-intelligence-runtime.ts
      - run: pnpm --filter @github-decrypter/local run typecheck
      - run: pnpm --filter @github-decrypter/studio run typecheck
      - run: pnpm --filter @github-decrypter/studio run build
      - run: pnpm exec tsx scripts/test-build73-code-intelligence-local-runtime.ts
      - run: pnpm run guardian
      - run: node scripts/test-build73-code-intelligence-static.mjs
