name: Validate v2.4 Build 6 Cloud Migrator Core

on:
  push:
    branches:
      - rebuild-v2.4-build6-cloud-migrator-core
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build 6 manifest isolation
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const js=(m.content_scripts||[]).flatMap(x=>x.js||[]);
          const css=(m.content_scripts||[]).flatMap(x=>x.css||[]);
          for(const f of ['content/cloud-migrator-runtime.js','ui/cloud-migrator-core.js','content/lovable-project-runtime.js','content/lovable-project-creator.js','ui/supabase-project-manager.js','content/composer-bridge-v3.js']){
            if(!js.includes(f)) throw new Error(`Missing ${f}`);
          }
          if(!css.includes('ui/cloud-migrator-core.css')) throw new Error('Cloud Migrator CSS missing');
          if((m.content_scripts||[]).some(x=>x.run_at!=='document_idle'||x.all_frames!==false||x.world==='MAIN')) throw new Error('Content isolation regressed');
          NODE

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check background/cloud-migration-runtime.js
          node --check content/cloud-migrator-runtime.js
          node --check ui/cloud-migrator-core.js
          node --check content/composer-bridge-v3.js

      - name: Cloud broker contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const broker=fs.readFileSync('supabase/functions/ld-cloud-migrator-broker/index.ts','utf8');
          const content=fs.readFileSync('content/cloud-migrator-runtime.js','utf8');
          const ui=fs.readFileSync('ui/cloud-migrator-core.js','utf8');
          const bg=fs.readFileSync('background/cloud-migration-runtime.js','utf8');
          for(const n of [
            "npm:postgres@3.4.9", "flow') === 'handoff'", "SOURCE_SECRET_PREFIX", "ld_cloud_migration_jobs",
            "action === 'active'", "action === 'prepare'", "action === 'inspect'", "action === 'run_next'", "action === 'cancel'",
            "phase === 'schema'", "phase === 'data'", "phase === 'rls'", "phase === 'auth'", "phase === 'verify'",
            "auth.users", "auth.identities", "pg_catalog.pg_policies", "database/query", "json_populate_recordset",
            "installAndHandoff", "cleanup", "edit-code", "deployments?async=true", "x-ld-helper-key",
            "cloud-migrate", "Storage, Edge Functions, Secrets", "ld2-cloud-migration"
          ]) if(!(broker+content+ui+bg).includes(n)) throw new Error(`Missing Build 6 invariant: ${n}`);
          NODE

      - name: Credentials stay server-side
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const content=fs.readFileSync('content/cloud-migrator-runtime.js','utf8');
          const ui=fs.readFileSync('ui/cloud-migrator-core.js','utf8');
          const bg=fs.readFileSync('background/cloud-migration-runtime.js','utf8');
          const browser=content+'\n'+ui+'\n'+bg;
          if(/SUPABASE_SERVICE_ROLE_KEY/.test(browser)) throw new Error('service_role leaked into browser package');
          if(/source_secret_name\s*=|SOURCE_SECRET_PREFIX/.test(browser)) throw new Error('source Vault secret implementation leaked to browser');
          if(/chrome\.storage[\s\S]{0,160}(db_url|refresh_token|client_secret|handoff_token)/i.test(browser)) throw new Error('Migration credential persisted client-side');
          if(/MutationObserver|window\.fetch\s*=|XMLHttpRequest\.prototype|history\.pushState\s*=|history\.replaceState\s*=/.test(content+ui)) throw new Error('Cloud Migrator interferes with Lovable host runtime');
          const broker=fs.readFileSync('supabase/functions/ld-cloud-migrator-broker/index.ts','utf8');
          if(!broker.includes('await storeSecret(sb, secretName, dbUrl')) throw new Error('Source DB URL must go directly into Vault');
          if(!broker.includes('await cleanupSourceSecret(sb')) throw new Error('Source secret cleanup missing');
          NODE

      - name: Resumable migration and Build 7 boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q "data_table_index" supabase/functions/ld-cloud-migrator-broker/index.ts
          grep -q "data_offset" supabase/functions/ld-cloud-migrator-broker/index.ts
          grep -q "auth_table_index" supabase/functions/ld-cloud-migrator-broker/index.ts
          grep -q "verification" supabase/functions/ld-cloud-migrator-broker/index.ts
          ! grep -q "storage.objects" supabase/functions/ld-cloud-migrator-broker/index.ts
          ! grep -q "deploy.*edge.*function" supabase/functions/ld-cloud-migrator-broker/index.ts

      - name: Preserve Builds 1 to 5
        shell: bash
        run: |
          set -euo pipefail
          grep -q "type: 'LD2_PLAN_ONLY'" content/composer-bridge-v3.js
          grep -q "type: 'LD2_PLAN_PREPARE'" content/composer-bridge-v3.js
          grep -q "type: 'LD2_PLAN_APPLY'" content/composer-bridge-v3.js
          ! grep -q "type: 'LD2_BUILD_EXECUTE'" content/composer-bridge-v3.js
          grep -q "LovableDecrypterProjectCreator" content/lovable-project-creator.js
          grep -q "billingMode: 'free'" settings/config.js
          grep -q "zeroCost: true" settings/config.js
          grep -q "installCloudMigrationRuntime" background/service-worker-entry.js

      - name: Package Build 6 candidate
        shell: bash
        run: |
          set -euo pipefail
          ZIP=Lovable-Decrypter-v2.4-BUILD6-CLOUD-MIGRATOR-CORE.zip
          rm -f "$ZIP" "${ZIP%.zip}.sha256"
          zip -qr "$ZIP" . -x '.git/*' '.github/*' 'supabase/*' "$ZIP"
          unzip -l "$ZIP" | grep -q ' manifest.json$'
          unzip -l "$ZIP" | grep -q ' content/cloud-migrator-runtime.js$'
          unzip -l "$ZIP" | grep -q ' ui/cloud-migrator-core.js$'
          ! unzip -l "$ZIP" | grep -q ' supabase/'
          sha256sum "$ZIP" | tee "${ZIP%.zip}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: Lovable-Decrypter-v2.4-BUILD6-CLOUD-MIGRATOR-CORE
          path: |
            Lovable-Decrypter-v2.4-BUILD6-CLOUD-MIGRATOR-CORE.zip
            Lovable-Decrypter-v2.4-BUILD6-CLOUD-MIGRATOR-CORE.sha256
          if-no-files-found: error
