name: Bootstrap extension source

on:
  push:
    paths:
      - 'bootstrap/source.zip.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode prepared source
        shell: bash
        run: |
          test -f bootstrap/source.zip.b64
          base64 -d bootstrap/source.zip.b64 > /tmp/source.zip
          rm -rf /tmp/source
          mkdir -p /tmp/source
          unzip -q /tmp/source.zip -d /tmp/source
          rsync -a --exclude 'bootstrap/' --exclude '.git/' /tmp/source/ ./

      - name: Commit source tree
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Source already up to date.'
            exit 0
          fi
          git commit -m 'chore: bootstrap Lovable Decrypter v2.0.10 source'
          git push origin main
