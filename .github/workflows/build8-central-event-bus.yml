name: GitHub Decrypter Build 8 — Central Event Bus

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - build/8-central-event-bus

permissions:
  contents: read

jobs:
  central-event-bus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm through Corepack
        run: corepack enable
      - name: Install workspace toolchain
        run: pnpm install --no-frozen-lockfile
      - name: Validate Build 4/5/6/7/8 and TypeScript workspaces
        run: pnpm run ci
      - name: Validate modern engine preservation
        run: node scripts/test-build4-modern-engine-preservation.mjs
