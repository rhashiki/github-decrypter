name: GitHub Decrypter Build 38 — Prompt Intake Engine

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - build/38-prompt-intake-engine

permissions:
  contents: read

jobs:
  prompt-intake-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm through Corepack
        run: corepack enable
      - name: Install workspace toolchain
        run: pnpm install --no-frozen-lockfile
      - name: Validate Build 38 prompt intake contract
        run: node scripts/test-build38-prompt-intake.mjs
      - name: Compile Build 38 prompt intake engine
        run: pnpm exec tsc -p scripts/tsconfig.build38-tests.json
      - name: Validate Build 38 prompt intake runtime
        run: pnpm exec tsx scripts/test-build38-prompt-intake-runtime.ts
      - name: Preserve Build 37 authority while phase activation is pending
        run: pnpm run check:build37
      - name: Validate modern engine preservation
        run: node scripts/test-build4-modern-engine-preservation.mjs
