name: Validate v2.2 checkpoint rollback

on:
  push:
    branches:
      - control-center-v2.2.0
      - checkpoint-rollback-wiring-v2.2.0
    paths:
      - core/checkpoint-manager.js
      - core/guarded-commit.js
      - background/checkpoint-runtime.js
      - background/service-worker-entry.js
      - content/checkpoint-ui.js
      - manifest.json
      - .github/workflows/v2.2-checkpoint-validate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          node --check core/checkpoint-manager.js
          node --check core/guarded-commit.js
          node --check background/checkpoint-runtime.js
          node --check background/service-worker-entry.js
          node --check content/checkpoint-ui.js

      - name: Checkpoint and rollback behavior
        shell: bash
        run: |
          set -euo pipefail
          cp core/checkpoint-manager.js /tmp/checkpoint-manager.mjs
          node --input-type=module <<'NODE'
          const store = {};
          globalThis.chrome = {
            storage: {
              local: {
                async get(key) {
                  if (key == null) return { ...store };
                  if (Array.isArray(key)) return Object.fromEntries(key.map(k => [k, store[k]]));
                  return { [key]: store[key] };
                },
                async set(values) { Object.assign(store, values); }
              }
            }
          };
          const {
            createCheckpoint,
            markCheckpointPublished,
            verifyPublishedCheckpoint,
            rollbackCheckpoint,
            autoRollbackIfDefinitiveFailure,
            listCheckpoints
          } = await import('file:///tmp/checkpoint-manager.mjs');

          let head = 'new11111';
          const calls = [];
          const adapter = {
            async getCommit(sha) {
              if (sha === 'base0000') return { tree: { sha: 'tree-base' }, parents: [] };
              if (sha === 'new11111') return { tree: { sha: 'tree-new' }, parents: [{ sha: 'base0000' }] };
              return { tree: { sha: 'tree-other' }, parents: [{ sha: 'other000' }] };
            },
            async getRef() { return { object: { sha: head } }; },
            async createCommit(message, tree, parent) {
              calls.push({ type: 'createCommit', message, tree, parent });
              return { sha: 'rollback2222' };
            },
            async updateBranch(branch, sha) {
              calls.push({ type: 'updateBranch', branch, sha });
              head = sha;
              return { object: { sha } };
            }
          };

          const checkpoint = await createCheckpoint({
            adapter,
            bundle: {
              command: 'Ajuste a home',
              github: { owner: 'o', repo: 'r', branch: 'main' },
              plan: { summary: 'Ajuste da home' }
            },
            shadow: { baseCommitSha: 'base0000', baseTreeSha: 'tree-base', commitSha: 'new11111' }
          });
          if (checkpoint.status !== 'prepared' || checkpoint.baseTreeSha !== 'tree-base') throw new Error('Checkpoint was not prepared correctly');

          await markCheckpointPublished(checkpoint, 'new11111');
          const published = (await listCheckpoints({ owner: 'o', repo: 'r', branch: 'main' }))[0];
          if (published.status !== 'published' || published.appliedCommitSha !== 'new11111') throw new Error('Checkpoint publication state missing');

          const verification = await verifyPublishedCheckpoint({ adapter, checkpoint: published, expectedCommitSha: 'new11111' });
          if (!verification.ok || !verification.definitive) throw new Error('Published checkpoint should verify');

          const rollback = await rollbackCheckpoint({ adapter, checkpoint: published, reason: 'manual' });
          if (rollback.rollbackCommitSha !== 'rollback2222') throw new Error('Rollback commit missing');
          const createCall = calls.find(x => x.type === 'createCommit');
          if (!createCall || createCall.tree !== 'tree-base' || createCall.parent !== 'new11111') {
            throw new Error('Rollback must create a new commit from the old tree with current HEAD as parent');
          }
          if (!calls.some(x => x.type === 'updateBranch' && x.sha === 'rollback2222')) throw new Error('Rollback branch update missing');

          head = 'advanced3333';
          let refused = false;
          try { await rollbackCheckpoint({ adapter, checkpoint: published, reason: 'manual' }); }
          catch (error) { refused = error?.code === 'ROLLBACK_REFUSED_BRANCH_CHANGED'; }
          if (!refused) throw new Error('Rollback must refuse when branch advanced');

          head = 'new11111';
          const auto = await autoRollbackIfDefinitiveFailure({
            adapter,
            checkpoint: published,
            verification: { ok: false, definitive: true, reason: 'unexpected-parent', currentHeadSha: 'new11111' }
          });
          if (!auto.rolledBack) throw new Error('Definitive post-publish failure must trigger automatic rollback');
          console.log('Checkpoint and rollback behavior OK');
          NODE

      - name: Guard wiring and background authority
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const guard = fs.readFileSync('core/guarded-commit.js', 'utf8');
          const entry = fs.readFileSync('background/service-worker-entry.js', 'utf8');
          const runtime = fs.readFileSync('background/checkpoint-runtime.js', 'utf8');
          const ui = fs.readFileSync('content/checkpoint-ui.js', 'utf8');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));

          const validation = guard.indexOf('const validationGate = await runValidationGate');
          const checkpoint = guard.indexOf('const checkpoint = await createCheckpoint');
          const apply = guard.indexOf('result = await applyShadowBuild');
          const verify = guard.indexOf('postPublishVerification = await verifyPublishedCheckpoint');
          if (!(validation >= 0 && validation < checkpoint && checkpoint < apply && apply < verify)) {
            throw new Error('Checkpoint must be created after Validation Gate and before branch publication, then verified afterward');
          }
          if (!guard.includes('autoRollbackIfDefinitiveFailure')) throw new Error('Automatic rollback wiring missing');

          if (!entry.includes('installCheckpointRuntime();')) throw new Error('Checkpoint background runtime is not installed');
          if (!runtime.includes("case 'rollback'")) throw new Error('Background rollback action missing');
          if (!runtime.includes("checkpoint.status !== 'published'")) throw new Error('Background must reject non-published checkpoints');
          if (!runtime.includes('rollbackCheckpoint({ adapter, checkpoint, reason: \'manual\' })')) throw new Error('Background must use checkpoint manager rollback');
          if (!runtime.includes('verifyLicenseKey(licenseKey)') || !runtime.includes("'x-device-id': deviceId")) throw new Error('Rollback authority must validate signed license and bound device');
          if (!runtime.includes('HISTORY_KEY')) throw new Error('Rollback history persistence missing');

          if (!ui.includes("chrome.runtime.connect({ name: PORT_NAME })")) throw new Error('Checkpoint UI must call background port');
          if (ui.includes('https://api.github.com') || ui.includes('github.token') || ui.includes('Authorization:')) {
            throw new Error('Checkpoint UI must not access GitHub credentials/API directly');
          }
          const scripts = (manifest.content_scripts || []).flatMap(x => x.js || []);
          if (!scripts.includes('content/checkpoint-ui.js')) throw new Error('Checkpoint Control Center UI is not loaded by manifest');
          console.log('Checkpoint guard and authoritative background invariants OK');
          NODE
