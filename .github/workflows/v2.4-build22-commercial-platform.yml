name: Validate v2.4 Build 22 Commercial Platform

on:
  push:
    branches:
      - rebuild-v2.4-build22-commercial-platform
  pull_request:
    branches:
      - main
      - rebuild-v2.4-build22-commercial-platform

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Manifest and validated boot remain intact
        run: |
          node <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          if(m.version!=='2.4.22') throw new Error(`Unexpected version ${m.version}`);
          if(m.version_name!=='2.4 Build 22') throw new Error('Build 22 version_name missing');
          if(!/Build 22 · Commercial Platform/.test(m.action?.default_title||'')) throw new Error('Build 22 title missing');
          const js=m.content_scripts?.[0]?.js||[];
          const first=['content/ui-shell-bootstrap.js','content/content.js','content/ui-mount-guardian.js','ui/ui.js'];
          first.forEach((f,i)=>{if(js[i]!==f) throw new Error(`Validated boot order changed at ${i}: ${js[i]}`)});
          if(!js.includes('content/commercial-runtime.js')) throw new Error('Commercial runtime missing');
          if(!js.includes('content/build18-reconciliation.js')) throw new Error('Build 18 reconciliation missing');
          if(m.content_scripts?.[0]?.run_at!=='document_idle'||m.content_scripts?.[0]?.all_frames!==false) throw new Error('Unsafe content-script scope');
          NODE
          grep -q "export const VERSION = '2.4.22'" settings/config.js

      - name: Build 22 source syntax
        run: |
          node --check content/commercial-runtime.js
          node --check tests/build22-commercial-platform-sim.mjs
          npx --yes esbuild supabase/functions/ld-commercial/index.ts --bundle --platform=neutral --external:jsr:* --outfile=/tmp/ld-commercial.js
          npx --yes esbuild supabase/functions/ld-license-validate/index.ts --bundle --platform=neutral --external:jsr:* --outfile=/tmp/ld-license-validate.js
          npx --yes esbuild supabase/functions/ld-mercadopago-webhook/index.ts --bundle --platform=neutral --external:jsr:* --outfile=/tmp/ld-mp-webhook.js

      - name: Commercial executable simulations
        run: node tests/build22-commercial-platform-sim.mjs

      - name: Continuous trial contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const c=fs.readFileSync('supabase/functions/ld-commercial/index.ts','utf8');
          const m=fs.readFileSync('supabase/migrations/20260828231000_build22_commercial_platform.sql','utf8');
          if(!c.includes('const TRIAL_MS=4*60*60*1000')) throw new Error('Trial must be exactly four hours');
          if(!c.includes('duration_seconds:14400')||!c.includes("continuous:true")) throw new Error('Continuous trial public contract missing');
          if(!c.includes('TRIAL_ALREADY_USED')) throw new Error('Trial reuse block missing');
          if(!/email_hash text not null unique/.test(m)||!/device_hash text not null unique/.test(m)) throw new Error('Trial uniqueness missing');
          if(!c.includes("expires_at:expires.toISOString()")) throw new Error('Server expiration missing');
          NODE

      - name: Recurring price source is existing catalog
        run: |
          node <<'NODE'
          const fs=require('fs');
          const m=fs.readFileSync('supabase/migrations/20260828231000_build22_commercial_platform.sql','utf8');
          if(!m.includes("p.code='time_30d'")||!m.includes("p.code='time_365d'")) throw new Error('Recurring plans must source existing time products');
          if(!m.includes('p.price_cents')) throw new Error('Recurring price must come from product source');
          const seed=m.slice(m.indexOf("insert into public.ld_commercial_plans"),m.indexOf("create table if not exists public.ld_trials"));
          if(/\b4490\b|\b29990\b/.test(seed)) throw new Error('Hardcoded recurring price detected');
          NODE

      - name: Subscription and webhook authority
        run: |
          node <<'NODE'
          const fs=require('fs');
          const c=fs.readFileSync('supabase/functions/ld-commercial/index.ts','utf8');
          const w=fs.readFileSync('supabase/functions/ld-mercadopago-webhook/index.ts','utf8');
          if(!c.includes("https://api.mercadopago.com/preapproval")) throw new Error('Mercado Pago preapproval creation missing');
          if(!c.includes("subscription_cancel")||!c.includes("status:'cancelled'")) throw new Error('Subscription cancellation missing');
          if(!w.includes("subscription_preapproval")||!w.includes("subscription_authorized_payment")) throw new Error('Subscription webhooks missing');
          if(!w.includes('validSignature')||!w.includes('INVALID_SIGNATURE')) throw new Error('Webhook signature validation missing');
          if(!w.includes("onConflict:'event_key'")) throw new Error('Webhook idempotence missing');
          if(!w.includes('ld_reverse_order_entitlement')) throw new Error('One-time refund/chargeback reversal regressed');
          NODE

      - name: Commercial database security
        run: |
          grep -q 'alter table public.ld_commercial_plans enable row level security' supabase/migrations/20260828231000_build22_commercial_platform.sql
          grep -q 'alter table public.ld_trials enable row level security' supabase/migrations/20260828231000_build22_commercial_platform.sql
          grep -q 'alter table public.ld_subscriptions enable row level security' supabase/migrations/20260828231000_build22_commercial_platform.sql
          grep -q 'alter table public.ld_subscription_events enable row level security' supabase/migrations/20260828231000_build22_commercial_platform.sql
          grep -q 'revoke all on table public.ld_trials from anon, authenticated' supabase/migrations/20260828231000_build22_commercial_platform.sql
          grep -q 'security invoker' supabase/migrations/20260828231000_build22_commercial_platform.sql
          grep -q 'revoke execute on function public.ld_commercial_snapshot(uuid) from public, anon, authenticated' supabase/migrations/20260828231000_build22_commercial_platform.sql
          grep -q 'grant execute on function public.ld_commercial_snapshot(uuid) to service_role' supabase/migrations/20260828231000_build22_commercial_platform.sql

      - name: BYOK boundary
        run: |
          grep -q 'byok_allowed boolean not null default false' supabase/migrations/20260828231000_build22_commercial_platform.sql
          grep -q 'byok_enabled boolean not null default false' supabase/migrations/20260828231000_build22_commercial_platform.sql
          grep -q 'provider_key_stored_server_side:false' supabase/functions/ld-commercial/index.ts
          if grep -E 'SUPABASE_SERVICE_ROLE_KEY|LD_OWNER_SECRET|MERCADOPAGO_ACCESS_TOKEN|MERCADOPAGO_WEBHOOK_SECRET|DECRYPTER_LOCAL_TOKEN' content/commercial-runtime.js settings/config.js; then
            echo 'Backend secret identifier leaked into Build 22 browser surface'
            exit 1
          fi
          if grep -q 'chrome.storage.local' content/commercial-runtime.js; then
            echo 'Commercial runtime must not create a second persistent credential store'
            exit 1
          fi

      - name: Preserve existing execution guarantees
        run: |
          grep -q 'ld_reserve_command' supabase/functions/ld-command/index.ts
          grep -q 'ld_complete_command' supabase/functions/ld-command/index.ts
          grep -q 'cross_provider_fallback:false' supabase/functions/ld-model-gateway/index.ts
          grep -q 'trust_attestation_required:true' supabase/functions/ld-model-gateway/index.ts
          grep -q 'MODEL_GATEWAY_REQUIRED' supabase/functions/ld-command/index.ts

      - name: No invasive observers or transport monkeypatches
        run: |
          BASE=83eff9ec019d6c9c33d869ebfdcb68f35c1bbfd1
          ADDED="$(git diff -U0 "$BASE"...HEAD | grep '^+' | grep -v '^+++' || true)"
          if printf '%s\n' "$ADDED" | grep -E 'new[[:space:]]+MutationObserver|window\.fetch[[:space:]]*=|globalThis\.fetch[[:space:]]*=|XMLHttpRequest\.prototype|navigator\.sendBeacon[[:space:]]*='; then
            echo 'Forbidden invasive observer/transport patch detected in Build 22 diff'
            exit 1
          fi

      - name: Build 22 scope lock
        run: |
          BASE=83eff9ec019d6c9c33d869ebfdcb68f35c1bbfd1
          FAILED=0
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/v2.4-build22-commercial-platform.yml|manifest.json|settings/config.js|content/commercial-runtime.js|supabase/functions/ld-commercial/index.ts|supabase/functions/ld-license-validate/index.ts|supabase/functions/ld-mercadopago-webhook/index.ts|supabase/migrations/20260828231000_build22_commercial_platform.sql|docs/BUILD22_COMMERCIAL_PLATFORM.md|tests/build22-commercial-platform-sim.mjs) ;;
              *) echo "Unexpected Build 22 modification: $path"; FAILED=1 ;;
            esac
          done < <(git diff --name-only "$BASE"...HEAD)
          test "$FAILED" -eq 0

      - name: Documentation contract
        run: |
          test -f docs/BUILD22_COMMERCIAL_PLATFORM.md
          grep -q '4 horas contínuas' docs/BUILD22_COMMERCIAL_PLATFORM.md
          grep -q 'time_30d' docs/BUILD22_COMMERCIAL_PLATFORM.md
          grep -q 'time_365d' docs/BUILD22_COMMERCIAL_PLATFORM.md
          grep -q 'BYOK é opcional' docs/BUILD22_COMMERCIAL_PLATFORM.md
          grep -q 'não é gravada nas tabelas comerciais' docs/BUILD22_COMMERCIAL_PLATFORM.md
          grep -q 'não publica OTA/release oficial automaticamente' docs/BUILD22_COMMERCIAL_PLATFORM.md

      - name: Package Build 22 candidate
        run: |
          rm -rf /tmp/ld-build22 && mkdir -p /tmp/ld-build22
          rsync -a ./ /tmp/ld-build22/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='supabase' \
            --exclude='runtime' \
            --exclude='docs' \
            --exclude='tests' \
            --exclude='benchmark' \
            --exclude='training' \
            --exclude='*.zip' \
            --exclude='*.sha256'
          test -f /tmp/ld-build22/manifest.json
          test -f /tmp/ld-build22/content/commercial-runtime.js
          test -f /tmp/ld-build22/content/build18-reconciliation.js
          cd /tmp/ld-build22
          zip -qr "$GITHUB_WORKSPACE/Lovable-Decrypter-v2.4-BUILD22-COMMERCIAL-PLATFORM.zip" .
          cd "$GITHUB_WORKSPACE"
          sha256sum Lovable-Decrypter-v2.4-BUILD22-COMMERCIAL-PLATFORM.zip > Lovable-Decrypter-v2.4-BUILD22-COMMERCIAL-PLATFORM.sha256
          if unzip -l Lovable-Decrypter-v2.4-BUILD22-COMMERCIAL-PLATFORM.zip | grep -qE ' (supabase|runtime|docs|tests|benchmark|training)/'; then exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: Lovable-Decrypter-v2.4-BUILD22-COMMERCIAL-PLATFORM
          path: |
            Lovable-Decrypter-v2.4-BUILD22-COMMERCIAL-PLATFORM.zip
            Lovable-Decrypter-v2.4-BUILD22-COMMERCIAL-PLATFORM.sha256
          if-no-files-found: error
