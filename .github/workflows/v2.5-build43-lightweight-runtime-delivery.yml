name: v2.5 Build 43 · Lightweight Runtime & Delivery

on:
  push:
    branches: [main, v2.5-build43-lightweight-runtime-delivery]
    paths:
      - 'ui/lightweight-runtime-delivery.js'
      - 'ui/productivity-suite.js'
      - 'ui/branding-white-label.js'
      - 'ui/decrypter-marketplace.js'
      - 'manifest.json'
      - '.github/workflows/v2.5-build40-productivity-suite.yml'
      - '.github/workflows/v2.5-build41-branding-white-label.yml'
      - '.github/workflows/v2.5-build42-decrypter-marketplace.yml'
      - '.github/workflows/v2.5-build43-lightweight-runtime-delivery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          node --check ui/lightweight-runtime-delivery.js
          node --check ui/productivity-suite.js
          node --check ui/branding-white-label.js
          node --check ui/decrypter-marketplace.js

      - name: Validate manifest delivery order
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const [a=0,b=0,c=0]=String(m.version||'0.0.0').split('.').map(Number);
          if(a*10000+b*100+c<20543) throw new Error('manifest version older than Build 43');
          const early=(m.content_scripts||[]).find(x=>(x.js||[]).includes('content/early-boot-sentinel.js'));
          if(!early||early.run_at!=='document_start'||early.all_frames!==true) throw new Error('early boot regression');
          const main=(m.content_scripts||[]).find(x=>(x.js||[]).includes('ui/lightweight-runtime-delivery.js'));
          if(!main||main.run_at!=='document_idle'||main.all_frames!==false) throw new Error('delivery runtime wiring missing');
          const order=['ui/lightweight-runtime-delivery.js','ui/productivity-suite.js','ui/branding-white-label.js','ui/decrypter-marketplace.js'];
          for(const f of order) if(!(main.js||[]).includes(f)) throw new Error('missing runtime file '+f);
          for(let i=1;i<order.length;i++) if(main.js.indexOf(order[i-1])>main.js.indexOf(order[i])) throw new Error('invalid delivery load order '+order[i]);
          if(JSON.stringify(m.permissions)!==JSON.stringify(['storage','tabs','downloads','unlimitedStorage','alarms'])) throw new Error('permissions changed');
          NODE

      - name: Validate shared bounded scheduler
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('ui/lightweight-runtime-delivery.js','utf8');
          for(const x of ['LovableDecrypterDeliveryScheduler','new Map()','maxAttempts','tasks.size','clearTimeout(wakeTimer)','ld43:delivery-task-finished','build:43']) if(!s.includes(x)) throw new Error('missing scheduler contract '+x);
          if(s.includes('setInterval(')) throw new Error('scheduler must not use setInterval');
          const timers=(s.match(/setTimeout\(/g)||[]).length;
          if(timers!==1) throw new Error(`scheduler must own exactly one timeout call site, found ${timers}`);
          for(const x of ['MutationObserver','fetch(','XMLHttpRequest','sendBeacon','chrome.scripting','window.fetch =','globalThis.fetch =']) if(s.includes(x)) throw new Error('scheduler boundary violation '+x);
          NODE

      - name: Validate polling consolidation
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const files={
            productivity:['ui/productivity-suite.js','build40:productivity-rail'],
            branding:['ui/branding-white-label.js','build41:branding-rail'],
            marketplace:['ui/decrypter-marketplace.js','build42:marketplace-rail']
          };
          for(const [name,[path,id]] of Object.entries(files)) {
            const s=fs.readFileSync(path,'utf8');
            if(s.includes('setInterval(')) throw new Error(`${name} independent polling remains`);
            if(!s.includes('LovableDecrypterDeliveryScheduler')||!s.includes(id)||!s.includes('maxAttempts:120')) throw new Error(`${name} not registered in shared scheduler`);
          }
          const branding=fs.readFileSync('ui/branding-white-label.js','utf8');
          if(!branding.includes('profileLoaded')||!branding.includes('if (!profileLoaded) await loadProfile()')) throw new Error('branding storage-read dedupe missing');
          NODE

      - name: Validate cumulative safety invariants
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const files=['ui/lightweight-runtime-delivery.js','ui/productivity-suite.js','ui/branding-white-label.js','ui/decrypter-marketplace.js'];
          const all=files.map(f=>fs.readFileSync(f,'utf8')).join('\n');
          for(const x of ['XMLHttpRequest.prototype','navigator.sendBeacon =','window.fetch =','globalThis.fetch =','document.documentElement, { childList:true, subtree:true','eval(','new Function']) if(all.includes(x)) throw new Error('runtime safety regression '+x);
          const market=fs.readFileSync('ui/decrypter-marketplace.js','utf8');
          if(!market.includes('api.createCustom')||!market.includes('api.deleteCustom')) throw new Error('Marketplace Skills Engine boundary regressed');
          const prod=fs.readFileSync('ui/productivity-suite.js','utf8');
          if(!prod.includes('LD2_HISTORY_GET')||!prod.includes('target.click()')) throw new Error('Productivity authority reuse regressed');
          NODE
