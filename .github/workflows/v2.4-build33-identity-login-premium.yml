name: v2.4 Build 33 · Identity & Login Premium

on:
  push:
    branches:
      - v2.4-build33-identity-login-premium
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check ui/license-gate-premium.js
          node --check ui/voice-feedback.js
      - name: Validate manifest wiring
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('manifest.json','utf8'));
          if (m.version !== '2.4.33') throw new Error(`Unexpected version ${m.version}`);
          const c = m.content_scripts?.[0] || {};
          const js = c.js || [];
          const css = c.css || [];
          if (!js.includes('ui/license-gate-premium.js')) throw new Error('Premium license JS not wired');
          if (!css.includes('ui/license-gate-premium.css')) throw new Error('Premium license CSS not wired');
          if (js.indexOf('ui/license-gate-premium.js') < js.indexOf('ui/ui.js')) throw new Error('Premium decorator must load after base UI');
          if (js.indexOf('ui/voice-feedback.js') < js.indexOf('ui/license-gate-premium.js')) throw new Error('Voice module must load after premium gate');
          NODE
      - name: Validate premium activation contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('ui/license-gate-premium.js','utf8');
          const css = fs.readFileSync('ui/license-gate-premium.css','utf8');
          for (const token of ['data-license-gate','data-license-input','data-license-login','data-license-status']) {
            if (!src.includes(token)) throw new Error(`Missing existing login contract: ${token}`);
          }
          for (const token of ['Ative o Lovable Decrypter','Ativar Decrypter','Conexão segura','Comunidade Decrrypter','navigator.clipboard.readText']) {
            if (!src.includes(token)) throw new Error(`Missing premium UX token: ${token}`);
          }
          if (!css.includes('.ld2-license-box[data-state="validating"]')) throw new Error('Validating visual state missing');
          if (!css.includes('.ld2-license-box[data-state="error"]')) throw new Error('Error visual state missing');
          NODE
      - name: Validate safety invariants
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('ui/license-gate-premium.js','utf8');
          const forbidden = [
            /window\.fetch\s*=/,
            /XMLHttpRequest\.prototype/,
            /sendBeacon\s*=/,
            /document\.documentElement.*MutationObserver/s,
            /https?:\/\/api\./
          ];
          for (const pattern of forbidden) if (pattern.test(src)) throw new Error(`Forbidden pattern ${pattern}`);
          const observers = (src.match(/new MutationObserver/g) || []).length;
          if (observers > 1) throw new Error(`Too many observers: ${observers}`);
          NODE
