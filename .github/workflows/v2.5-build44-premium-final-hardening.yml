name: v2.5 Build 44 · Premium Final Hardening

on:
  push:
    branches: [main, v2.5-build44-premium-final-hardening]
    paths:
      - 'content/**/*.js'
      - 'ui/**/*.js'
      - 'background/**/*.js'
      - 'manifest.json'
      - '.github/workflows/v2.5-build44-premium-final-hardening.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          node --check content/runtime-integrity-guard.js
          node --check content/hardening-core.js
          node --check content/hardening-sentinel.js

      - name: Validate manifest security boundaries
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const [a=0,b=0,c=0]=String(m.version||'0.0.0').split('.').map(Number);
          if(a*10000+b*100+c<20544) throw new Error('manifest version older than Build 44');
          const early=(m.content_scripts||[]).find(x=>(x.js||[]).includes('content/early-boot-sentinel.js'));
          if(!early||early.run_at!=='document_start'||early.all_frames!==true||early.match_about_blank!==true) throw new Error('zero-gap early boot regression');
          const main=(m.content_scripts||[]).find(x=>(x.js||[]).includes('content/runtime-integrity-guard.js'));
          if(!main||main.run_at!=='document_idle'||main.all_frames!==false) throw new Error('integrity guard wiring missing');
          const order=['content/hardening-core.js','content/capability-registry.js','content/runtime-integrity-guard.js','content/hardening-sentinel.js'];
          for(const f of order) if(!(main.js||[]).includes(f)) throw new Error('missing hardening component '+f);
          for(let i=1;i<order.length;i++) if(main.js.indexOf(order[i-1])>main.js.indexOf(order[i])) throw new Error('invalid hardening load order '+order[i]);
          if(JSON.stringify(m.permissions)!==JSON.stringify(['storage','tabs','downloads','unlimitedStorage','alarms'])) throw new Error('permissions changed');
          NODE

      - name: Validate runtime integrity contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('content/runtime-integrity-guard.js','utf8');
          for(const x of ['LovableDecrypterIntegrity','ld-runtime-integrity/1','extension.runtime_id','boot.early_sentinel','boot.top_scope','credentials.sentinel_guard','network.fetch_identity','network.xhr_open_identity','network.xhr_send_identity','network.beacon_identity','ld2:runtime-integrity','build: BUILD']) if(!s.includes(x)) throw new Error('missing integrity contract '+x);
          const forbidden=[
            [/setInterval\s*\(/,'setInterval'],
            [/MutationObserver/,'MutationObserver'],
            [/window\.postMessage\s*\(/,'window.postMessage'],
            [/\beval\s*\(/,'eval'],
            [/new\s+Function\s*\(/,'new Function'],
            [/(?:window|globalThis)\.fetch\s*=(?!=)/,'fetch assignment'],
            [/navigator\.sendBeacon\s*=(?!=)/,'sendBeacon assignment'],
            [/XMLHttpRequest\.prototype\.(?:open|send)\s*=(?!=)/,'XHR prototype assignment']
          ];
          for(const [rx,label] of forbidden) if(rx.test(s)) throw new Error('integrity guard must observe, never patch: '+label);
          NODE

      - name: Validate fail-closed integration
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const source=fs.readFileSync('content/hardening-core.js','utf8');
          const sandbox={window:{}};
          vm.runInNewContext(source,sandbox);
          const core=sandbox.window.LovableDecrypterHardeningCore;
          if(!core||core.integrityBuild!==44) throw new Error('Build 44 hardening core marker missing');
          const base={online:true,routingEnabled:true,chat:{mounted:true,phase:'READY'},capabilitySummary:{status:'ready'}};
          const broken=core.evaluateHardening({...base,integrity:{status:'broken'}});
          if(broken.phase!=='LOCKED'||broken.reason!=='runtime_integrity_broken'||broken.failClosed!==true) throw new Error('broken integrity must lock fail-closed');
          const ready=core.evaluateHardening({...base,integrity:{status:'ready'}});
          if(ready.phase!=='READY'||ready.failClosed!==true) throw new Error('healthy protected state regressed');
          const native=core.evaluateHardening({...base,routingEnabled:false,integrity:{status:'broken'}});
          if(native.phase!=='READY'||native.reason!=='native_mode'||native.failClosed!==false) throw new Error('native routing-off mode must remain available');
          NODE

      - name: Validate adaptive hardening heartbeat
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('content/hardening-sentinel.js','utf8');
          for(const x of ['DEGRADED_WATCH_MS','BUSY_WATCH_MS','READY_WATCH_MS','HIDDEN_WATCH_MS','EVENT_DEBOUNCE_MS','verifyIntegrity','integrity: state.integrity','state.integrity?.status === \'ready\'','armWatchdog','hardeningBuild: 44','ld2:runtime-integrity']) if(!s.includes(x)) throw new Error('missing adaptive hardening contract '+x);
          if(s.includes('setInterval(')||s.includes('clearInterval(')) throw new Error('fixed permanent hardening interval reintroduced');
          if(!s.includes("phase: 'LOCKED', reason: 'hardening_core_unavailable'")) throw new Error('missing fail-closed core fallback');
          NODE

      - name: Repository supply-chain regression scan
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const roots=['content','ui','background'];
          const files=[];
          const walk=p=>{for(const name of fs.readdirSync(p)){const f=path.join(p,name),st=fs.statSync(f);if(st.isDirectory())walk(f);else if(/\.js$/.test(f))files.push(f)}};
          roots.forEach(r=>walk(r));
          const forbidden=[
            [/(?:window|globalThis)\.fetch\s*=(?!=)/,'global fetch assignment'],
            [/XMLHttpRequest\.prototype\.(?:open|send)\s*=(?!=)/,'XHR prototype assignment'],
            [/navigator\.sendBeacon\s*=(?!=)/,'sendBeacon assignment'],
            [/window\.postMessage\s*\(/,'page-world postMessage bridge'],
            [/\beval\s*\(/,'eval'],
            [/new\s+Function\s*\(/,'new Function']
          ];
          for(const file of files){const s=fs.readFileSync(file,'utf8');for(const [rx,label] of forbidden)if(rx.test(s))throw new Error(`${label} forbidden in ${file}`)}
          NODE
