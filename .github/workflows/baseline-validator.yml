name: Finalize Lovable Decrypter v2.1.1 baseline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct and validate v2.1.1
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin baseline-v2.1.1:refs/remotes/origin/baseline-v2.1.1
          : > /tmp/source.b64
          for i in $(seq -w 0 19); do
            git show "origin/baseline-v2.1.1:_baseline/chunk${i}" >> /tmp/source.b64
          done
          base64 -d /tmp/source.b64 > /tmp/source.tar.xz
          echo "ef0b7c4f560fc66f49494e92698ed6102c1039ca2d658a2c9c30e4b6b43cad1a  /tmp/source.tar.xz" | sha256sum -c -
          rm -rf /tmp/source
          mkdir -p /tmp/source
          tar -xJf /tmp/source.tar.xz -C /tmp/source
          test "$(find /tmp/source -type f | wc -l)" -eq 31
          test -f /tmp/source/manifest.json
          test -f /tmp/source/background/service-worker.js
          test -f /tmp/source/ui/ui.js
          test -f /tmp/source/ui/matrix.css
          test -f /tmp/source/ai/gemini-agent.js
          test -f /tmp/source/assets/fab.png
          node -e "const m=require('/tmp/source/manifest.json'); if(m.version!=='2.1.1') process.exit(1)"
          node --check /tmp/source/background/service-worker.js
          node --check /tmp/source/ui/ui.js
          node --check /tmp/source/ai/gemini-agent.js
          python -m json.tool /tmp/source/manifest.json >/dev/null

      - name: Replace main with validated baseline
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/source/. .
          test "$(find . -type f ! -path './.git/*' | wc -l)" -eq 31
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "baseline: validated Lovable Decrypter v2.1.1"
          git push origin main
