name: Validate v2.4 Build 31 Hardening Regression

on:
  push:
    branches:
      - v2.4-build31-hardening-regression
  pull_request:
    branches:
      - main
      - v2.4-build31-hardening-regression

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build 31 identity and boot contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          if(m.version!=='2.4.31') throw new Error(`Unexpected version ${m.version}`);
          if(m.version_name!=='2.4 Build 31 · Hardening Regression') throw new Error('Build 31 version_name missing');
          const js=m.content_scripts?.[0]?.js||[];
          const approval=js.indexOf('content/approval-auto-repair.js');
          const core=js.indexOf('content/hardening-core.js');
          const registry=js.indexOf('content/capability-registry.js');
          const sentinel=js.indexOf('content/hardening-sentinel.js');
          if(!(approval>=0&&core>approval&&registry>core&&sentinel>registry)) throw new Error('Build 31 hardening boot order invalid');
          NODE
          grep -q "export const VERSION = '2.4.31'" settings/config.js
          grep -q "export const TRUST_PROTOCOL_VERSION = '2.4.21'" settings/config.js

      - name: Syntax check all JavaScript and tests
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' | LC_ALL=C sort)

      - name: Build 31 hardening simulation
        run: node tests/build31-hardening-regression.mjs

      - name: Full repository regression simulations
        run: |
          while IFS= read -r testfile; do
            echo "==> $testfile"
            node "$testfile"
          done < <(find tests -maxdepth 1 -type f -name '*.mjs' | LC_ALL=C sort)

      - name: Capability registry contract
        run: |
          for capability in workspace.tree workspace.file workspace.metadata workspace.download project.state_graph recovery.scan composer.mount chat.host plan.surface approval.transaction; do
            grep -q "'$capability'" content/capability-registry.js
          done
          grep -q 'ld-capability-registry/1' content/capability-registry.js
          grep -q 'ld-hardening-state/1' content/hardening-sentinel.js

      - name: Final fail-closed matrix
        run: |
          grep -q "window.addEventListener('keydown', onKeydown, true)" content/hardening-sentinel.js
          grep -q "window.addEventListener('click', onClick, true)" content/hardening-sentinel.js
          grep -q "window.addEventListener('submit', onSubmit, true)" content/hardening-sentinel.js
          grep -q "window.addEventListener('offline'" content/hardening-sentinel.js
          grep -q "window.addEventListener('online'" content/hardening-sentinel.js
          grep -q 'safeRemount' content/hardening-sentinel.js
          grep -q 'native_enter_blocked' content/hardening-sentinel.js
          grep -q 'native_send_click_blocked' content/hardening-sentinel.js
          grep -q 'native_form_submit_blocked' content/hardening-sentinel.js
          grep -q 'APPROVAL_ALREADY_APPLIED' background/approval-runtime.js
          grep -q 'APPROVAL_VALIDATION_HASH_CHANGED' background/approval-runtime.js
          grep -q 'nativeFallback: false' content/decrypter-chat.js
          grep -q 'Pular aprovação, não proteções' content/approval-auto-repair.js

      - name: Browser non-invasive integration gate
        run: |
          for file in content/hardening-core.js content/capability-registry.js content/hardening-sentinel.js; do
            ! grep -Eq 'window\.fetch[[:space:]]*=|globalThis\.fetch[[:space:]]*=|XMLHttpRequest\.prototype|navigator\.sendBeacon[[:space:]]*=|new[[:space:]]+MutationObserver' "$file"
          done
          ! grep -Eq 'new[[:space:]]+KeyboardEvent|dispatchEvent\(new[[:space:]]+KeyboardEvent|\.click\(\)|requestSubmit\(|\.submit\(\)' content/hardening-sentinel.js

      - name: Backend and database freeze
        run: |
          BASE=83ee46a4beeaab6d00b867a22ae88c7a19d58a60
          if git diff --name-only "$BASE"...HEAD -- supabase | grep -q .; then
            echo 'Build 31 must not change Supabase backend or database schema'
            exit 1
          fi

      - name: Freeze official release surfaces
        run: |
          BASE=83ee46a4beeaab6d00b867a22ae88c7a19d58a60
          for path in .github/RELEASE_TRIGGER updates/latest.json updates/release.json .github/workflows/release.yml; do
            if git diff --name-only "$BASE"...HEAD -- "$path" | grep -q .; then
              echo "Official release surface changed: $path"
              exit 1
            fi
          done

      - name: Build 31 scope lock
        run: |
          BASE=83ee46a4beeaab6d00b867a22ae88c7a19d58a60
          FAILED=0
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/v2.4-build31-hardening-regression.yml|content/hardening-core.js|content/capability-registry.js|content/hardening-sentinel.js|docs/BUILD31_HARDENING_REGRESSION.md|manifest.json|settings/config.js|tests/build30-approve-skip-auto-repair.mjs|tests/build31-hardening-regression.mjs) ;;
              *) echo "Unexpected Build 31 modification: $path"; FAILED=1 ;;
            esac
          done < <(git diff --name-only "$BASE"...HEAD)
          test "$FAILED" -eq 0

      - name: Documentation contract
        run: |
          grep -q 'Trust protocol: `2.4.21`' docs/BUILD31_HARDENING_REGRESSION.md
          grep -qi 'fail-closed' docs/BUILD31_HARDENING_REGRESSION.md
          grep -q 'workspace.tree' docs/BUILD31_HARDENING_REGRESSION.md
          grep -q 'Official release remains a separate explicit action' docs/BUILD31_HARDENING_REGRESSION.md
