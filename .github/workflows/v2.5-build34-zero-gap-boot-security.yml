name: v2.5 Build 34 · Zero-Gap Boot Security

on:
  push:
    branches:
      - v2.5-build34-zero-gap-boot-security
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check content/early-boot-sentinel.js
          node --check content/hardening-sentinel.js
          node --check content/composer-guardian.js
      - name: Validate manifest boot layers
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('manifest.json','utf8'));
          if (m.version !== '2.5.34') throw new Error(`Unexpected version ${m.version}`);
          const blocks = m.content_scripts || [];
          const early = blocks.find(x => (x.js || []).includes('content/early-boot-sentinel.js'));
          if (!early) throw new Error('Early boot block missing');
          if (early.run_at !== 'document_start') throw new Error('Early boot timing invalid');
          if (early.all_frames !== true) throw new Error('Frame coverage invalid');
          if (early.match_about_blank !== true) throw new Error('Child-frame coverage invalid');
          if ((early.js || []).length !== 1) throw new Error('Early boot layer must stay minimal');
          const app = blocks.find(x => (x.js || []).includes('content/hardening-sentinel.js'));
          if (!app || app.run_at !== 'document_idle' || app.all_frames !== false) throw new Error('Main runtime boundary changed');
          NODE
      - name: Validate early boot contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('content/early-boot-sentinel.js','utf8');
          const required = [
            "const isTopFrame = window === window.top",
            "routingEnabled: true",
            "routingResolved: false",
            "event?.isTrusted === true",
            "if (!isTopFrame || state.handedOff) return",
            "window.LovableDecrypterHardening",
            "schema: 'ld-early-boot/1'"
          ];
          for (const token of required) if (!s.includes(token)) throw new Error(`Missing contract: ${token}`);
          NODE
