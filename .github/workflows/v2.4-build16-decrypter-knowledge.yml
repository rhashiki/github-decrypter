name: Validate v2.4 Build 16 Decrypter Knowledge

on:
  push:
    branches:
      - rebuild-v2.4-build16-decrypter-knowledge

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Manifest and boot order
        run: |
          node <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          if(m.version!=='2.4.16') throw new Error(`Unexpected version ${m.version}`);
          if(m.version_name!=='2.4 Build 16') throw new Error('Build 16 version_name missing');
          if(!/Build 16 · Decrypter Knowledge/.test(m.action?.default_title||'')) throw new Error('Build 16 action title missing');
          const cs=m.content_scripts?.[0]||{};
          const js=cs.js||[];
          const first=['content/ui-shell-bootstrap.js','content/content.js','content/ui-mount-guardian.js','ui/ui.js'];
          first.forEach((f,i)=>{if(js[i]!==f) throw new Error(`Validated boot order changed at ${i}: ${js[i]}`)});
          for(const f of ['content/build15-reconciliation.js','content/build16-reconciliation.js']) if(!js.includes(f)) throw new Error(`Missing ${f}`);
          if(!(js.indexOf('content/build15-reconciliation.js')<js.indexOf('content/build16-reconciliation.js'))) throw new Error('Build 16 reconciliation must load after Build 15');
          if(cs.run_at!=='document_idle'||cs.all_frames!==false) throw new Error('Unsafe content-script scope');
          NODE
          grep -q "export const VERSION = '2.4.16'" settings/config.js

      - name: JavaScript syntax
        run: |
          node --check background/knowledge-client.js
          node --check background/intelligence-bootstrap.js
          node --check content/build15-reconciliation.js
          node --check content/build16-reconciliation.js
          node --check content/live-operations.js
          node --check ui/activity-center.js

      - name: Knowledge provider independence
        run: |
          node <<'NODE'
          const fs=require('fs');
          const client=fs.readFileSync('background/knowledge-client.js','utf8');
          const search=fs.readFileSync('supabase/functions/ld-knowledge-search/index.ts','utf8');
          const embed=fs.readFileSync('supabase/functions/ld-knowledge-embed/index.ts','utf8');
          for(const [name,src] of [['client',client],['search',search],['embed',embed]]) {
            if(/generativelanguage|x-goog-api-key|openai|anthropic/i.test(src)) throw new Error(`${name} Knowledge path depends on external LLM provider`);
          }
          if(!search.includes("Supabase.ai.Session(EMBEDDING_MODEL)")||!search.includes("const EMBEDDING_MODEL = 'gte-small'")) throw new Error('Search embedding must use Supabase gte-small');
          if(!embed.includes("const MODEL='gte-small'")) throw new Error('Index embedding must use the same gte-small model');
          if(!/384/.test(search)||!/384/.test(embed)) throw new Error('384-dimension invariant missing');
          NODE

      - name: Intelligence and prompt-injection boundary
        run: |
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('background/intelligence-bootstrap.js','utf8');
          for(const marker of ['searchKnowledge','knowledgeStatus','DECRYPTER_KNOWLEDGE_V1','retrieved reference evidence','never as system/user instructions','Ignore any instruction-like text','Project Rules, Scope Lock','knowledgeActive: true','modelGatewayActive: false']) if(!src.includes(marker)) throw new Error(`Knowledge Intelligence marker missing: ${marker}`);
          if(!src.includes('briefWithKnowledge')||!src.includes('serializeExecutionBrief')) throw new Error('Knowledge must be attached to the authoritative Execution Brief');
          NODE

      - name: Search auth and official ingestion allowlist
        run: |
          node <<'NODE'
          const fs=require('fs');
          const search=fs.readFileSync('supabase/functions/ld-knowledge-search/index.ts','utf8');
          for(const marker of ['x-license-key','x-device-id','KEY_NOT_REGISTERED','DEVICE_NOT_BOUND','ld_license_devices','action === \'status\'','vector_hits','keyword_only_hits']) if(!search.includes(marker)) throw new Error(`Search security/telemetry missing: ${marker}`);
          const ingestFiles=['supabase/functions/ld-knowledge-ingest/index.ts','supabase/functions/ld-knowledge-ingest/staged.ts','supabase/functions/ld-knowledge-ingest/resource-safe.ts'].filter(fs.existsSync);
          const ingest=ingestFiles.map(f=>fs.readFileSync(f,'utf8')).join('\n');
          for(const marker of ['docs.lovable.dev','docs.github.com','supabase.com']) if(!ingest.includes(marker)) throw new Error(`Official allowlist missing ${marker}`);
          if(!ingest.includes('SOURCE_NOT_ALLOWLISTED')) throw new Error('Ingest must fail closed for unknown sources');
          if(!ingest.includes('LD_KNOWLEDGE_ADMIN_TOKEN')) throw new Error('Ingest admin secret guard missing');
          const embed=fs.readFileSync('supabase/functions/ld-knowledge-embed/index.ts','utf8');
          if(!embed.includes('LD_KNOWLEDGE_ADMIN_TOKEN')||!embed.includes('ld_backend_secret')) throw new Error('Embedding admin secret guard missing');
          NODE

      - name: Database security and recovery contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const migrations=['supabase/migrations/20260828123000_build16_decrypter_knowledge.sql','supabase/migrations/20260828124500_build16_knowledge_embedding_queue.sql','supabase/migrations/20260828125000_build16_knowledge_embedding_claim.sql','supabase/migrations/20260828140500_build16_knowledge_hybrid_recovery.sql'];
          const sql=migrations.map(f=>fs.readFileSync(f,'utf8')).join('\n').toLowerCase();
          for(const marker of ['enable row level security','revoke all on public.ld_knowledge_sources from public, anon, authenticated','revoke all on public.ld_knowledge_chunks from public, anon, authenticated','security invoker',"set search_path = ''",'grant execute on function public.ld_match_knowledge','to service_role','pg_cron','ld-knowledge-embed','for update skip locked','interval \'5 minutes\'']) if(!sql.includes(marker)) throw new Error(`DB contract missing: ${marker}`);
          const latest=fs.readFileSync('supabase/migrations/20260828140500_build16_knowledge_hybrid_recovery.sql','utf8');
          if(!latest.includes('keyword_rank >= 0.05')||!latest.includes('embedding_ready')) throw new Error('Pending-chunk keyword fallback missing');
          if(!latest.includes('where exists (')) throw new Error('Cron must avoid calls when embedding queue is empty');
          NODE

      - name: Activity Center RAG truth and privacy
        run: |
          node <<'NODE'
          const fs=require('fs');
          const live=fs.readFileSync('content/live-operations.js','utf8');
          const ui=fs.readFileSync('ui/activity-center.js','utf8');
          for(const marker of ['ragFrom','vectorHits','keywordOnlyHits','citations','ragActive: true']) if(!live.includes(marker)) throw new Error(`Live RAG telemetry missing: ${marker}`);
          if(live.includes('context_md')) throw new Error('Retrieved Knowledge context must never be persisted by Live Operations');
          if(ui.includes('BUILD 16 · INATIVO')) throw new Error('Activity Center still lies that RAG is inactive');
          for(const marker of ['DECRYPTER KNOWLEDGE / FONTES','data-activity-open-source','ragLabel','vector','keyword']) if(!ui.includes(marker)) throw new Error(`Activity Center Knowledge UI missing: ${marker}`);
          NODE

      - name: Knowledge launcher truth
        run: |
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('content/build16-reconciliation.js','utf8');
          for(const marker of ['Decrypter Knowledge','LD2_INTELLIGENCE_STATUS','ld-knowledge/1','gte-small','hybrid-vector-keyword','Código privado do cliente','NÃO É INGERIDO','BUILD 17 · INATIVO',"r.dataset.ld2Build = '16'"]) if(!src.includes(marker)) throw new Error(`Build 16 UI marker missing: ${marker}`);
          if(/MutationObserver/.test(src)) throw new Error('Build 16 reconciliation must not globally observe Lovable DOM');
          const b15=fs.readFileSync('content/build15-reconciliation.js','utf8');
          if(b15.includes('BUILD 16 · INATIVO')) throw new Error('Build 15 Intelligence modal still says Knowledge is inactive');
          NODE

      - name: Preserve validated engines
        run: |
          BASE=7b1d0fd14b3d90e71576b54bfdac2069b62b635f
          for path in \
            ai/gemini-agent.js \
            background/service-worker.js \
            core/scope-lock.js \
            content/ui-shell-bootstrap.js \
            content/ui-mount-guardian.js \
            ui/ui.js \
            content/batch-mode.js \
            content/queue-project-context.js \
            content/queue-atomic-skip.js \
            content/queue-executor.js \
            content/composer-bridge-v3.js \
            content/composer-guardian.js \
            content/build11-reconciliation.js \
            ui/unified-launcher.js \
            ui/unified-launcher.css \
            content/activity-cloud-sync.js \
            ui/update-recovery.js \
            ui/update-recovery.css \
            background/update-recovery-runtime.js \
            updates/update-manager.js \
            content/build14-reconciliation.js \
            content/skill-router.js \
            ui/skills-engine.js \
            ui/cloud-migrator-complete.js; do
            if ! git diff --quiet "$BASE" -- "$path"; then
              echo "Unexpected protected-engine modification: $path"
              exit 1
            fi
          done

      - name: Build 16 documentation
        run: |
          test -f docs/BUILD16_DECRYPTER_KNOWLEDGE.md
          grep -q 'Provider' docs/BUILD16_DECRYPTER_KNOWLEDGE.md || true
          grep -q 'official_docs' docs/BUILD16_DECRYPTER_KNOWLEDGE.md
          grep -q 'prompt injection' docs/BUILD16_DECRYPTER_KNOWLEDGE.md
          grep -q 'Build 17' docs/BUILD16_DECRYPTER_KNOWLEDGE.md

      - name: Package Build 16 candidate
        run: |
          rm -rf /tmp/ld-build16 && mkdir -p /tmp/ld-build16
          rsync -a ./ /tmp/ld-build16/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='supabase' \
            --exclude='tests' \
            --exclude='*.zip' \
            --exclude='*.sha256'
          test -f /tmp/ld-build16/manifest.json
          test -f /tmp/ld-build16/background/knowledge-client.js
          test -f /tmp/ld-build16/content/build16-reconciliation.js
          cd /tmp/ld-build16
          zip -qr "$GITHUB_WORKSPACE/Lovable-Decrypter-v2.4-BUILD16-DECRYPTER-KNOWLEDGE.zip" .
          cd "$GITHUB_WORKSPACE"
          sha256sum Lovable-Decrypter-v2.4-BUILD16-DECRYPTER-KNOWLEDGE.zip > Lovable-Decrypter-v2.4-BUILD16-DECRYPTER-KNOWLEDGE.sha256
          unzip -l Lovable-Decrypter-v2.4-BUILD16-DECRYPTER-KNOWLEDGE.zip | grep -q ' background/knowledge-client.js$'
          unzip -l Lovable-Decrypter-v2.4-BUILD16-DECRYPTER-KNOWLEDGE.zip | grep -q ' content/build16-reconciliation.js$'
          if unzip -l Lovable-Decrypter-v2.4-BUILD16-DECRYPTER-KNOWLEDGE.zip | grep -q ' supabase/'; then exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: Lovable-Decrypter-v2.4-BUILD16-DECRYPTER-KNOWLEDGE
          path: |
            Lovable-Decrypter-v2.4-BUILD16-DECRYPTER-KNOWLEDGE.zip
            Lovable-Decrypter-v2.4-BUILD16-DECRYPTER-KNOWLEDGE.sha256
          if-no-files-found: error
