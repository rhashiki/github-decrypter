name: Rebuild validated v2.1.1 baseline

on:
  push:
    branches:
      - baseline-v2.1.1
    paths:
      - _baseline/READY

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: baseline-v2.1.1
          fetch-depth: 0

      - name: Reconstruct and validate source
        shell: bash
        run: |
          set -euo pipefail
          cat _baseline/chunk* > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.tar.xz
          echo "a33e5c7d8eb6ef4327eb937b77b44280d06c09409dbc9ce387a2bd8591e5dd4e  /tmp/source.tar.xz" | sha256sum -c -
          rm -rf /tmp/source
          mkdir -p /tmp/source
          tar -xJf /tmp/source.tar.xz -C /tmp/source
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/source/. .
          test "$(find . -type f ! -path './.git/*' | wc -l)" -eq 31
          node -e "const m=require('./manifest.json'); if(m.version!=='2.1.1') process.exit(1)"

      - name: Commit validated baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "baseline: validated Lovable Decrypter v2.1.1"
          git push origin HEAD:baseline-v2.1.1
