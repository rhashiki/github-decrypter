name: v2.5 Build 46 · FAB Rail Cascade Premium

on:
  push:
    branches: [main, v2.5-build46-fab-rail-cascade-premium, v2.5-build47-nexus-ui-parity]
    paths:
      - 'ui/launcher-premium-v46.js'
      - 'ui/launcher-premium-v46.css'
      - 'ui/nexus-parity-v47.js'
      - 'ui/nexus-parity-v47.css'
      - 'manifest.json'
      - '.github/workflows/v2.5-build45-chat-activation-premium.yml'
      - '.github/workflows/v2.5-build46-fab-rail-cascade-premium.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          node --check ui/launcher-premium-v46.js
          if [ -f ui/nexus-parity-v47.js ]; then node --check ui/nexus-parity-v47.js; fi

      - name: Validate cumulative launcher contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const [a=0,b=0,c=0]=String(m.version||'0.0.0').split('.').map(Number);
          if(a*10000+b*100+c<20546) throw new Error('manifest version older than Build 46');
          const early=(m.content_scripts||[]).find(x=>(x.js||[]).includes('content/early-boot-sentinel.js'));
          if(!early||early.run_at!=='document_start'||early.all_frames!==true||early.match_about_blank!==true) throw new Error('zero-gap boot regression');
          const main=(m.content_scripts||[]).find(x=>x.run_at==='document_idle'&&x.all_frames===false);
          if(!main) throw new Error('main runtime block missing');
          const v47=(main.js||[]).includes('ui/nexus-parity-v47.js');
          if(v47){
            if(!(main.css||[]).includes('ui/nexus-parity-v47.css')) throw new Error('Build 47 CSS missing');
            if((main.js||[]).includes('ui/launcher-premium-v46.js')||(main.css||[]).includes('ui/launcher-premium-v46.css')) throw new Error('Build 46 must be unwired when Build 47 supersedes it');
            const c45=main.css.indexOf('ui/chat-activation-premium-v45.css'),c47=main.css.indexOf('ui/nexus-parity-v47.css');
            if(c45<0||c47<0||c45>c47) throw new Error('Build 45/47 CSS layering regression');
          } else {
            if(!(main.js||[]).includes('ui/launcher-premium-v46.js')||!(main.css||[]).includes('ui/launcher-premium-v46.css')) throw new Error('Build 46 wiring missing');
          }
          if(JSON.stringify(m.permissions)!==JSON.stringify(['storage','tabs','downloads','unlimitedStorage','alarms'])) throw new Error('permissions changed');
          NODE

      - name: Preserve repository supply-chain guarantees
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const files=[];const walk=p=>{for(const name of fs.readdirSync(p)){const f=path.join(p,name),st=fs.statSync(f);if(st.isDirectory())walk(f);else if(/\.js$/.test(f))files.push(f)}};
          ['content','ui','background'].forEach(walk);
          const forbidden=[
            [/(?:window|globalThis)\.fetch\s*=(?!=)/,'global fetch assignment'],
            [/XMLHttpRequest\.prototype\.(?:open|send)\s*=(?!=)/,'XHR prototype assignment'],
            [/navigator\.sendBeacon\s*=(?!=)/,'sendBeacon assignment'],
            [/window\.postMessage\s*\(/,'page-world postMessage bridge'],
            [/\beval\s*\(/,'eval'],
            [/new\s+Function\s*\(/,'new Function']
          ];
          for(const file of files){const s=fs.readFileSync(file,'utf8');for(const [rx,label] of forbidden)if(rx.test(s))throw new Error(`${label} forbidden in ${file}`)}
          NODE
