name: Validate v2.2 Preview Progress

on:
  push:
    branches:
      - control-center-v2.2.0
      - preview-progress-v2.2.0
    paths:
      - 'content/preview-progress-overlay.js'
      - 'ui/preview-progress-overlay.css'
      - 'manifest.json'
      - '.github/workflows/v2.2-preview-progress-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: node --check content/preview-progress-overlay.js

      - name: Manifest wiring
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const group = (m.content_scripts || []).find(x => (x.js || []).includes('content/cloud-runtime.js'));
          if (!group) throw new Error('Runtime content-script group missing');
          const js = group.js || [];
          const cloud = js.indexOf('content/cloud-runtime.js');
          const overlay = js.indexOf('content/preview-progress-overlay.js');
          const bridge = js.indexOf('content/composer-bridge.js');
          if (!(cloud >= 0 && cloud < overlay && overlay < bridge)) throw new Error('Preview progress wrapper must load after Cloud Runtime and before Composer Bridge');
          if (!(group.css || []).includes('ui/preview-progress-overlay.css')) throw new Error('Preview progress CSS missing from manifest');
          console.log('Manifest wiring OK');
          NODE

      - name: Real progress invariants
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('content/preview-progress-overlay.js', 'utf8');
          const required = [
            "LD2_BUILD_EXECUTE",
            "LD2_PLAN_APPROVE",
            "LD2_PROGRESS",
            "message?.current",
            "message?.total",
            "iframe-load",
            "iframe-src-change",
            "iframe-replaced",
            "loader-cycle",
            "active?.executionResolved",
            "active?.previewSignal",
            "setProgress(100",
            "aguarde enquanto atualizamos a pré visualização do seu projeto..."
          ];
          for (const token of required) if (!src.includes(token)) throw new Error(`Missing invariant: ${token}`);
          if (src.includes('setInterval(')) throw new Error('Progress must not use timer-driven increments');
          const hundreds = (src.match(/setProgress\(100/g) || []).length;
          if (hundreds !== 1) throw new Error(`100% must have one authoritative path; found ${hundreds}`);
          const finish = src.indexOf("function maybeFinish()");
          const guard = src.indexOf("if (!active?.executionResolved || !active?.previewSignal) return;", finish);
          const full = src.indexOf("setProgress(100", finish);
          if (!(finish >= 0 && guard > finish && full > guard)) throw new Error('100% is not guarded by execution + real preview signal');
          console.log('Real progress invariants OK');
          NODE

      - name: Blur and progress presentation
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const css = fs.readFileSync('ui/preview-progress-overlay.css', 'utf8');
          for (const token of ['backdrop-filter: blur(', '--ld2-preview-progress', 'width: var(--ld2-preview-progress)', '@media (prefers-reduced-motion: reduce)']) {
            if (!css.includes(token)) throw new Error(`Missing CSS invariant: ${token}`);
          }
          console.log('Presentation invariants OK');
          NODE
