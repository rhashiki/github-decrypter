name: Diagnostic v2.2.1 Safe Core

on:
  push:
    branches:
      - diagnostic-v2.2.1-safe-core
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate safe core isolation
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const scripts = (m.content_scripts || []).flatMap(x => x.js || []);
          const expected = [
            'content/credential-ui-guard.js',
            'content/content.js',
            'ui/ui.js',
            'ui/control-center.js',
            'content/composer-bridge.js'
          ];
          if (scripts.length !== expected.length || expected.some(x => !scripts.includes(x))) {
            throw new Error(`Safe core isolation failed: ${scripts.join(', ')}`);
          }
          if ((m.content_scripts || []).some(x => x.run_at !== 'document_idle')) throw new Error('All safe-core scripts must run at document_idle');
          if (m.background?.scripts) throw new Error('MV3 background.scripts forbidden');
          NODE
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -type f -name '*.js' ! -path './.git/*' -print0)
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          zip -qr Lovable-Decrypter-v2.2.1-SAFE-CORE.zip . -x '.git/*' '.github/*' 'Lovable-Decrypter-v2.2.1-SAFE-CORE.zip'
          sha256sum Lovable-Decrypter-v2.2.1-SAFE-CORE.zip | tee Lovable-Decrypter-v2.2.1-SAFE-CORE.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Lovable-Decrypter-v2.2.1-SAFE-CORE
          path: |
            Lovable-Decrypter-v2.2.1-SAFE-CORE.zip
            Lovable-Decrypter-v2.2.1-SAFE-CORE.sha256
          if-no-files-found: error
