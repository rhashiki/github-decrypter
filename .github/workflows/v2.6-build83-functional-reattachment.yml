name: v2.6 Build 83 · Modern Runtime Restoration

on:
  push:
    branches: [main, v2.6.83-functional-reattachment]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check packaged JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const { spawnSync } = require('child_process');
          const spec = require('./release/runtime-package.json');
          const files = (spec.paths || []).filter(file => file.endsWith('.js'));
          for (const file of files) {
            if (!fs.existsSync(file)) throw new Error(`Missing packaged JS: ${file}`);
            const result = spawnSync(process.execPath, ['--check', file], { stdio: 'inherit' });
            if (result.status !== 0) process.exit(result.status || 1);
          }
          console.log(`Syntax OK: ${files.length} packaged JS files`);
          NODE

      - name: Build83 complete modern restoration gate
        run: node scripts/test-build83-functional-reattachment.mjs

      - name: Canonical visual authority regression gate
        shell: bash
        run: |
          set -euo pipefail
          test ! -e ui
          test ! -e diagnostic
          test ! -e content/ui-shell-bootstrap.js
          test ! -e content/ui-mount-guardian.js
          test ! -e background/decrypter-chat-runtime.js
          test ! -e launcher/legacy-launcher.js
          ! grep -R -n -E 'ld2-root|ld2-native-bridge|nexus-parity|MutationObserver' launcher background/canonical-runtime-entry.js
          ! grep -n -E 'service-worker-entry|service-worker\.js|decrypter-chat-runtime' background/canonical-runtime-entry.js

      - name: Build69 DecrypterBench v2
        run: |
          node tests/build69-decrypterbench-v2.test.mjs
          node benchmark/decrypterbench-v2.mjs

      - name: Build75 Universal Agent Bench
        run: |
          node tests/build75-universal-agent-bench.test.mjs
          node benchmark/universal-agent-bench.mjs

      - name: Release preflight candidate
        run: node scripts/release-preflight.mjs --candidate

      - name: Package validated main-ready ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Lovable-Decrypter-v2.6.83-test.zip"
          mapfile -t RUNTIME_PATHS < <(node -e "require('./release/runtime-package.json').paths.forEach(p=>console.log(p))")
          mapfile -t EXCLUDED_PATHS < <(node -e "(require('./release/runtime-package.json').excluded_paths||[]).forEach(p=>console.log(p))")
          ZIP_ARGS=("$ZIP" "${RUNTIME_PATHS[@]}")
          if [ "${#EXCLUDED_PATHS[@]}" -gt 0 ]; then
            zip -qr "${ZIP_ARGS[@]}" -x "${EXCLUDED_PATHS[@]}"
          else
            zip -qr "${ZIP_ARGS[@]}"
          fi

          unzip -Z1 "$ZIP" > /tmp/build83-test-files.txt
          for required in \
            manifest.json \
            launcher/launcher-runtime.js \
            launcher/canonical-runtime-client.js \
            background/canonical-runtime-entry.js \
            background/local-model-runtime.js \
            background/tool-runtime.js \
            background/mcp-runtime.js \
            background/mcp-marketplace-runtime.js \
            background/context-engine-runtime.js \
            background/scope-intelligence-runtime.js \
            background/reversible-operations-runtime.js \
            background/continuity-runtime.js \
            background/local-agent-orchestrator.js \
            background/integration-readiness-runtime.js \
            background/integration-callback-runtime.js \
            background/agent-runtime-registry-runtime.js \
            background/portable-skills-runtime.js \
            background/agent-sandbox-runtime.js \
            background/native-agent-session-runtime.js; do
            grep -qx "$required" /tmp/build83-test-files.txt
          done

          ! grep -qx 'background/service-worker-entry.js' /tmp/build83-test-files.txt
          ! grep -qx 'background/service-worker.js' /tmp/build83-test-files.txt
          ! grep -qx 'background/decrypter-chat-runtime.js' /tmp/build83-test-files.txt
          ! grep -E '^(ui|content|diagnostic|benchmark|runtime|updates)/' /tmp/build83-test-files.txt
          sha256sum "$ZIP" | tee "${ZIP}.sha256"

      - name: Upload validated test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Lovable-Decrypter-v2.6.83-test
          path: |
            Lovable-Decrypter-v2.6.83-test.zip
            Lovable-Decrypter-v2.6.83-test.zip.sha256
          if-no-files-found: error
          retention-days: 14
