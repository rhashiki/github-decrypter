name: Validate v2.3 Stage 2 GitHub App

on:
  push:
    branches:
      - rebuild-v2.3-stage2-github-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Safe core manifest
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('manifest.json','utf8'));
          if (m.manifest_version !== 3) throw new Error('MV3 required');
          const scripts = (m.content_scripts || []).flatMap(x => x.js || []);
          const expected = [
            'content/credential-ui-guard.js',
            'content/content.js',
            'ui/ui.js',
            'ui/control-center.js',
            'content/composer-bridge.js'
          ];
          if (JSON.stringify(scripts) !== JSON.stringify(expected)) throw new Error(`SAFE CORE changed: ${scripts.join(', ')}`);
          if ((m.content_scripts || []).some(x => x.run_at !== 'document_idle')) throw new Error('All content scripts must remain document_idle');
          if ((m.content_scripts || []).some(x => x.world === 'MAIN')) throw new Error('MAIN-world injection is forbidden');
          if (!((m.content_scripts || [])[0]?.css || []).includes('ui/github-app.css')) throw new Error('GitHub App UI stylesheet missing');
          NODE

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -type f -name '*.js' ! -path './.git/*' -print0)

      - name: Preserve Stage 1 fail-closed routing
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const js = fs.readFileSync('content/composer-bridge.js','utf8');
          const required = [
            "const ROUTING_KEY = 'ld2_native_routing_enabled'",
            "document.addEventListener('click', interceptNativeClick, true)",
            "document.addEventListener('submit', interceptNativeSubmit, true)",
            "execute('lovable-enter')",
            "execute('lovable-send-button')",
            "type: 'LD2_PLAN_ONLY'",
            "type: 'LD2_BUILD_EXECUTE'",
            'validCommitSha(commitSha)',
            'GitHub não conectado',
            'Lovable não recebe o prompt'
          ];
          for (const needle of required) if (!js.includes(needle)) throw new Error(`Stage 1 invariant missing: ${needle}`);
          if (js.includes('data-ld2-run')) throw new Error('Duplicate Execute button returned');
          if (/window\.fetch\s*=/.test(js) || /XMLHttpRequest\.prototype/.test(js)) throw new Error('Lovable networking monkeypatch forbidden');
          NODE

      - name: GitHub App auth invariants
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const config = fs.readFileSync('settings/config.js','utf8');
          const adapter = fs.readFileSync('github/git-adapter.js','utf8');
          const runtime = fs.readFileSync('background/github-app-runtime.js','utf8');
          const entry = fs.readFileSync('background/service-worker-entry.js','utf8');
          const ui = fs.readFileSync('ui/control-center.js','utf8');

          if (!config.includes("authMode: 'github_app'")) throw new Error('GitHub App must be default auth mode');
          if (!config.includes("if (merged.github.authMode !== 'legacy_token') merged.github.token = ''")) throw new Error('PAT must be cleared in normal GitHub App mode');
          if (!adapter.includes('installationAccessToken')) throw new Error('GitAdapter must resolve installation token');
          if (!adapter.includes('/ld-github-app')) throw new Error('GitAdapter must use GitHub App backend');
          if (!adapter.includes("this.authMode === 'legacy_token'")) throw new Error('Legacy token must require explicit mode');
          if (!runtime.includes("const PORT_NAME = 'ld2-github-app'")) throw new Error('Isolated GitHub App port missing');
          if (!entry.includes("installGithubAppRuntime")) throw new Error('GitHub App runtime not bootstrapped');
          if (!ui.includes('data-cc-github')) throw new Error('Dedicated GitHub card missing');
          if (!ui.includes("chrome.runtime.connect({ name: 'ld2-github-app' })")) throw new Error('GitHub UI must use isolated background port');
          if (!ui.includes("window.open('about:blank', 'ld2-github-auth'")) throw new Error('Official popup flow missing');
          if (!ui.includes('Somente repositórios selecionados')) throw new Error('Repository selection copy missing');
          if (!ui.includes("type: 'LD2_GITHUB_TEST'")) throw new Error('Selected repository must be verified before success');
          if (ui.includes('data-cc-action="github"')) throw new Error('GitHub card must not route to legacy modal');
          NODE

      - name: Secret leakage gate
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.md' --exclude='*.yml' --exclude='*.yaml' \
            '-----BEGIN (RSA )?PRIVATE KEY-----|SUPABASE_SERVICE_ROLE_KEY|LD_GITHUB_APP_PRIVATE_KEY[[:space:]]*=' .; then
            echo 'Secret-like material found in extension sources' >&2
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const config = fs.readFileSync('settings/config.js','utf8');
          if (/token:\s*['"][^'"]+['"]/.test(config)) throw new Error('Hardcoded GitHub token detected');
          NODE

      - name: GitHub commit integrity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const sw = fs.readFileSync('background/service-worker.js','utf8');
          const git = fs.readFileSync('github/git-adapter.js','utf8');
          if (!sw.includes('const result = await applyPlan({ id: bundle.id })')) throw new Error('Build must call authoritative applyPlan');
          if (!sw.includes('await adapter.atomicCommit({')) throw new Error('applyPlan must use atomicCommit');
          if (!git.includes('await this.updateBranch(targetBranch, commit.sha)')) throw new Error('atomicCommit must update branch ref');
          if (!git.includes('commitSha: commit.sha')) throw new Error('atomicCommit must return commit SHA');
          NODE

      - name: Preserve free Gemini default
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const config = fs.readFileSync('settings/config.js','utf8');
          if (!config.includes("billingMode: 'free'")) throw new Error('Gemini free default changed');
          if (!config.includes('zeroCost: true')) throw new Error('Zero-cost default changed');
          NODE

      - name: Package Stage 2 candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f Lovable-Decrypter-v2.3-STAGE2-GITHUB-APP.zip Lovable-Decrypter-v2.3-STAGE2-GITHUB-APP.sha256
          zip -qr Lovable-Decrypter-v2.3-STAGE2-GITHUB-APP.zip . \
            -x '.git/*' '.github/*' 'Lovable-Decrypter-v2.3-STAGE2-GITHUB-APP.zip'
          test "$(unzip -Z1 Lovable-Decrypter-v2.3-STAGE2-GITHUB-APP.zip | grep -c '^manifest.json$')" -eq 1
          sha256sum Lovable-Decrypter-v2.3-STAGE2-GITHUB-APP.zip | tee Lovable-Decrypter-v2.3-STAGE2-GITHUB-APP.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Lovable-Decrypter-v2.3-STAGE2-GITHUB-APP
          path: |
            Lovable-Decrypter-v2.3-STAGE2-GITHUB-APP.zip
            Lovable-Decrypter-v2.3-STAGE2-GITHUB-APP.sha256
          if-no-files-found: error
