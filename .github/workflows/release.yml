name: Release Lovable Decrypter

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - '.github/RELEASE_TRIGGER'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            test "$VERSION" = "$MANIFEST_VERSION" || { echo "Tag $VERSION != manifest $MANIFEST_VERSION"; exit 1; }
          else
            VERSION="$MANIFEST_VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package extension
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          zip -qr "Lovable-Decrypter-v${VERSION}.zip" . \
            -x '.git/*' '.github/*' 'updates/latest.json' 'updates/release.json' '*.zip' '*.pem' '*.key' 'RELEASE.md'
          sha256sum "Lovable-Decrypter-v${VERSION}.zip" | tee "Lovable-Decrypter-v${VERSION}.sha256"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          ZIP="Lovable-Decrypter-v${VERSION}.zip"
          SHA="Lovable-Decrypter-v${VERSION}.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$SHA" --clobber
          else
            gh release create "$TAG" "$ZIP" "$SHA" \
              --target "$GITHUB_SHA" \
              --title "Lovable Decrypter v${VERSION}" \
              --generate-notes
          fi

      - name: Publish release metadata to main
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="Lovable-Decrypter-v${VERSION}.zip"
          HASH="$(sha256sum "$ZIP" | awk '{print $1}')"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${ZIP}"
          export VERSION HASH URL
          node <<'NODE' > /tmp/release.json
          const version=process.env.VERSION, sha256=process.env.HASH, download_url=process.env.URL;
          process.stdout.write(JSON.stringify({version,download_url,sha256,notes:`Release v${version}`},null,2)+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout main
          mkdir -p updates
          cp /tmp/release.json updates/release.json
          git add updates/release.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish release metadata v${VERSION}"
            git push origin main
          fi

      - name: Publish signed legacy OTA bridge
        shell: bash
        env:
          RELEASE_FEED_URL: https://kkzxxnfxgrouhkzyszxs.supabase.co/functions/v1/ld-release-feed
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          export VERSION
          ok=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error "${RELEASE_FEED_URL}?release=${VERSION}&attempt=${attempt}&run=${GITHUB_RUN_ID}" -o /tmp/latest.json; then
              if node <<'NODE'
          const fs = require('fs');
          const env = JSON.parse(fs.readFileSync('/tmp/latest.json','utf8'));
          if (!env.payload || !env.signature) process.exit(2);
          const text = Buffer.from(env.payload, 'base64url').toString('utf8');
          const payload = JSON.parse(text);
          if (payload.type !== 'release' || payload.version !== process.env.VERSION) process.exit(3);
          NODE
              then
                ok=1
                break
              fi
            fi
            sleep 3
          done
          test "$ok" = 1 || { echo "Signed feed did not converge to v${VERSION}"; exit 1; }
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          mkdir -p updates
          cp /tmp/latest.json updates/latest.json
          git add updates/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish signed legacy OTA v${VERSION}"
            git push origin main
          fi
