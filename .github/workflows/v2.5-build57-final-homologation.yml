name: v2.5 Build 57 · Final Homologation RC

on:
  push:
    branches: [main, v2.5-build57-final-homologation]
    paths:
      - 'manifest.json'
      - 'settings/config.js'
      - 'release/runtime-package.json'
      - 'release/homologation-v2.5.57.json'
      - 'content/**'
      - 'background/**'
      - 'ui/**'
      - 'supabase/functions/ld-model-gateway/**'
      - 'supabase/functions/ld-messaging/**'
      - 'tests/build48-ui-kernel.test.mjs'
      - 'tests/build49-integrations.test.mjs'
      - 'tests/build50-project-intelligence.test.mjs'
      - 'tests/build51-engineering-suite.test.mjs'
      - 'tests/build52-project-tools-zip.test.mjs'
      - 'tests/build53-settings-preferences.test.mjs'
      - 'tests/build54-update-recovery-center.test.mjs'
      - 'tests/build55-backend-messaging-natural-voice.test.mjs'
      - 'tests/build56-legacy-purge-performance.test.mjs'
      - 'tests/build57-final-homologation.test.mjs'
      - '.github/workflows/v2.5-build57-final-homologation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check content/content.js
      - run: node --check content/zero-cost-runtime-guard.js
      - run: node --check background/model-gateway-bootstrap.js
      - run: node --check ui/ui-kernel-v48.js
      - run: node --check ui/integrations-v49.js
      - run: node --check ui/project-intelligence-v50.js
      - run: node --check ui/engineering-suite-v51.js
      - run: node --check ui/project-tools-v52.js
      - run: node --check ui/settings-v53.js
      - run: node --check ui/update-center-v54.js
      - run: node --check ui/backend-messaging-v55.js
      - run: node tests/build48-ui-kernel.test.mjs
      - run: node tests/build49-integrations.test.mjs
      - run: node tests/build50-project-intelligence.test.mjs
      - run: node tests/build51-engineering-suite.test.mjs
      - run: node tests/build52-project-tools-zip.test.mjs
      - run: node tests/build53-settings-preferences.test.mjs
      - run: node tests/build54-update-recovery-center.test.mjs
      - run: node tests/build55-backend-messaging-natural-voice.test.mjs
      - run: node tests/build56-legacy-purge-performance.test.mjs
      - run: node tests/build57-final-homologation.test.mjs
      - run: node scripts/release-preflight.mjs --candidate
