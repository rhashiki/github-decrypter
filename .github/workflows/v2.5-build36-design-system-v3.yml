name: v2.5 Build 36 · Decrypter Design System 3.0

on:
  push:
    branches: [main]
    paths:
      - 'manifest.json'
      - 'ui/design-system-v3.css'
      - 'ui/launcher-rail-v3.js'
      - '.github/workflows/v2.5-build36-design-system-v3.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: node --check ui/launcher-rail-v3.js

      - name: Validate manifest wiring
        run: |
          node <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('manifest.json','utf8'));
          if (m.version !== '2.5.36') throw new Error('Unexpected version');
          const runtime = m.content_scripts.find(x => x.run_at === 'document_idle' && x.all_frames === false);
          if (!runtime) throw new Error('Main runtime content script missing');
          if (!runtime.js.includes('ui/launcher-rail-v3.js')) throw new Error('Rail launcher not wired');
          if (!runtime.css.includes('ui/design-system-v3.css')) throw new Error('DS3 CSS not wired');
          const early = m.content_scripts.find(x => x.run_at === 'document_start');
          if (!early || early.all_frames !== true || !early.js.includes('content/early-boot-sentinel.js')) throw new Error('Build 34 early boot contract changed');
          NODE

      - name: Validate rail contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('ui/launcher-rail-v3.js','utf8');
          const required = [
            "id:'integrations'", "id:'project'", "id:'intelligence'", "id:'engineering'",
            "id:'recovery'", "id:'activity'", "id:'monitor'", "id:'security'",
            "id:'update'", "id:'account'", "id:'community'", "id:'settings'",
            'COMMUNITY_URL', "activeCategory === 'integrations'", "naturalHeight > railHeight",
            "new MutationObserver(setOpenState)", "new MutationObserver(syncLicenseState)"
          ];
          for (const token of required) if (!s.includes(token)) throw new Error(`Missing contract: ${token}`);
          const settingsIndex = s.indexOf("id:'settings'");
          const communityIndex = s.indexOf("id:'community'");
          if (settingsIndex < communityIndex) throw new Error('Settings must remain the final rail button');
          NODE

      - name: Validate visual contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('ui/design-system-v3.css','utf8');
          const required = [
            'border-radius:26px',
            'justify-content:space-between',
            'transform:translateY(calc(100% + 56px))',
            'transition:transform .82s',
            '.ld3-flyout',
            '.ld3-detail',
            '--ld3-accent:#75dcff'
          ];
          for (const token of required) if (!s.includes(token)) throw new Error(`Missing visual contract: ${token}`);
          NODE
