# Final Build 7 validation gate
name: Validate v2.4 Build 7 Cloud Migrator Complete

on:
  push:
    branches:
      - rebuild-v2.4-build7-cloud-migrator-complete

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build 7 manifest isolation
        run: |
          node <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const cs=m.content_scripts?.[0];
          if(!/Build 7/.test(m.action?.default_title||'')) throw new Error('Build 7 title missing');
          if(cs.run_at!=='document_idle' || cs.all_frames!==false) throw new Error('Unsafe content script timing/frame scope');
          const js=cs.js||[];
          for(const f of ['content/cloud-migrator-runtime-v2.js','ui/cloud-migrator-complete.js']) if(!js.includes(f)) throw new Error(`Missing ${f}`);
          if(js.includes('content/cloud-migrator-runtime.js')) throw new Error('Legacy Build 6 content migrator still loaded');
          if(js.includes('ui/cloud-migrator-core.js')) throw new Error('Legacy Build 6 Cloud Migrator UI still loaded');
          NODE

      - name: Service worker migration runtimes
        run: |
          grep -q "installCloudAssetsRuntime" background/service-worker-entry.js
          grep -q "./cloud-assets-runtime.js" background/service-worker-entry.js
          grep -q "installCloudCompleteRuntime" background/service-worker-entry.js
          grep -q "./cloud-complete-runtime.js" background/service-worker-entry.js
          grep -q "installCloudMigrationRuntime" background/service-worker-entry.js

      - name: JavaScript syntax
        run: |
          node --check background/cloud-assets-runtime.js
          node --check background/cloud-complete-runtime.js
          node --check background/cloud-migration-runtime.js
          node --check content/cloud-migrator-runtime-v2.js
          node --check ui/cloud-migrator-complete.js
          node --check content/lovable-project-runtime.js
          node --check content/composer-bridge-v3.js
          node --check ui/github-autosync.js
          node --check ui/supabase-project-manager.js

      - name: No Lovable host interference
        run: |
          node <<'NODE'
          const fs=require('fs');
          const files=['background/cloud-assets-runtime.js','background/cloud-complete-runtime.js','content/cloud-migrator-runtime-v2.js','ui/cloud-migrator-complete.js'];
          for(const f of files){
            const s=fs.readFileSync(f,'utf8');
            if(/MutationObserver|window\.fetch\s*=|XMLHttpRequest\.prototype|history\.pushState\s*=|history\.replaceState\s*=/.test(s)) throw new Error(`Host interference in ${f}`);
          }
          NODE

      - name: Credentials stay server-side
        run: |
          node <<'NODE'
          const fs=require('fs');
          const bg=fs.readFileSync('background/cloud-assets-runtime.js','utf8')+fs.readFileSync('background/cloud-complete-runtime.js','utf8');
          const ui=fs.readFileSync('ui/cloud-migrator-complete.js','utf8');
          const content=fs.readFileSync('content/cloud-migrator-runtime-v2.js','utf8');
          if(/chrome\.storage[\s\S]{0,180}(source_key|service_role|SUPABASE_DB_URL|DATABASE_URL)/i.test(bg+ui+content)) throw new Error('Source/admin credential persisted client-side');
          if(!content.includes('return out({ok:true,core:!!CORE,assets:!!ASSETS})')) throw new Error('Expected safe helper handoff response missing');
          if(!content.includes('return out({ok:true,count:Object.keys(secrets).length,expected:names.length})')) throw new Error('Expected safe secret handoff response missing');
          if(/out\(\{\s*ok\s*:\s*true\s*,\s*(?:db_url|source_key|service_role)\s*:/i.test(content)) throw new Error('Helper exposes credential in successful response');
          if(!/await post\(ASSETS\.url/.test(content) || !/source_key:sourceKey/.test(content) || !/db_url:db/.test(content)) throw new Error('Server-to-server asset handoff missing');
          NODE

      - name: Complete migration contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const entry=fs.readFileSync('supabase/functions/ld-cloud-migrator-assets/index.ts','utf8');
          const broker=fs.readFileSync('supabase/functions/ld-cloud-migrator-assets/legacy.ts','utf8');
          const complete=['index.ts','auth.ts','config.ts','apply.ts','verify.ts'].map(f=>fs.readFileSync(`supabase/functions/ld-cloud-migrator-complete/${f}`,'utf8')).join('\n');
          const migration=fs.readFileSync('supabase/migrations/20260827124500_cloud_migrator_complete_build7.sql','utf8');
          const manager=fs.readFileSync('supabase/functions/ld-supabase-manager/index.ts','utf8');
          const oauth=fs.readFileSync('supabase/functions/ld-supabase-oauth/index.ts','utf8');
          const assetsRuntime=fs.readFileSync('background/cloud-assets-runtime.js','utf8');
          const completeRuntime=fs.readFileSync('background/cloud-complete-runtime.js','utf8');

          for(const p of ['storage_buckets','storage_objects','storage_policies','realtime','edge_functions','secrets','config','verify']) if(!broker.includes(p)) throw new Error(`Missing phase ${p}`);
          for(const s of ['auth:read','auth:write','edge_functions:read','edge_functions:write','secrets:read','secrets:write','storage:read']) {
            if(!broker.includes(s)) throw new Error(`Missing broker OAuth scope ${s}`);
            if(!manager.includes(s)) throw new Error(`Missing manager OAuth scope ${s}`);
            if(!oauth.includes(s)) throw new Error(`Missing oauth status scope ${s}`);
          }
          for(const s of ['rest:read','rest:write']) if(!complete.includes(s)) throw new Error(`Missing complete OAuth scope ${s}`);
          if(!complete.includes('SUPABASE_REAUTH_REQUIRED')) throw new Error('Rest reauthorization gate missing');
          if(!complete.includes('/postgrest')) throw new Error('PostgREST config migration missing');
          if(!complete.includes('/config/storage')) throw new Error('Storage global config migration missing');
          if(!complete.includes('/config/realtime')) throw new Error('Realtime safe config migration missing');
          if(!complete.includes('strong_verification_ok')) throw new Error('Strong verification checkpoint missing');
          for(const marker of ['storage_objects:','storage_policy:','realtime:','edge_function:','secret:','auth_config:','postgrest_config:']) if(!complete.includes(marker)) throw new Error(`Strong verification marker missing: ${marker}`);
          if(!complete.includes('status:"waiting",phase:"verify"')) throw new Error('Verification must remain resumable on mismatch');

          if(!assetsRuntime.includes("cloudCompleteBackend('preflight')")) throw new Error('Build 7 preflight not wired before prepare');
          if(!assetsRuntime.includes("cloudCompleteBackend('prepare_config'")) throw new Error('Deferred config checkpoint missing');
          if(!assetsRuntime.includes("cloudCompleteBackend('verify_complete'")) throw new Error('Strong verification orchestration missing');
          if(!completeRuntime.includes("section === 'storage'") && !completeRuntime.includes("sec==='storage'")) throw new Error('Storage TOML parser missing');
          if(!completeRuntime.includes("sec==='api'")) throw new Error('PostgREST TOML parser missing');

          if(!entry.includes("startsWith('sb_secret_')")) throw new Error('Modern destination secret key preference missing');
          if(!entry.includes("await import('./legacy.ts')")) throw new Error('Assets broker wrapper does not load preserved implementation');
          if(!manager.includes('SCOPES DA BUILD 7')) throw new Error('Build 7 OAuth bootstrap label missing');
          if(!/BUILTIN_SECRETS/.test(broker)) throw new Error('Built-in secret filter missing');
          if(!/supabase_realtime/.test(broker)) throw new Error('Realtime publication migration missing');
          if(!/revoke all on table public\.ld_cloud_asset_jobs from public, anon, authenticated/i.test(migration)) throw new Error('Asset jobs grants not revoked');
          if(!/enable row level security/i.test(migration)) throw new Error('Asset jobs RLS missing');
          if(!/to service_role/i.test(migration)) throw new Error('Backend database grant missing');
          NODE

      - name: Preserve Build 6 core and Builds 1-5
        run: |
          test -f background/cloud-migration-runtime.js
          test -f supabase/functions/ld-cloud-migrator-broker/index.ts
          test -f content/lovable-project-runtime.js
          test -f ui/github-autosync.js
          test -f content/composer-bridge-v3.js
          test -f content/lovable-project-creator.js
          test -f ui/supabase-project-manager.js
          grep -q "LD2_PLAN_ONLY" content/composer-bridge-v3.js
          grep -q "Aplicar no GitHub" content/composer-bridge-v3.js
          if grep -q "LD2_BUILD_EXECUTE" content/composer-bridge-v3.js; then exit 1; fi

      - name: Package Build 7 candidate
        run: |
          rm -rf /tmp/ld-build7 && mkdir -p /tmp/ld-build7
          rsync -a ./ /tmp/ld-build7/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='supabase' \
            --exclude='*.zip' \
            --exclude='*.sha256' \
            --exclude='.build*_payload*'
          test -f /tmp/ld-build7/manifest.json
          test ! -d /tmp/ld-build7/supabase
          cd /tmp/ld-build7
          zip -qr "$GITHUB_WORKSPACE/Lovable-Decrypter-v2.4-BUILD7-CLOUD-MIGRATOR-COMPLETE.zip" .
          cd "$GITHUB_WORKSPACE"
          sha256sum Lovable-Decrypter-v2.4-BUILD7-CLOUD-MIGRATOR-COMPLETE.zip > Lovable-Decrypter-v2.4-BUILD7-CLOUD-MIGRATOR-COMPLETE.sha256
          unzip -l Lovable-Decrypter-v2.4-BUILD7-CLOUD-MIGRATOR-COMPLETE.zip | grep -q ' manifest.json$'
          if unzip -l Lovable-Decrypter-v2.4-BUILD7-CLOUD-MIGRATOR-COMPLETE.zip | grep -q ' supabase/'; then exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: Lovable-Decrypter-v2.4-BUILD7-CLOUD-MIGRATOR-COMPLETE
          path: |
            Lovable-Decrypter-v2.4-BUILD7-CLOUD-MIGRATOR-COMPLETE.zip
            Lovable-Decrypter-v2.4-BUILD7-CLOUD-MIGRATOR-COMPLETE.sha256
          if-no-files-found: error
