name: v2.6 Build 84 · Trust + Core Integrations

on:
  push:
    branches: [v2.6.84-clean-functional-runtime]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check current Build84 runtime
        run: |
          node --check launcher/launcher-runtime.js
          node --check launcher/runtime-client-v84.js
          node --check launcher/account-controller-v84.js
          node --check launcher/editor-direct-v84.js
          node --check launcher/ux-polish-v84.js
          node --check launcher/integration-resource-manager-v84.js
          node --check launcher/supabase-project-manager-v84.js
          node --check launcher/github-sync-v84.js
          node --check launcher/integration-resource-entrypoints-v84.js
          node --check launcher/gemini-integration-v84.js
          node --check background/runtime-entry-v84.js
          node --check background/runtime-entry-v84-integrations.js
          node --check background/editor-direct-runtime-v84.js
          node --check background/supabase-project-manager-runtime-v84.js
          node --check background/github-sync-runtime-v84.js
          node --check background/build84-service-worker.js
          node --check scripts/test-build84-github-sync.mjs

      - name: Build84 GitHub Sync parity gate
        run: node scripts/test-build84-github-sync.mjs

      - name: Verify validated integrations checkpoint remains intact
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"status": "VALIDADO"' docs/checkpoints/build84-integrations-resource-management-validated.json
          grep -q '"github_resource_manager_nested_once": true' docs/checkpoints/build84-integrations-resource-management-validated.json
          grep -q '"supabase_resource_manager_nested_once": true' docs/checkpoints/build84-integrations-resource-management-validated.json
          grep -q '"duplicate_resource_actions_removed": true' docs/checkpoints/build84-integrations-resource-management-validated.json
          grep -q '"ram_stabilizes": true' docs/checkpoints/build84-integrations-resource-management-validated.json

      - name: Verify GitHub Sync and history contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'GitHub Sync & History' launcher/github-sync-v84.js
          grep -q 'Sincronizar estado' launcher/github-sync-v84.js
          grep -q 'Ver histórico' launcher/github-sync-v84.js
          grep -q 'Comparar' launcher/github-sync-v84.js
          grep -q "type: 'ld84.github.sync.status'" launcher/github-sync-v84.js
          grep -q "type: 'ld84.github.sync.refresh'" launcher/github-sync-v84.js
          grep -q "type: 'ld84.github.sync.history'" launcher/github-sync-v84.js
          grep -q "type: 'ld84.github.sync.compare'" launcher/github-sync-v84.js
          grep -q "GITHUB_PROJECT_BINDING_REQUIRED" background/github-sync-runtime-v84.js
          grep -q "GITHUB_REPOSITORY_NOT_AUTHORIZED" background/github-sync-runtime-v84.js
          grep -q "GITHUB_REPOSITORY_NOT_SELECTED" background/github-sync-runtime-v84.js
          grep -q "bindingAuthority: 'explicit-project-binding'" background/github-sync-runtime-v84.js
          grep -q "writeAuthority: 'editor-direct-explicit-apply'" background/github-sync-runtime-v84.js
          grep -q 'historyReadOnly: true' background/github-sync-runtime-v84.js
          grep -q 'compareReadOnly: true' background/github-sync-runtime-v84.js
          grep -q 'forcePush: false' background/github-sync-runtime-v84.js
          grep -q 'directLovableWrite: false' background/github-sync-runtime-v84.js
          ! grep -q "method: 'PATCH'" background/github-sync-runtime-v84.js
          ! grep -q "method: 'DELETE'" background/github-sync-runtime-v84.js
          ! grep -q '/git/' background/github-sync-runtime-v84.js
          ! grep -q '/contents/' background/github-sync-runtime-v84.js
          ! grep -q '/pulls' background/github-sync-runtime-v84.js

      - name: Verify clean architecture invariants
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            launcher/launcher-runtime.js \
            launcher/runtime-client-v84.js \
            launcher/account-controller-v84.js \
            launcher/editor-direct-v84.js \
            launcher/ux-polish-v84.js \
            launcher/integration-resource-manager-v84.js \
            launcher/supabase-project-manager-v84.js \
            launcher/github-sync-v84.js \
            launcher/integration-resource-entrypoints-v84.js \
            launcher/gemini-integration-v84.js \
            background/runtime-entry-v84.js \
            background/runtime-entry-v84-integrations.js \
            background/editor-direct-runtime-v84.js \
            background/supabase-project-manager-runtime-v84.js \
            background/github-sync-runtime-v84.js \
            background/build84-service-worker.js; do
            ! grep -q 'MutationObserver' "$f"
            ! grep -q 'setInterval' "$f"
            ! grep -q 'setAttribute([^)]*inert' "$f"
          done
          ! grep -q 'chrome.alarms' background/github-sync-runtime-v84.js
          ! grep -q 'document.body' launcher/github-sync-v84.js
          ! grep -q 'document.body' launcher/supabase-project-manager-v84.js
          ! grep -q 'document.body' launcher/gemini-integration-v84.js

      - name: Package flat installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Lovable-Decrypter-v2.6.84-github-sync-test.zip"
          mapfile -t PATHS < <(node -e "require('./release/runtime-package.json').paths.forEach(p=>console.log(p))")
          zip -qr "$ZIP" "${PATHS[@]}"
          unzip -Z1 "$ZIP" > /tmp/build84-files.txt

          for required in \
            manifest.json \
            launcher/launcher-runtime.js \
            launcher/runtime-client-v84.js \
            launcher/account-controller-v84.js \
            launcher/editor-direct-v84.js \
            launcher/ux-polish-v84.js \
            launcher/integration-resource-manager-v84.js \
            launcher/supabase-project-manager-v84.js \
            launcher/github-sync-v84.js \
            launcher/integration-resource-entrypoints-v84.js \
            launcher/gemini-integration-v84.js \
            background/runtime-entry-v84.js \
            background/runtime-entry-v84-integrations.js \
            background/editor-direct-runtime-v84.js \
            background/supabase-project-manager-runtime-v84.js \
            background/github-sync-runtime-v84.js \
            background/build84-service-worker.js; do
            grep -qx "$required" /tmp/build84-files.txt
          done

          ! grep -E '^(content|ui|core|github|storage|supabase|tools|updates)/' /tmp/build84-files.txt
          test "$(grep -Ec '\.zip$' /tmp/build84-files.txt || true)" -eq 0
          test "$(grep -Ec '^manifest\.json$' /tmp/build84-files.txt || true)" -eq 1
          sha256sum "$ZIP" | tee "${ZIP}.sha256"

      - name: Upload flat Build84 GitHub Sync test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Lovable-Decrypter-v2.6.84-github-sync-test
          path: |
            Lovable-Decrypter-v2.6.84-github-sync-test.zip
            Lovable-Decrypter-v2.6.84-github-sync-test.zip.sha256
          if-no-files-found: error
          retention-days: 14
