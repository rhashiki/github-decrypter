name: v2.6 Build 84 · Trust + Core Integrations

on:
  push:
    branches: [v2.6.84-clean-functional-runtime]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check clean shipped runtime
        run: |
          node --check launcher/launcher-runtime.js
          node --check launcher/runtime-client-v84.js
          node --check launcher/account-controller-v84.js
          node --check launcher/ux-polish-v84.js
          node --check launcher/integration-resource-manager-v84.js
          node --check launcher/integration-resource-entrypoints-v84.js
          node --check background/runtime-entry-v84.js
          node --check background/runtime-entry-v84-integrations.js
          node --check scripts/test-build84-clean-foundation.mjs

      - name: Build84 clean runtime and functional parity gate
        run: node scripts/test-build84-clean-foundation.mjs

      - name: Verify deterministic integration resource visibility
        shell: bash
        run: |
          set -euo pipefail
          grep -q "GitHub · Gerenciar repositórios" launcher/integration-resource-entrypoints-v84.js
          grep -q "Supabase · Gerenciar projetos" launcher/integration-resource-entrypoints-v84.js
          grep -q "title !== 'Integrações'" launcher/integration-resource-entrypoints-v84.js
          grep -q 'data-ld-resource-entrypoint' launcher/integration-resource-entrypoints-v84.js
          grep -q 'ensureDetailEntry' launcher/integration-resource-entrypoints-v84.js
          grep -q "manageResources.textContent = moduleId === 'github' ? 'Gerenciar repositórios' : 'Gerenciar projetos'" launcher/runtime-client-v84.js
          grep -q 'Gerenciar acesso no GitHub' launcher/integration-resource-manager-v84.js
          grep -q 'Salvar seleção' launcher/integration-resource-manager-v84.js
          ! grep -q 'MutationObserver' launcher/integration-resource-entrypoints-v84.js
          ! grep -q 'setInterval' launcher/integration-resource-entrypoints-v84.js
          ! grep -q 'setTimeout' launcher/integration-resource-entrypoints-v84.js

      - name: Verify clean architecture invariants
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            launcher/launcher-runtime.js \
            launcher/runtime-client-v84.js \
            launcher/account-controller-v84.js \
            launcher/ux-polish-v84.js \
            launcher/integration-resource-manager-v84.js \
            launcher/integration-resource-entrypoints-v84.js \
            background/runtime-entry-v84.js \
            background/runtime-entry-v84-integrations.js; do
            ! grep -q 'MutationObserver' "$f"
            ! grep -q 'setInterval' "$f"
            ! grep -q 'setAttribute([^)]*inert' "$f"
          done
          ! grep -q 'chrome.alarms' background/runtime-entry-v84.js
          ! grep -q 'chrome.alarms' background/runtime-entry-v84-integrations.js

      - name: Package flat installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Lovable-Decrypter-v2.6.84-integrations-test.zip"
          mapfile -t PATHS < <(node -e "require('./release/runtime-package.json').paths.forEach(p=>console.log(p))")
          zip -qr "$ZIP" "${PATHS[@]}"
          unzip -Z1 "$ZIP" > /tmp/build84-files.txt

          for required in \
            manifest.json \
            launcher/launcher-runtime.js \
            launcher/runtime-client-v84.js \
            launcher/account-controller-v84.js \
            launcher/ux-polish-v84.js \
            launcher/integration-resource-manager-v84.js \
            launcher/integration-resource-entrypoints-v84.js \
            background/runtime-entry-v84.js \
            background/runtime-entry-v84-integrations.js; do
            grep -qx "$required" /tmp/build84-files.txt
          done

          ! grep -E '^(content|ui|core|github|storage|supabase|tools|updates)/' /tmp/build84-files.txt
          test "$(grep -Ec '\.zip$' /tmp/build84-files.txt || true)" -eq 0
          sha256sum "$ZIP" | tee "${ZIP}.sha256"

      - name: Upload flat Build84 integrations test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Lovable-Decrypter-v2.6.84-integrations-test
          path: |
            Lovable-Decrypter-v2.6.84-integrations-test.zip
            Lovable-Decrypter-v2.6.84-integrations-test.zip.sha256
          if-no-files-found: error
          retention-days: 14
