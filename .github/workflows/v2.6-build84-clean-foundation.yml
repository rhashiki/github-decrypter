name: v2.6 Build 84 · Trust + Core Integrations

on:
  push:
    branches: [v2.6.84-clean-functional-runtime]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check clean shipped runtime
        run: |
          node --check launcher/launcher-runtime.js
          node --check launcher/runtime-client-v84.js
          node --check launcher/account-controller-v84.js
          node --check launcher/ux-polish-v84.js
          node --check background/runtime-entry-v84.js
          node --check scripts/test-build84-clean-foundation.mjs

      - name: Build84 clean runtime, trust and integrations gate
        run: node scripts/test-build84-clean-foundation.mjs

      - name: Verify compact launcher UX and parity controls
        shell: bash
        run: |
          set -euo pipefail
          grep -q '#detail .foot' launcher/ux-polish-v84.js
          grep -q '#detail > .label' launcher/ux-polish-v84.js
          grep -q '#ld84-module-modal .ld84-note' launcher/ux-polish-v84.js
          grep -q 'width:58px!important' launcher/ux-polish-v84.js
          grep -q 'width:52px!important' launcher/ux-polish-v84.js
          grep -q 'height:min(74vh,610px)!important' launcher/ux-polish-v84.js
          grep -q 'gap:4px!important' launcher/ux-polish-v84.js
          grep -q "MONITOR_KEY = 'ld84_monitor_enabled'" launcher/ux-polish-v84.js
          grep -q "parityButton('monitor', 'Monitor ON'" launcher/ux-polish-v84.js
          grep -q "parityButton('editor-direct', 'Editor Direto'" launcher/ux-polish-v84.js
          grep -q "label === 'Ver estado' || label === 'Detalhes'" launcher/ux-polish-v84.js
          grep -q "showLoadingModal(shadow, moduleId" launcher/ux-polish-v84.js
          grep -q "new CustomEvent('ld84:monitor-changed'" launcher/ux-polish-v84.js
          ! grep -q 'MutationObserver' launcher/ux-polish-v84.js
          ! grep -q 'setInterval' launcher/ux-polish-v84.js

      - name: Verify protocol-based trust source
        shell: bash
        run: |
          set -euo pipefail
          grep -q "SUPPORTED_PROTOCOLS=new Set(\['ld-runtime-bus/1'\])" supabase/functions/ld-trust-attest/index.ts
          grep -q "compatibility:'protocol'" supabase/functions/ld-trust-attest/index.ts
          ! grep -q "const EXPECTED_VERSION='2.4.21'" supabase/functions/ld-trust-attest/index.ts

      - name: Package flat installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Lovable-Decrypter-v2.6.84-integrations-test.zip"
          mapfile -t PATHS < <(node -e "require('./release/runtime-package.json').paths.forEach(p=>console.log(p))")
          zip -qr "$ZIP" "${PATHS[@]}"
          unzip -Z1 "$ZIP" > /tmp/build84-files.txt

          for required in \
            manifest.json \
            launcher/launcher-runtime.js \
            launcher/runtime-client-v84.js \
            launcher/account-controller-v84.js \
            launcher/ux-polish-v84.js \
            background/runtime-entry-v84.js; do
            grep -qx "$required" /tmp/build84-files.txt
          done

          ! grep -E '^(content|ui|core|github|storage|supabase|tools|updates)/' /tmp/build84-files.txt
          ! grep -qx 'background/service-worker-entry.js' /tmp/build84-files.txt
          ! grep -qx 'background/canonical-runtime-entry.js' /tmp/build84-files.txt
          ! grep -qx 'launcher/canonical-runtime-client.js' /tmp/build84-files.txt
          test "$(grep -Ec '\.zip$' /tmp/build84-files.txt || true)" -eq 0
          sha256sum "$ZIP" | tee "${ZIP}.sha256"

      - name: Upload flat Build84 integrations test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Lovable-Decrypter-v2.6.84-integrations-test
          path: |
            Lovable-Decrypter-v2.6.84-integrations-test.zip
            Lovable-Decrypter-v2.6.84-integrations-test.zip.sha256
          if-no-files-found: error
          retention-days: 14
