name: Create owner key temp

on:
  push:
    branches:
      - diagnostic-v2.2.1-safe-core
    paths:
      - .github/workflows/create-owner-key-temp.yml

permissions:
  contents: read

jobs:
  create-key:
    runs-on: ubuntu-latest
    steps:
      - name: Generate owner key without artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS 'https://kkzxxnfxgrouhkzyszxs.supabase.co/functions/v1/ld-owner-key-bootstrap-temp?k=VGL3jsZylK-YkJF4Xl9SHqiFd4hO9hkMRwtRHOKrDOU' -o /tmp/owner-key-result.json
          node -e "const x=require('/tmp/owner-key-result.json'); if(!x.ok || !x.license_id) process.exit(1)"
