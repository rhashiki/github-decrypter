services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.32.14}
    restart: unless-stopped
    volumes:
      - ${OLLAMA_DATA_DIR:-./.cache/ollama}:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-15m}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 8s
      retries: 10
      start_period: 30s

  ollama-model-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.32.14}
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-lc"]
    command: ["ollama pull '${OLLAMA_MODEL:-qwen3-coder:30b}'"]

  decrypter-local:
    image: python:3.12-slim
    restart: unless-stopped
    depends_on:
      ollama-model-init:
        condition: service_completed_successfully
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORT:-8000}:8000"
    volumes:
      - ./ollama-gateway.py:/opt/decrypter/ollama-gateway.py:ro
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3-coder:30b}
      SERVED_MODEL_NAME: ${SERVED_MODEL_NAME:-decrypter-local}
      RUNTIME_TOKEN: ${RUNTIME_TOKEN}
      PORT: 8000
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-8000000}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-210}
    command: ["python", "/opt/decrypter/ollama-gateway.py"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=6).read()\""]
      interval: 20s
      timeout: 8s
      retries: 10
      start_period: 60s

  decrypter-worker-agent:
    image: python:3.12-slim
    restart: unless-stopped
    depends_on:
      decrypter-local:
        condition: service_healthy
    volumes:
      - ./worker-agent.py:/opt/decrypter/worker-agent.py:ro
    environment:
      DECRYPTER_CONTROL_URL: ${DECRYPTER_CONTROL_URL}
      DECRYPTER_WORKER_SECRET: ${DECRYPTER_WORKER_SECRET}
      DECRYPTER_WORKER_ENDPOINT: ${DECRYPTER_WORKER_ENDPOINT}
      DECRYPTER_WORKER_INSTANCE_KEY: ${DECRYPTER_WORKER_INSTANCE_KEY:-}
      DECRYPTER_WORKER_ZONE: ${DECRYPTER_WORKER_ZONE:-}
      DECRYPTER_WORKER_MAX_INFLIGHT: ${DECRYPTER_WORKER_MAX_INFLIGHT:-1}
      DECRYPTER_HEARTBEAT_SECONDS: ${DECRYPTER_HEARTBEAT_SECONDS:-15}
      DECRYPTER_POOL_CODE: ${DECRYPTER_POOL_CODE:-decrypter-local-primary}
      DECRYPTER_RUNTIME_URL: http://decrypter-local:8000
      DECRYPTER_RUNTIME_KIND: ollama
      DECRYPTER_RUNTIME_MODEL: ${OLLAMA_MODEL:-qwen3-coder:30b}
      DECRYPTER_MODEL_LABEL: ${DECRYPTER_MODEL_LABEL:-Qwen3-Coder 30B A3B · Ollama}
      RUNTIME_TOKEN: ${RUNTIME_TOKEN}
      SERVED_MODEL_NAME: ${SERVED_MODEL_NAME:-decrypter-local}
    command: ["python", "/opt/decrypter/worker-agent.py"]
