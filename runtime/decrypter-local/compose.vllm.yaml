services:
  decrypter-local:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    restart: unless-stopped
    ipc: host
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORT:-8000}:8000"
    volumes:
      - ${HF_CACHE_DIR:-./.cache/huggingface}:/root/.cache/huggingface
    command:
      - --model
      - ${MODEL_ID:-Qwen/Qwen3-Coder-30B-A3B-Instruct}
      - --served-model-name
      - ${SERVED_MODEL_NAME:-decrypter-local}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --api-key
      - ${RUNTIME_TOKEN}
      - --max-model-len
      - ${MAX_MODEL_LEN:-65536}
      - --gpu-memory-utilization
      - ${GPU_MEMORY_UTILIZATION:-0.92}
      - --enable-prefix-caching
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health',headers={'Authorization':'Bearer ${RUNTIME_TOKEN}'}); urllib.request.urlopen(r,timeout=5).read()\""]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 180s

  decrypter-worker-agent:
    image: python:3.12-slim
    restart: unless-stopped
    depends_on:
      decrypter-local:
        condition: service_healthy
    volumes:
      - ./worker-agent.py:/opt/decrypter/worker-agent.py:ro
    environment:
      DECRYPTER_CONTROL_URL: ${DECRYPTER_CONTROL_URL}
      DECRYPTER_WORKER_SECRET: ${DECRYPTER_WORKER_SECRET}
      DECRYPTER_WORKER_ENDPOINT: ${DECRYPTER_WORKER_ENDPOINT}
      DECRYPTER_WORKER_INSTANCE_KEY: ${DECRYPTER_WORKER_INSTANCE_KEY:-}
      DECRYPTER_WORKER_ZONE: ${DECRYPTER_WORKER_ZONE:-}
      DECRYPTER_WORKER_MAX_INFLIGHT: ${DECRYPTER_WORKER_MAX_INFLIGHT:-4}
      DECRYPTER_HEARTBEAT_SECONDS: ${DECRYPTER_HEARTBEAT_SECONDS:-15}
      DECRYPTER_POOL_CODE: ${DECRYPTER_POOL_CODE:-decrypter-local-primary}
      DECRYPTER_RUNTIME_URL: http://decrypter-local:8000
      DECRYPTER_RUNTIME_KIND: vllm
      DECRYPTER_RUNTIME_MODEL: ${MODEL_ID:-Qwen/Qwen3-Coder-30B-A3B-Instruct}
      DECRYPTER_MODEL_LABEL: ${DECRYPTER_MODEL_LABEL:-Qwen3-Coder 30B A3B · vLLM}
      RUNTIME_TOKEN: ${RUNTIME_TOKEN}
      SERVED_MODEL_NAME: ${SERVED_MODEL_NAME:-decrypter-local}
    command: ["python", "/opt/decrypter/worker-agent.py"]
